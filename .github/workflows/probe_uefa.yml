name: Sonde UEFA (diagnostic)

on:
  push:
    branches: ['ccr-*']
    paths: ['tools/probe_uefa.py', '.github/workflows/probe_uefa.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sonde UEFA
        env:
          PYTHONUNBUFFERED: "1"
        run: python tools/probe_uefa.py
