name: Sonde buts UEFA (diagnostic)
on:
  push:
    branches: ['ccr-*']
    paths: ['tools/probe_goals.py', '.github/workflows/probe_goals.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe_goals.py
