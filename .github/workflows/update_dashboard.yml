name: Mise à jour Coupes d'Europe (23h30 & Test Semaine)

on:
  schedule:
    - cron: '30 22 * * 2,3,4'

  workflow_dispatch:
    inputs:
      mode_test_semaine:
        description: 'Récupérer tous les matchs européens de la semaine (Mardi à Jeudi) ?'
        required: true
        default: true
        type: boolean
      date_specifique:
        description: 'Ou forcer une date précise (YYYY-MM-DD, laisser vide sinon)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Exécution du pipeline (collecte ESPN + agents Gemini Flash + push ntfy)
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DATE_SPECIFIQUE: ${{ inputs.date_specifique }}
          MODE_SEMAINE: ${{ inputs.mode_test_semaine }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$DATE_SPECIFIQUE" ]; then
              python run_pipeline.py --save-raw raw_espn --date "$DATE_SPECIFIQUE"
            elif [ "$MODE_SEMAINE" = "true" ]; then
              python run_pipeline.py --save-raw raw_espn --week
            else
              python run_pipeline.py
            fi
          else
            python run_pipeline.py
          fi

      - name: Archivage des réponses ESPN brutes (debug, 7 jours)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: raw-espn
          path: |
            raw_espn/
            data_raw.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Publication de data.json sur GitHub Pages (si modifié)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Aucune modification de data.json à publier."
          else
            git commit -m "chore: mise à jour automatique des résultats (UEFA)"
            git push
          fi
