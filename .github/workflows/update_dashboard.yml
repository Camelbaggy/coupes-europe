name: Mise à jour Coupes d'Europe (soirée, battement & test semaine)

on:
  schedule:
    - cron: '30 22 * * 2,3,4'
    # finale de la Ligue des champions : un samedi de fin mai / début juin (sans match, le pipeline s'arrête seul)
    - cron: '30 22 * 5,6 6'

  workflow_dispatch:
    inputs:
      mode_test_semaine:
        description: 'Récupérer tous les matchs européens de la semaine (Mardi à Jeudi) ?'
        required: true
        default: true
        type: boolean
      date_specifique:
        description: 'Ou forcer une date précise (YYYY-MM-DD, laisser vide sinon)'
        required: false
        type: string
      forcer:
        description: 'Retraiter une soirée déjà complète et notifiée (--forcer)'
        required: false
        default: false
        type: boolean
      renotifier:
        description: 'Renvoyer le push ntfy même si la soirée a déjà été notifiée (--renotifier)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# un seul passage à la fois (data.json et etat_soirees.json sont commités) ; un passage en attente n'annule pas celui en cours
concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Soirée visée (calculée une seule fois pour tout le passage)
        id: cible
        env:
          DATE_SPECIFIQUE: ${{ inputs.date_specifique }}
          MODE_SEMAINE: ${{ inputs.mode_test_semaine }}
        run: |
          # vide = essai --week (ni état, ni vérification de publication, ni alerte)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$DATE_SPECIFIQUE" ]; then SOIREE="$DATE_SPECIFIQUE"
            elif [ "$MODE_SEMAINE" = "true" ]; then SOIREE=""
            else SOIREE=$(python -c "import run_pipeline; print(run_pipeline.date_soiree_par_defaut())"); fi
          else
            SOIREE=$(python -c "import run_pipeline; print(run_pipeline.date_soiree_par_defaut())")
          fi
          echo "Soirée visée : ${SOIREE:-(semaine d'essai)}"
          echo "soiree=$SOIREE" >> "$GITHUB_OUTPUT"

      - name: Collecte UEFA + résumés Gemini Flash (sans push ntfy)
        id: collecte
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOIREE: ${{ steps.cible.outputs.soiree }}
          FORCER: ${{ inputs.forcer }}
          RENOTIFIER: ${{ inputs.renotifier }}
        run: |
          # Une soirée suit les règles d'état de soirees.py ; seul --week (essai) les contourne.
          # La notification part plus loin (--notifier), seulement une fois la page publiée vérifiée à jour.
          if [ -z "$SOIREE" ]; then
            python run_pipeline.py --save-raw raw_espn --week
          else
            OPTS=""
            [ "$FORCER" = "true" ] && OPTS="$OPTS --forcer"
            [ "$RENOTIFIER" = "true" ] && OPTS="$OPTS --renotifier"
            python run_pipeline.py --save-raw raw_espn --date "$SOIREE" $OPTS
          fi

      - name: Archivage des réponses ESPN brutes (debug, 7 jours)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: raw-espn
          path: |
            raw_espn/
            data_raw.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Publication de data.json et etat_soirees.json (si modifiés)
        # échec du push = job en échec : pas de notification de résultats, alerte d'échec plus bas
        id: publier
        if: success()
        run: bash .github/scripts/publier.sh

      - name: Notification après vérification de la publication (origin/main, puis page publique)
        id: notif
        if: success() && steps.cible.outputs.soiree != ''
        env:
          PYTHONUNBUFFERED: "1"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          SOIREE: ${{ steps.cible.outputs.soiree }}
          RENOTIFIER: ${{ inputs.renotifier }}
        run: |
          OPTS=""
          [ "$RENOTIFIER" = "true" ] && OPTS="--renotifier"
          python run_pipeline.py --notifier "$SOIREE" $OPTS

      - name: Publication de l'état « notifié » (etat_soirees.json)
        if: success() && steps.cible.outputs.soiree != ''
        run: bash .github/scripts/publier.sh --etat-seul

      - name: Alerte ntfy d'échec de publication
        if: failure() && steps.cible.outputs.soiree != ''
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SOIREE: ${{ steps.cible.outputs.soiree }}
          OUTCOME_COLLECTE: ${{ steps.collecte.outcome }}
          OUTCOME_PUBLIER: ${{ steps.publier.outcome }}
          OUTCOME_NOTIF: ${{ steps.notif.outcome }}
        run: |
          if [ "$OUTCOME_COLLECTE" = "failure" ]; then CAUSE=collecte
          elif [ "$OUTCOME_PUBLIER" = "failure" ]; then CAUSE=push
          else CAUSE=page_non_a_jour; fi
          python run_pipeline.py --alerte "$SOIREE" --cause "$CAUSE"
          # mémoriser l'alerte (anti-spam du battement) : meilleur effort, un push en échec peut encore échouer
          bash .github/scripts/publier.sh --etat-seul || true
