name: Mise à jour Coupes d'Europe (23h30 & Test Semaine)

on:
  schedule:
    - cron: '30 22 * * 2,3,4'

  workflow_dispatch:
    inputs:
      mode_test_semaine:
        description: 'Récupérer tous les matchs européens de la semaine (Mardi à Jeudi) ?'
        required: true
        default: true
        type: boolean
      date_specifique:
        description: 'Ou forcer une date précise (YYYY-MM-DD, laisser vide sinon)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Exécution du Pipeline (Collecte FotMob + Agents Flash + Push ntfy)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.date_specifique }}" ]; then
              python run_pipeline.py --date "${{ inputs.date_specifique }}"
            elif [ "${{ inputs.mode_test_semaine }}" = "true" ]; then
              python run_pipeline.py --week
            else
              python run_pipeline.py
            fi
          else
            python run_pipeline.py
          fi

      - name: Publication de data.json sur GitHub Pages (si modifié)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Aucune modification de data.json à publier."
          else
            git commit -m "chore: mise à jour automatique des résultats (FotMob)"
            git push
          fi
