<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0f17" />
  <title>Coupes d'Europe</title>
  <style>
    :root {
      --app-h: 100vh;
      --sheet-gap: calc(10px + env(safe-area-inset-top, 0px));
      --bg-main: #0b0f17;
      --bg-card: #151c28;
      --bg-card-hover: #1c2536;
      --bg-elevated: #202b3d;
      --border: #263248;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-ucl: #38bdf8;
      --accent-uel: #fb923c;
      --accent-uecl: #34d399;
      /* Championnats (étape 2 des championnats) */
      --accent-fl1: #facc15;
      --accent-pl: #c084fc;
      --accent-liga: #f87171;
      --accent-sa: #22d3ee;
      --accent-bl: #a3e635;
      --zone-ucl: #38bdf8;
      --zone-uel: #fb923c;
      --zone-uecl: #34d399;
      --zone-barrage: #f59e0b;
      --zone-relegation: #ef4444;
      --french-accent: #60a5fa;
      --zone-top8: #10b981;
      --zone-playoff: #f59e0b;
      --zone-elim: #ef4444;
      --or: #fbbf24;
      --argent: #cbd5e1;
      --home-color: #38bdf8;
      --away-color: #f43f5e;
      /* Variantes lisibles (contraste AA) des couleurs d'équipe pour le texte */
      --home-ink: color-mix(in srgb, var(--home-color) 80%, var(--text-main));
      --away-ink: color-mix(in srgb, var(--away-color) 55%, var(--text-main));
      /* Surchargées en ligne par couleursMatch() / coulVars() : couleur de l'aplat, encre lisible sur la page, texte posé sur l'aplat, liseré */
      --home-on: #fff; --away-on: #fff; --home-bord: transparent; --away-bord: transparent;
      --club-color: var(--accent-ucl); --club-ink: var(--accent-ucl); --club-on: #000; --club-bord: transparent;
    }

    [hidden] { display: none !important; }
    img.flag.logo-club { object-fit: contain; border: none; box-shadow: none; border-radius: 0; background: none; height: 18px; }
    /* Un balayage horizontal sert aux onglets (attachTabSwipe) : pas de retour arrière du navigateur par-dessus */
    html, body { overscroll-behavior-x: none; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.45;
      padding-bottom: 48px;
      overflow-x: hidden;
    }

    /* HEADER & NAVIGATION PAR ONGLETS */
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(11, 15, 23, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .app-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-live {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--zone-top8);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .tabs-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 10px 4px;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s ease;
    }

    .tab-btn.active[data-comp="ucl"] {
      color: var(--accent-ucl);
      border-bottom-color: var(--accent-ucl);
    }
    .tab-btn.active[data-comp="uel"] {
      color: var(--accent-uel);
      border-bottom-color: var(--accent-uel);
    }
    .tab-btn.active[data-comp="uecl"] {
      color: var(--accent-uecl);
      border-bottom-color: var(--accent-uecl);
    }
    .tab-btn.active { color: var(--tab-accent, var(--accent-ucl)); border-bottom-color: var(--tab-accent, var(--accent-ucl)); }
    .tabs-bar.n5 { grid-template-columns: repeat(5, 1fr); gap: 2px; }
    .tabs-bar.n5 .tab-btn { font-size: 0.74rem; padding: 10px 1px; }
    .tabs-bar[hidden] { display: none; }
    header.accueil { padding-bottom: 12px; }
    header.accueil .header-top { margin-bottom: 0; }
    .home-btn { background: none; border: none; color: inherit; font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 4px 0; min-height: 36px; }
    .home-btn:focus-visible { outline: 2px solid var(--accent-ucl); outline-offset: 2px; border-radius: 6px; }
    .home-btn .back { font-size: 1.1rem; color: var(--text-muted); }
    header.accueil .home-btn .back { display: none; }
    .espace-t { color: var(--text-muted); font-weight: 600; }
    /* Lien vers le dashboard cyclisme (Camelbaggy/courses-cyclistes), sur l'accueil seulement */
    .sport-lien { display: none; margin-left: 4px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 99px; color: var(--text-main); font-size: 0.78rem; font-weight: 600; text-decoration: none; white-space: nowrap; min-height: 32px; align-items: center; }
    header.accueil .sport-lien { display: inline-flex; }
    .sport-lien:hover { background: var(--bg-card-hover); }
    .sport-lien:focus-visible { outline: 2px solid var(--accent-ucl); outline-offset: 2px; }

    /* Accueil : derniers résultats + tuiles des compétitions */
    #accueil h2.acc-h { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin: 4px 0 10px; font-weight: 700; }
    .acc-jour { font-size: 1.05rem; font-weight: 700; margin-bottom: 10px; }
    .acc-bloc { background: var(--bg-card); border: 1px solid var(--border); border-left: 4px solid var(--c-accent, var(--accent-ucl)); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
    .acc-bloc-h { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px; background: none; border: none; color: var(--text-main); font: inherit; text-align: left; cursor: pointer; min-height: 48px; }
    .acc-bloc-h b { font-size: 0.95rem; }
    .acc-bloc-h small { color: var(--text-muted); font-size: 0.75rem; display: block; font-weight: 500; }
    .acc-bloc-h .go { color: var(--c-accent, var(--accent-ucl)); font-size: 0.8rem; font-weight: 700; white-space: nowrap; }
    .acc-m { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 9px 14px; border: none; border-top: 1px solid var(--border); background: none; color: var(--text-main); font: inherit; cursor: pointer; min-height: 44px; }
    .acc-m:hover { background: var(--bg-card-hover); }
    .acc-m .eq { font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
    .acc-m .eq.d { justify-content: flex-end; text-align: right; }
    .acc-m .sc { font-weight: 800; font-variant-numeric: tabular-nums; background: var(--bg-elevated); border-radius: 8px; padding: 2px 10px; min-width: 52px; text-align: center; }
    .acc-m .sc.av { font-weight: 600; color: var(--text-muted); font-size: 0.8rem; }
    .acc-m .is-fr { color: var(--french-accent); font-weight: 700; }
    .acc-grille { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
    .acc-tuile { background: var(--bg-card); border: 1px solid var(--border); border-top: 3px solid var(--c-accent, var(--accent-ucl)); border-radius: 12px; padding: 12px; text-align: left; color: var(--text-main); font: inherit; cursor: pointer; min-height: 86px; display: flex; flex-direction: column; gap: 4px; }
    .acc-tuile:hover { background: var(--bg-card-hover); }
    .acc-tuile:focus-visible, .acc-bloc-h:focus-visible, .acc-m:focus-visible { outline: 2px solid var(--c-accent, var(--accent-ucl)); outline-offset: -2px; }
    .acc-tuile b { font-size: 0.92rem; }
    .acc-tuile span { font-size: 0.75rem; color: var(--text-muted); }
    .acc-tuile .tt { color: var(--c-accent, var(--accent-ucl)); font-weight: 700; font-size: 0.78rem; }
    .acc-note { color: var(--text-muted); font-size: 0.8rem; padding: 4px 2px 12px; }

    /* Menu des journées / tours (propre à chaque coupe) : bouton en tête du contenu + feuille du bas */
    .tour-bar { display: flex; align-items: stretch; gap: 8px; margin-bottom: -8px; }
    .tour-bar[hidden] { display: none; }
    #comp-view.ligue .tour-bar { margin-bottom: 14px; }
    .tour-btn {
      flex: 1; min-width: 0; min-height: 52px; display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 14px; text-align: left;
      background: var(--bg-card); color: var(--text-main); font: inherit; cursor: pointer;
      border: 1px solid var(--border); border-left: 4px solid var(--tour-accent, var(--accent-ucl)); border-radius: 12px;
    }
    .tour-btn:focus-visible, .tour-opt:focus-visible { outline: 2px solid var(--tour-accent, var(--accent-ucl)); outline-offset: 2px; }
    .tour-btn[aria-expanded="true"] { background: var(--bg-card-hover); }
    .tour-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
    .tour-t { font-size: 1rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tour-d { font-size: 0.76rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tour-chev { width: 12px; height: 8px; flex-shrink: 0; opacity: 0.8; }
    .tour-bar .info-btn { align-self: center; }
    .date-sep { grid-column: 1 / -1; font-size: 0.76rem; font-weight: 700; color: var(--text-muted); margin-top: 4px; }
    .date-sep::first-letter { text-transform: uppercase; }
    .date-sep:first-child { margin-top: 0; }
    .tour-backdrop {
      position: fixed; top: 0; left: 0; right: 0; height: var(--app-h); z-index: 56; display: none; align-items: flex-end; justify-content: center;
      background: rgba(0, 0, 0, 0.6);
    }
    .tour-backdrop.open { display: flex; }
    .tour-sheet {
      background: var(--bg-card); width: 100%; max-width: 520px; max-height: calc(var(--app-h) - var(--sheet-gap) - 40px); display: flex; flex-direction: column;
      border-radius: 20px 20px 0 0; border-top: 1px solid var(--border); overflow: hidden; animation: slideUp 0.2s ease-out; will-change: transform;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .tour-sheet.settle { transition: transform 0.22s ease-out; }
    @media (prefers-reduced-motion: reduce) { .tour-sheet.settle { transition: none; } }
    .tour-sheet .sheet-handle { background: var(--bg-card); }
    .tour-head { touch-action: none; display: flex; justify-content: space-between; align-items: center; padding: 2px 16px 10px; border-bottom: 1px solid var(--border); }
    .tour-head b { font-size: 1rem; }
    .tour-head small { display: block; font-size: 0.76rem; color: var(--text-muted); }
    .tour-list { overflow-y: auto; flex: 1; min-height: 0; overscroll-behavior: contain; padding: 4px 12px 16px; }
    .tour-grp { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); padding: 14px 4px 6px; }
    .tour-opt {
      width: 100%; min-height: 52px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin-bottom: 4px; text-align: left;
      background: transparent; color: var(--text-main); font: inherit; cursor: pointer; border: 1px solid transparent; border-radius: 12px;
    }
    .tour-opt .tour-t { font-weight: 700; }
    .tour-opt:active { background: var(--bg-card-hover); }
    .tour-opt[aria-selected="true"] { background: color-mix(in srgb, var(--tour-accent) 16%, var(--bg-card)); border-color: var(--tour-accent); }
    .tour-opt[aria-selected="true"]::after { content: "✓"; color: var(--tour-accent); font-weight: 800; }
    .tour-opt .tour-n { font-size: 0.74rem; color: var(--text-muted); white-space: nowrap; }
    main.loading { opacity: 0.45; pointer-events: none; transition: opacity 0.15s ease; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); border: 0; }

    /* CONTENEUR PRINCIPAL */
    main {
      min-height: calc(var(--app-h) - 150px); /* zone de glissement entre coupes : toute la hauteur visible */
      max-width: 680px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 0.92rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
    }

    .section-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* 1. FOCUS CLUBS FRANÇAIS */
    .fr-cards-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .fr-card {
      background: linear-gradient(160deg, #172133 0%, #131a26 100%);
      border: 1px solid #2b3b57;
      border-left: 4px solid var(--french-accent);
      border-radius: 14px;
      padding: 15px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .fr-card:active {
      transform: scale(0.99);
    }

    .fr-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .fr-club-tag {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--french-accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .rank-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .rank-pill.top8 {
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .rank-pill.playoff {
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .rank-pill.none {
      background: var(--bg-elevated); color: var(--text-muted); border: 1px solid var(--border);
    }
    .rank-pill.eliminated {
      background: rgba(239, 68, 68, 0.16);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .fr-scoreline {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      background: rgba(11, 15, 23, 0.55);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .team-name {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .team-name.home { text-align: right; display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
    .team-name.away { text-align: left; display: flex; justify-content: flex-start; align-items: center; gap: 6px; }
    .team-name.is-fr { color: #ffffff; font-weight: 700; }

    .score-box {
      background: var(--bg-elevated);
      padding: 4px 12px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      border: 1px solid var(--border);
    }

    .goals-timeline {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .goal-chip {
      font-size: 0.74rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      padding: 2px 8px;
      border-radius: 6px;
      color: #cbd5e1;
    }

    .ai-summary-text {
      font-size: 0.87rem;
      color: #dbeafe;
      line-height: 1.52;
      background: rgba(15, 23, 42, 0.5);
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.14);
    }

    .fr-card-footer {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* 2. GRILLE DES RÉSULTATS DE LA SOIRÉE */
    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
    }

    .match-tile {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s ease;
    }

    .match-tile:hover {
      background: var(--bg-card-hover);
    }

    .tile-teams {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .tile-team-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-right: 12px;
    }

    .tile-team-name {
      font-size: 0.9rem;
      color: var(--text-main);
    }
    .tile-team-name.is-fr {
      font-weight: 700;
      color: var(--french-accent);
    }

    .tile-team-score {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .tile-meta {
      border-left: 1px solid var(--border);
      padding-left: 12px;
      text-align: center;
      min-width: 64px;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* 4. CLASSEMENT DES 36 ÉQUIPES */
    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .standings-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    table.standings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.83rem;
    }

    .standings-table th {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.72rem;
      text-transform: uppercase;
      padding: 9px 8px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .standings-table th.col-team,
    .standings-table td.col-team {
      text-align: left;
    }

    .standings-table td {
      padding: 9px 8px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .standings-table tr.is-fr-row {
      background: rgba(56, 189, 248, 0.11);
      font-weight: 700;
    }

    .rank-cell {
      font-weight: 700;
      position: relative;
      padding-left: 12px !important;
    }

    .rank-cell::before {
      content: "";
      position: absolute;
      left: 0;
      top: 4px;
      bottom: 4px;
      width: 4px;
      border-radius: 0 3px 3px 0;
    }

    tr.zone-top8 .rank-cell::before { background: var(--zone-top8); }
    tr.zone-playoff .rank-cell::before { background: var(--zone-playoff); }
    tr.zone-eliminated .rank-cell::before { background: var(--zone-elim); }
    tr.zone-ucl .rank-cell::before { background: var(--zone-ucl); }
    tr.zone-uel .rank-cell::before { background: var(--zone-uel); }
    tr.zone-uecl .rank-cell::before { background: var(--zone-uecl); }
    tr.zone-barrage .rank-cell::before { background: var(--zone-barrage); }
    tr.zone-relegation .rank-cell::before { background: var(--zone-relegation); }

    /* Délimitation explicite entre les zones (Places 8 et 24) */
    tr.zone-cutoff td {
      border-bottom: 2px dashed rgba(148, 163, 184, 0.45);
    }

    .fr-badge-inline {
      font-size: 0.65rem;
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent-ucl);
      padding: 1px 5px;
      border-radius: 4px;
      margin-left: 5px;
      vertical-align: middle;
    }

    /* 3. TIROIR MODAL : FICHE DE MATCH COMPLÈTE */
    @supports (height: 100dvh) { :root { --app-h: 100dvh; } }
    /* --app-h est recalée en px par JS (visualViewport) : hauteur réellement visible, barre d'adresse comprise */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--app-h);
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      background: var(--bg-card);
      width: 100%;
      max-width: 680px;
      height: calc(var(--app-h) - var(--sheet-gap));
      border-radius: 20px 20px 0 0;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.22s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }

    .sheet-handle {
      flex-shrink: 0; height: 22px; background: var(--bg-elevated); touch-action: none; position: relative;
    }
    .sheet-handle::after {
      content: ""; position: absolute; left: 50%; top: 8px; width: 40px; height: 4px; margin-left: -20px;

    }

    .modal-header {
      touch-action: none;
      padding: 4px 16px 14px;

    .subtab-btn {

      border: none;
      color: var(--text-muted);

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
      overscroll-behavior: contain;

    /* VUE 1 : ÉVÉNEMENTS */
    .event-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      margin-bottom: 6px;

    }
    .ev-min {
      font-weight: 700;
      color: var(--accent-ucl);

    /* MOMENTUM (en tête de l'onglet Stats) */
    .momentum-box {
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 8px 12px;

    /* VUE 3 : TERRAIN TACTIQUE (positions calculées en JS : lignes déduites de la formation + anti-collision) */
    .pitch-container {
      position: relative;
      width: 100%;
      height: 520px;
      background: linear-gradient(180deg, #14532d 0%, #166534 50%, #14532d 100%);
      border: 2px solid rgba(255, 255, 255, 0.35);

    .pitch-circle {
      position: absolute;
      top: 50%;
      left: 50%;

      height: 72px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;

    .player-node {

      position: relative;

    /* Pastille / bandeau d'équipe : aplat de la couleur d'équipe, liseré 1 px si quasi blanc ou quasi noir */
    .sw-eq { margin-right: 6px; display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; vertical-align: baseline; }
    .sw-eq.home { background: var(--home-color); box-shadow: 0 0 0 1px var(--home-bord); }
    .sw-eq.away { background: var(--away-color); box-shadow: 0 0 0 1px var(--away-bord); }
    .duo-bar { display: flex; height: 4px; border-radius: 99px; overflow: hidden; gap: 2px; margin-top: 8px; }

    .poss.xg { margin-top: 8px; }
    .poss-lbl { text-align: center; font-size: 0.72rem; font-weight: 700; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase; }
    .poss-vals { display: flex; justify-content: space-between; align-items: baseline; margin: 2px 0 8px; font-variant-numeric: tabular-nums; }

    .st-v { font-size: 0.95rem; font-weight: 500; color: var(--text-muted); }
    .st-v.away { text-align: right; }
    .st-v.dom, .st-v.eq { font-weight: 800; }
    .st-v.eq { color: var(--text-main); }
    .st-v.home.dom { color: var(--home-ink); } .st-v.away.dom { color: var(--away-ink); }
    .st-l { text-align: center; font-size: 0.76rem; color: var(--text-muted); line-height: 1.25; }
    .st-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-top: 5px; }

    @keyframes slideInR { from { transform: translateX(-28px); opacity: 0.4; } to { transform: none; opacity: 1; } }

    .cl-res { width: 22px; height: 22px; border-radius: 50%; font-size: 0.68rem; font-weight: 800; display: inline-flex; align-items: center;
      justify-content: center; color: #0b0f17; }
    .cl-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; font-variant-numeric: tabular-nums; }
    .cl-table th { text-align: right; font-size: 0.68rem; color: var(--text-muted); font-weight: 600; padding: 4px 4px 6px; }
    .cl-table th:first-child, .cl-table td:first-child { text-align: left; }
    .cl-table td { text-align: right; padding: 7px 4px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
    .cl-table td.dim { color: var(--text-muted); }
    .cl-table tr.grp td { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);
      border-top: 0; padding-top: 12px; }
    .cl-eff-row { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: inherit; font: inherit; font-size: 0.84rem; text-align: left; padding: 6px 2px; min-height: 44px; cursor: pointer; }
    .cl-eff-row .num { width: 26px; text-align: center; color: var(--text-muted); font-weight: 700; flex-shrink: 0; }
    .cl-eff-row .who { flex: 1; min-width: 0; }
    .cl-eff-row .who .nm { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .cl-eff-row .who small { color: var(--text-muted); font-size: 0.7rem; display: flex; align-items: center; gap: 4px; }
    .cl-eff-row .st { font-size: 0.72rem; color: var(--text-muted); text-align: right; white-space: nowrap; }
    .cl-eff-row img.ph { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: var(--bg-elevated); flex-shrink: 0; }
    .cl-eff-row.sans-minute .nm { font-weight: 500; color: var(--text-muted); }
    /* Onglet Histoire : palmarès, bilan, saisons européennes (clubs/historique/<id>.json) */
    #club-tabs .subtab-btn { padding-left: 2px; padding-right: 2px; }
    .hi-sum { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 4px; }
    .hi-sum b { color: var(--text-main); }
    .hi-pal { display: grid; grid-template-columns: 52px 1fr; gap: 2px 12px; align-items: center; background: var(--bg-main);
      border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; }
    .hi-pal .n { grid-row: 1 / span 3; font-size: 1.9rem; font-weight: 800; line-height: 1; text-align: center; color: var(--or); }
    .hi-pal .n.zero { color: var(--text-muted); font-size: 1.3rem; }
    .hi-pal .t { font-weight: 700; font-size: 0.9rem; }
    .hi-pal .l { font-size: 0.78rem; color: var(--text-muted); line-height: 1.4; }
    .hi-pal .l b { color: var(--text-main); font-weight: 600; }
    .hi-sub { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin: 12px 0 6px; }
    details.hi-fins, details.hi-dec, details.hi-ed { border-radius: 10px; }
    details.hi-fins > summary, details.hi-dec > summary, details.hi-ed > summary { cursor: pointer; list-style: none; min-height: 44px; display: flex;
      align-items: center; gap: 8px; font-size: 0.84rem; }
    details > summary::-webkit-details-marker { display: none; }
    details.hi-fins > summary { color: var(--club-ink); font-weight: 600; }
    details.hi-fins > summary::after, details.hi-dec > summary::after, details.hi-ed > summary::after { content: '▾'; margin-left: auto; color: var(--text-muted);
      transition: transform 0.15s; flex-shrink: 0; }
    details[open] > summary::after { transform: rotate(180deg); }
    .hi-fin { display: grid; grid-template-columns: 26px 1fr; gap: 2px 8px; padding: 8px 2px; border-top: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.84rem; align-items: start; }
    .hi-fin .big { font-weight: 700; }
    .hi-fin .det { font-size: 0.74rem; color: var(--text-muted); line-height: 1.4; }
    .hi-badge { width: 22px; height: 22px; border-radius: 50%; font-size: 0.68rem; font-weight: 800; display: inline-flex; align-items: center; justify-content: center;
      color: #0b0f17; flex-shrink: 0; }
    .hi-badge.V { background: var(--or); } .hi-badge.D { background: var(--argent); } .hi-badge.q { background: var(--bg-elevated); color: var(--text-muted); }
    .hi-comp { background: var(--bg-main); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; }
    .hi-comp .h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 700; font-size: 0.9rem; }
    .hi-comp .h small { font-weight: 500; font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; }
    .hi-comp .best { font-size: 0.78rem; color: var(--text-muted); margin: 2px 0 6px; line-height: 1.4; }
    .hi-comp .best b { color: var(--club-ink); font-weight: 700; }
    .hi-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; text-align: center; font-variant-numeric: tabular-nums; }
    .hi-stats span { display: block; font-size: 0.66rem; color: var(--text-muted); }
    .hi-stats b { font-size: 0.92rem; }
    details.hi-dec { border-top: 1px solid var(--border); }
    details.hi-dec > summary { font-weight: 700; color: var(--text-main); }
    details.hi-dec > summary small { font-weight: 500; font-size: 0.72rem; color: var(--text-muted); }
    details.hi-ed { margin-left: 2px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
    details.hi-ed > summary { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto 14px; gap: 6px; font-size: 0.82rem; }
    details.hi-ed > summary::after { margin-left: 0; }
    .hi-s { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .hi-n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); font-size: 0.78rem; }
    .hi-i { font-size: 0.76rem; font-weight: 600; text-align: right; color: var(--text-muted); max-width: 132px; }
    .hi-i.win { color: var(--or); font-weight: 800; } .hi-i.fin { color: var(--argent); font-weight: 700; } .hi-i.ec { color: var(--club-ink); }
    .hi-body { padding: 0 0 8px; }
    .hi-m { display: grid; grid-template-columns: 78px 1fr auto 22px; align-items: center; gap: 8px; padding: 6px 4px; min-height: 40px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.82rem; }
    .hi-m .d { font-size: 0.7rem; color: var(--text-muted); line-height: 1.25; }
    .hi-m .o { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .hi-m .o .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hi-m .sc { font-weight: 800; white-space: nowrap; text-align: right; }
    .hi-m .sc small, .hi-m .sc .hi-st { display: block; font-size: 0.64rem; font-weight: 600; color: var(--text-muted); }
    .hi-m .hi-st { font-weight: 600; }
    #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 100001; background: var(--bg-elevated); color: var(--text-main);
      border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px; font-size: 0.82rem; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      max-width: calc(100vw - 32px); }
  </style>
</head>
<body>

  <main id="main-zone">
    <!-- ACCUEIL : derniers résultats en date + une tuile par compétition (coupes et championnats) -->
    <div id="accueil" hidden></div>

    <div class="tour-bar" id="tour-bar" hidden></div>
    <!-- 1. FOCUS CLUBS FRANÇAIS -->
    <section id="focus-section">
      <div class="section-header">
        <h2 class="section-title">🇫🇷 Focus Clubs Français</h2>

    <!-- 2. TOUS LES RÉSULTATS DE LA SOIRÉE -->
    <section>

    <!-- 4. CLASSEMENT GÉNÉRAL DES 36 ÉQUIPES OU BRACKET -->
    <section id="standings-section">

      </div>

        <span class="legend-item"><i class="legend-dot" style="background:var(--zone-playoff)"></i>9-24 : Barrages (16es)</span>
        <span class="legend-item"><i class="legend-dot" style="background:var(--zone-elim)"></i>25-36 : Élimination</span>

  <!-- 3. TIROIR MODAL : FICHE DE MATCH -->
  <div class="modal-backdrop" id="match-modal" onclick="closeModalOnBackdrop(event)">
    <div class="modal-sheet" id="modal-sheet">

      <div class="modal-subtabs">

        <button class="subtab-btn" data-view="lineups" onclick="switchModalView('lineups')">Compos</button>

  <!-- FICHE JOUEUR (au-dessus de la fiche de match) -->

    <div class="player-sheet" id="player-sheet">
      <div class="sheet-handle" aria-hidden="true"></div>

    </div>
  </div>


  <!-- MENU DES JOURNÉES / TOURS (feuille du bas, propre à la coupe affichée) -->
  <div class="tour-backdrop" id="tour-modal" onclick="if (event.target.id === 'tour-modal') closeTourMenu()">
    <div class="tour-sheet" id="tour-sheet" role="dialog" aria-modal="true" aria-labelledby="tour-sheet-title">
      <div class="sheet-handle" aria-hidden="true"></div>

  <!-- FICHE DE CLUB (empilée selon l'ordre d'ouverture : bringToFront) -->
  <div class="club-backdrop" id="club-modal" onclick="if (event.target.id === 'club-modal') closeClub()">
    <div class="club-sheet" id="club-sheet" role="dialog" aria-label="Fiche de club">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="club-head" id="club-head"></div>

        <button class="subtab-btn active" data-cview="apercu" onclick="switchClubView('apercu')">Aperçu</button>
        <button class="subtab-btn" data-cview="matchs" onclick="switchClubView('matchs')">Matchs</button>
        <button class="subtab-btn" data-cview="stats" onclick="switchClubView('stats')">Stats</button>
        <button class="subtab-btn" data-cview="effectif" onclick="switchClubView('effectif')">Effectif</button>
        <button class="subtab-btn" data-cview="histoire" onclick="switchClubView('histoire')">Histoire</button>
      </div>
      <div class="club-body" id="club-body"></div>
    </div>
  </div>

  <script>
    let appData = null;
    let currentComp = 'ucl';
    let activeMatch = null;
    let currentModalView = 'events';
    let currentStatsPeriod = 'all';

    // Drapeau de la nationalité d'un club (code fourni par le collecteur à partir du pays UEFA)
    // Championnats (clubs ESPN : logo sur a.espncdn.com) : le LOGO du club remplace le drapeau du pays, tous les clubs étant du même pays.
    // Image réduite par le service d'ESPN (40 px) ; les coupes gardent le drapeau.
    const logoEspn = (t) => t && typeof t.logo === 'string' && /^https:\/\/a\.espncdn\.com\/i\/teamlogos\//.test(t.logo)
      ? `https://a.espncdn.com/combiner/i?img=${encodeURIComponent(t.logo.replace('https://a.espncdn.com', ''))}&w=40&h=40` : '';
    const flag = (t) => logoEspn(t)
      ? `<img class="flag logo-club" src="${esc(logoEspn(t))}" alt="" loading="lazy" width="18" height="18">`
      : t && t.flag
      ? `<img class="flag" src="https://flagcdn.com/w40/${esc(t.flag)}.png" alt="${esc(t.country || '')}" title="${esc(t.country_name || t.country || '')}" loading="lazy" width="18" height="13">`
      : '';
    // ---------- Hauteur visible réelle (barre d'adresse mobile) : --app-h en px ----------
    function syncAppHeight() {
      const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
      if (h) document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
    }
    syncAppHeight();
    window.addEventListener('resize', syncAppHeight);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', syncAppHeight);

    // ---------- Info-bulle unique : infoBtn(html) rend le bouton, #info-pop affiche le texte ----------
    // Le texte (HTML déjà échappé par l'appelant) est conservé dans INFO_TEXTS ; le bouton ne porte que l'indice.
    const INFO_TEXTS = [];
    function infoBtn(html, label) {
      let i = INFO_TEXTS.indexOf(html);
      if (i < 0) { INFO_TEXTS.push(html); i = INFO_TEXTS.length - 1; }
      return `<button type="button" class="info-btn" data-info="${i}" aria-label="${esc(label || 'Informations')}" aria-expanded="false" aria-haspopup="true"></button>`;
    }
    let infoOpenBtn = null;
    function closeInfo() {
      const pop = document.getElementById('info-pop');
      if (pop) pop.classList.remove('open');
      if (infoOpenBtn) infoOpenBtn.setAttribute('aria-expanded', 'false');
      infoOpenBtn = null;
    }
    function openInfo(btn) {
      let pop = document.getElementById('info-pop');
      if (!pop) {
        pop = document.createElement('div');
        pop.id = 'info-pop'; pop.setAttribute('role', 'dialog');
        document.body.appendChild(pop);
      }
      closeInfo();
      pop.innerHTML = INFO_TEXTS[Number(btn.dataset.info)] || '';
      pop.style.visibility = 'hidden'; pop.classList.add('open');
      const vw = document.documentElement.clientWidth, vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
      const w = Math.min(320, vw - 16);
      pop.style.width = w + 'px';
      const r = btn.getBoundingClientRect(), ph = pop.offsetHeight;
      const left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, vw - w - 8));
      let top = r.bottom + 6;
      if (top + ph > vh - 8) top = Math.max(8, r.top - ph - 6);
      pop.style.left = left + 'px'; pop.style.top = top + 'px'; pop.style.visibility = '';
      btn.setAttribute('aria-expanded', 'true');
      infoOpenBtn = btn;
    }
    // Capture : un toucher sur ⓘ ne déclenche pas le clic de la carte / ligne qui le contient.
    document.addEventListener('click', (e) => {
      const b = e.target.closest && e.target.closest('.info-btn');
      if (b) { e.stopPropagation(); e.preventDefault(); if (b === infoOpenBtn) closeInfo(); else openInfo(b); return; }
      if (infoOpenBtn && !(e.target.closest && e.target.closest('#info-pop'))) closeInfo();
    }, true);
    window.addEventListener('resize', closeInfo);

    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    document.getElementById('grid-hint').innerHTML = infoBtn('Toucher un match pour ouvrir sa fiche détaillée.', 'Aide');

    // ---------- Soirées : soirees/index.json (menu) + soirees/<date>.json ; repli sur data.json sans index ----------
    const COMP_KEYS = ['ucl', 'uel', 'uecl'];
    const COMP_FULL = { ucl: 'Ligue des Champions', uel: 'Ligue Europa', uecl: 'Ligue Conférence',
      fl1: 'Ligue 1', pl: 'Premier League', liga: 'Liga', sa: 'Serie A', bl: 'Bundesliga' };
    // Championnats nationaux : données du dépôt Camelbaggy/donnees-football (GitHub Pages) ; ?donnees=<url ou dossier> pour un essai local
    const LIGUE_KEYS = ['fl1', 'pl', 'liga', 'sa', 'bl'];
    const LIGUE_COURT = { fl1: 'Ligue 1', pl: 'Premier L.', liga: 'Liga', sa: 'Serie A', bl: 'Bundesliga' };
    const ESPACES = { coupes: { titre: "Coupes d'Europe", keys: COMP_KEYS }, championnats: { titre: 'Championnats', keys: LIGUE_KEYS } };
    const estLigue = (k) => LIGUE_KEYS.includes(k);
    const espaceDe = (k) => estLigue(k) ? 'championnats' : 'coupes';
    const DONNEES = (() => {
      const v = new URLSearchParams(location.search).get('donnees');
      const b = v || 'https://camelbaggy.github.io/donnees-football/';
      return b.endsWith('/') ? b : b + '/';
    })();
    // Saison en cours (1er juillet -> 30 juin) : « 2026-27 »
    const SAISON_LIGUES = (() => { const d = new Date(); const y = d.getUTCMonth() >= 6 ? d.getUTCFullYear() : d.getUTCFullYear() - 1; return `${y}-${String(y + 1).slice(2)}`; })();
    const ligueBase = (k) => `${DONNEES}championnats/${k}/${SAISON_LIGUES}/`;
    const ligueIndex = {};          // clé -> lignes d'index (date décroissante) ; [] = pas encore de données
    let soireeIndex = null;        // lignes de l'index (plus récente d'abord) ; null = pas d'index : pas de menu
    const soireeCache = new Map();

    async function fetchJson(url) {
      try {
        const r = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now());
        return r.ok ? await r.json() : null;
      } catch (e) { return null; }
    }

    // ---------- Menu des journées / tours : un par coupe, construit depuis soirees/index.json ----------
    // Un tour (journée de phase de ligue, barrages, tour préliminaire…) peut s'étaler sur plusieurs soirées : il charge
    // et fusionne les soirees/<date>.json concernées (index : competitions.<clé>.{stage, tour}).
    const GROUPES = [   // ordre du menu : du plus récent au plus ancien
      { k: 'finale', t: 'Phase finale' }, { k: 'ligue', t: 'Phase de ligue' }, { k: 'barrages', t: 'Barrages' }, { k: 'prelim', t: 'Tours préliminaires' },
      { k: 'journees', t: 'Journées' }, { k: 'autres', t: 'Matchs sans journée' }];
    let toursByComp = {};          // clé de coupe -> tours (groupe, puis date décroissante)
    const tourChoice = {};         // clé de coupe -> id du tour choisi (conservé quand on change de coupe)
    const tourCache = new Map();   // 'coupe|id' -> { comp (fusion des matchs), meta }
    let tourToken = 0;

    const slug = (v) => String(v).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    function groupeDe(t) {
      if (t.stage === 'knockout') return 'finale';
      if (t.stage === 'league') return 'ligue';
      if (t.stage === 'qualifying') return /^barrage/i.test(t.tour) ? 'barrages' : 'prelim';
      return /^J\d/.test(t.tour) ? 'ligue' : 'prelim';
    }
    // « J5 » -> « Journée 5 » ; « T3 retour » -> « 3e tour retour » ; « Barrages aller » inchangé
    function tourTitre(t) {
      let m = /^J(\d+)$/.exec(t.tour);
      if (m) return 'Journée ' + m[1];
      m = /^T(\d+) (aller|retour)$/.exec(t.tour);
      if (m) return (m[1] === '1' ? '1er' : m[1] + 'e') + ' tour ' + m[2];
      return t.tour || (GROUPES.find(g => g.k === t.groupe) || {}).t || 'Tour';
    }
    // « 24-25 nov. », « 31 août-1 sept. »
    function datesCourtes(dates) {
      const p = (iso) => ({ j: Number(iso.slice(8)), m: new Date(iso + 'T12:00:00Z').toLocaleDateString('fr-FR', { month: 'short', timeZone: 'UTC' }) });
      const a = p(dates[0]), b = p(dates[dates.length - 1]);
      if (dates.length === 1 || dates[0] === dates[dates.length - 1]) return `${a.j} ${a.m}`;
      return a.m === b.m ? `${a.j}-${b.j} ${a.m}` : `${a.j} ${a.m}-${b.j} ${b.m}`;
    }
    const tourSousTitre = (t) => datesCourtes(t.dates) + (t.matchs ? ` · ${t.matchs} match${t.matchs > 1 ? 's' : ''}` : '');

    function buildTours() {
      toursByComp = {};
      COMP_KEYS.forEach(k => {
        const map = new Map();
        soireeIndex.forEach(l => {
          const c = l.competitions && l.competitions[k];
          if (!c) return;
          const key = (c.stage || '') + '|' + (c.tour || '');
          let t = map.get(key);
          if (!t) { t = { comp: k, stage: c.stage || '', tour: c.tour || '', dates: [], matchs: 0, jouee: false, reconstituee: false }; map.set(key, t); }
          t.dates.push(l.date); t.matchs += c.matchs || 0;
          if ((l.termines || 0) > 0) t.jouee = true;
          if (l.reconstituee) t.reconstituee = true;
        });
        const used = new Set();
        const list = [...map.values()];
        list.forEach(t => {
          t.dates.sort(); t.fin = t.dates[t.dates.length - 1]; t.groupe = groupeDe(t); t.titre = tourTitre(t);
          t.id = slug(t.tour || t.stage || 'tour');
          if (used.has(t.id)) t.id += '-' + slug(t.stage);
          used.add(t.id);
        });
        const rang = (t) => GROUPES.findIndex(g => g.k === t.groupe);
        list.sort((a, b) => rang(a) - rang(b) || b.fin.localeCompare(a.fin));
        toursByComp[k] = list;
      });
    }
    // Par défaut : le tour le plus récent qui a des matchs terminés
    function defaultTour(k) {
      const l = toursByComp[k] || [];
      return l.filter(t => t.jouee).sort((a, b) => b.fin.localeCompare(a.fin))[0] || l[0] || null;
    }

    // Championnat : tours = journées (index.json : `par_journee` {n: matchs} de chaque jour ; un match reporté apparaît sous sa
    // journée d'origine, à la date où il est joué) ; les matchs sans journée connue forment le tour « Autres matchs ».
    function buildToursLigue(k) {
      const map = new Map();
      (ligueIndex[k] || []).forEach(l => {
        const pj = l.par_journee || {};
        const ns = Object.keys(pj).length ? Object.keys(pj) : (l.journees || []).map(String);
        ns.forEach(n => {
          let t = map.get(n);
          if (!t) { t = { comp: k, stage: 'league', tour: 'J' + n, n: Number(n), dates: [], matchs: 0, jouee: false, groupe: 'journees', titre: 'Journée ' + n, id: 'j' + n }; map.set(n, t); }
          t.dates.push(l.date); t.matchs += Number(pj[n] || 0);
          if ((l.termines || 0) > 0) t.jouee = true;
        });
        if ((l.sans_journee || 0) > 0) {
          let t = map.get('autres');
          if (!t) { t = { comp: k, stage: 'league', tour: '', n: 0, dates: [], matchs: 0, jouee: false, groupe: 'autres', titre: 'Autres matchs', id: 'autres' }; map.set('autres', t); }
          t.dates.push(l.date); t.matchs += l.sans_journee;
          if ((l.termines || 0) > 0) t.jouee = true;
        }
      });
      const list = [...map.values()];
      list.forEach(t => { t.dates.sort(); t.fin = t.dates[t.dates.length - 1]; });
      list.sort((a, b) => (a.groupe === 'autres') - (b.groupe === 'autres') || b.n - a.n);
      toursByComp[k] = list;
    }
    async function loadLigueIndex(k) {
      if (ligueIndex[k]) return ligueIndex[k];
      const idx = await fetchJson(ligueBase(k) + 'index.json');
      ligueIndex[k] = Array.isArray(idx) ? idx.filter(l => l && /^\d{4}-\d{2}-\d{2}$/.test(l.date)).sort((a, b) => b.date.localeCompare(a.date)) : [];
      buildToursLigue(k);
      return ligueIndex[k];
    }
    async function loadJourLigue(k, date) {
      const cle = k + '@' + date;
      let data = soireeCache.get(cle);
      if (!data) { data = await fetchJson(ligueBase(k) + date + '.json'); if (data) soireeCache.set(cle, data); }
      return data;
    }

    // Une soirée : cache, puis data.json pour la plus récente (copie de sa soirée), sinon soirees/<date>.json
    async function loadSoiree(date) {
      let data = soireeCache.get(date);
      if (data) return data;
      if (soireeIndex && date === soireeIndex[0].date) {
        const latest = await fetchJson('data.json');
        if (latest && (latest.target_dates || []).length === 1 && latest.target_dates[0] === date) data = latest;
      }
      if (!data) data = await fetchJson('soirees/' + date + '.json');
      if (data) soireeCache.set(date, data);
      return data;
    }
    const minutesKickoff = (m) => {
      const r = /(\d{1,2}):(\d{2})\s*$/.exec(m.kickoff || '');
      return r ? (Number(r[1]) < 6 ? 24 : 0) * 60 + Number(r[1]) * 60 + Number(r[2]) : 0;   // après minuit = fin de soirée
    };
    // Fusionne la coupe de toutes les soirées du tour : matchs (soirée puis heure, sans doublon), cartes des clubs français ;
    // classement et reste = ceux de la soirée la plus récente du tour (officiel ou calculé, règles inchangées).
    async function loadTour(t) {
      const key = t.comp + '|' + t.id;
      if (tourCache.has(key)) return tourCache.get(key);
      const ligue = estLigue(t.comp);
      const datas = await Promise.all(t.dates.map(d => ligue ? loadJourLigue(t.comp, d) : loadSoiree(d)));
      if (datas.some(d => !d)) return null;
      const matches = [], focus = [], seen = new Set(), seenF = new Set();
      let base = {}, rec = false;
      datas.forEach((d, i) => {
        const c = (d.competitions || {})[t.comp] || {};
        base = c;
        if (d.reconstituee) rec = true;
        (c.matches || []).map((m, j) => [m, j]).sort((a, b) => minutesKickoff(a[0]) - minutesKickoff(b[0]) || a[1] - b[1]).forEach(([m]) => {
          if (seen.has(m.match_id)) return;
          if (ligue && (t.groupe === 'autres' ? m.journee : m.journee !== t.n)) return;   // un jour peut mêler deux journées (match reporté)
          seen.add(m.match_id); m._soiree = t.dates[i]; matches.push(m);
        });
        (c.french_clubs_focus || []).forEach(f => {
          const k = f.match_id + '|' + f.club_id;
          if (seenF.has(k)) return;
          seenF.add(k); f._soiree = t.dates[i]; focus.push(f);
        });
      });
      const last = datas[datas.length - 1];
      const hit = {
        comp: { ...base, matches, french_clubs_focus: focus, matchday_label: '', _multi: t.dates.length > 1 },
        meta: { last_updated: last.last_updated, reconstituee: rec },
      };
      tourCache.set(key, hit);
      return hit;
    }

    function updateBadge(meta) {
      const badge = document.getElementById('last-updated-badge');
      if (meta && meta.last_updated) {
        const d = new Date(meta.last_updated);
        badge.textContent = (meta.reconstituee ? 'Reconstituée ' : 'MàJ ') +
          d.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris' });
      }
    }
    const RECONSTITUEE_INFO = '<p>Cette journée (ou une de ses soirées) a été rejouée après coup avec le même pipeline que les soirées du jour : scores, buteurs, statistiques, momentum et notes des joueurs viennent de l\'UEFA.</p><p>Le classement de la phase de ligue est recalculé d\'après les scores (voir son info-bulle). Les résumés sont d\'abord générés sans IA à partir des données officielles ; ceux de la phase de ligue sont ensuite remplacés par des résumés IA contrôlés.</p>';

    // Bouton du menu, en tête du contenu de la coupe affichée (+ info-bulle discrète si une soirée du tour est reconstituée)
    function renderTourBar(t) {
      const bar = document.getElementById('tour-bar');
      bar.hidden = !t;
      if (!t) { bar.innerHTML = ''; return; }
      bar.style.setProperty('--tour-accent', `var(--accent-${t.comp})`);
      bar.innerHTML = `<button type="button" class="tour-btn" id="tour-btn" aria-haspopup="dialog" aria-expanded="false" aria-label="${esc(t.titre + ', ' + tourSousTitre(t) + '. Changer de journée ou de tour')}" onclick="openTourMenu()">
          <span class="tour-txt"><span class="tour-t">${esc(t.titre)}</span><span class="tour-d">${esc(tourSousTitre(t))}</span></span>
          <svg class="tour-chev" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>${t.reconstituee ? infoBtn(RECONSTITUEE_INFO, 'Journée reconstituée') : ''}`;
    }

    // Feuille du bas : la liste des tours de la coupe affichée, regroupés, le tour courant surligné
    function openTourMenu() {
      const k = currentComp, list = toursByComp[k] || [];
      if (!list.length) return;
      const cur = tourChoice[k];
      const sheet = document.getElementById('tour-sheet');
      sheet.style.setProperty('--tour-accent', `var(--accent-${k})`);
      document.getElementById('tour-head').innerHTML = `<div><b id="tour-sheet-title">${esc(COMP_FULL[k])}</b><small>Choisir une journée ou un tour</small></div>
        <button type="button" class="btn-close" onclick="closeTourMenu()" aria-label="Fermer">✕</button>`;
      document.getElementById('tour-list').innerHTML = GROUPES.map(g => {
        const ts = list.filter(t => t.groupe === g.k);
        if (!ts.length) return '';
        return `<div role="group" aria-labelledby="tg-${g.k}"><div class="tour-grp" id="tg-${g.k}">${esc(g.t)}</div>${ts.map(t =>
          `<button type="button" role="option" class="tour-opt" data-id="${esc(t.id)}" aria-selected="${t.id === cur}" tabindex="${t.id === cur ? 0 : -1}" onclick="chooseTour('${esc(t.id)}')">
            <span class="tour-txt"><span class="tour-t">${esc(t.titre)}</span><span class="tour-d">${esc(datesCourtes(t.dates))}</span></span>
            <span class="tour-n">${t.matchs} match${t.matchs > 1 ? 's' : ''}</span></button>`).join('')}</div>`;
      }).join('');
      const modal = document.getElementById('tour-modal');
      modal.classList.add('open'); bringToFront(modal); syncBodyLock();
      const b = document.getElementById('tour-btn'); if (b) b.setAttribute('aria-expanded', 'true');
      const sel = document.querySelector('#tour-list .tour-opt[aria-selected="true"]') || document.querySelector('#tour-list .tour-opt');
      if (sel) { sel.focus({ preventScroll: true }); sel.scrollIntoView({ block: 'center' }); }
    }
    function closeTourMenu() {
      const modal = document.getElementById('tour-modal');
      if (!modal.classList.contains('open')) return;
      modal.classList.remove('open'); syncBodyLock();
      const b = document.getElementById('tour-btn');
      if (b) { b.setAttribute('aria-expanded', 'false'); b.focus({ preventScroll: true }); }
    }
    function chooseTour(id) {
      closeTourMenu();
      if (id !== tourChoice[currentComp]) showTour(currentComp, id);
    }
    document.getElementById('tour-modal').addEventListener('keydown', (e) => {   // flèches / Début / Fin dans la liste, Tab piégé dans la feuille
      const opts = [...document.querySelectorAll('#tour-list .tour-opt')], i = opts.indexOf(document.activeElement);
      const go = (n) => { e.preventDefault(); const o = opts[Math.max(0, Math.min(opts.length - 1, n))]; if (o) { opts.forEach(x => x.tabIndex = -1); o.tabIndex = 0; o.focus(); } };
      if (e.key === 'ArrowDown') go(i + 1); else if (e.key === 'ArrowUp') go(i < 0 ? 0 : i - 1);
      else if (e.key === 'Home') go(0); else if (e.key === 'End') go(opts.length - 1);
      else if (e.key === 'Tab') {
        const f = [...document.querySelectorAll('#tour-sheet button')].filter(x => x.tabIndex >= 0), a = document.activeElement;
        if (e.shiftKey && a === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && a === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      }
    });

    // URL partageable : ?c=ucl&tour=j5 ; ?soiree=AAAA-MM-JJ (ancien format, aussi #soiree= ou #AAAA-MM-JJ) reste compris en lecture
    function urlParams() {
      const p = new URLSearchParams(location.search), h = location.hash.replace(/^#(soiree=)?/, '');
      return { c: p.get('c'), tour: p.get('tour'), soiree: [p.get('soiree'), h].find(v => v && /^\d{4}-\d{2}-\d{2}$/.test(v)) || null };
    }
    function syncUrl() {
      const u = new URL(location.href), id = tourChoice[currentComp];
      if (vue === 'accueil') {
        ['c', 'tour', 'soiree'].forEach(x => u.searchParams.delete(x)); u.hash = '';
        try { history.replaceState(history.state, '', u); } catch (e) { /* aperçu hors page */ }
        return;
      }
      u.searchParams.delete('soiree'); u.searchParams.set('c', currentComp);
      if (id) u.searchParams.set('tour', id); else u.searchParams.delete('tour');
      u.hash = '';
      try { history.replaceState(history.state, '', u); } catch (e) { /* aperçu hors page : sans effet */ }
    }

    // Affiche la coupe `compKey` pour le tour `id` (défaut : le plus récent joué) ; `slide` = animation du glissement entre coupes
    async function showTour(compKey, id, slide) {
      const token = ++tourToken;
      const main = document.getElementById('main-zone');
      currentComp = compKey;
      afficherVue('comp');
      if (estLigue(compKey) && !ligueIndex[compKey]) {
        main.classList.add('loading');
        await loadLigueIndex(compKey);
        if (token !== tourToken) return;
        main.classList.remove('loading');
      }
      const t = (toursByComp[compKey] || []).find(x => x.id === id) || defaultTour(compKey);
      const err = document.getElementById('soiree-err'); if (err) err.remove();
      if (!t) {   // coupe sans aucune soirée conservée
        tourChoice[compKey] = null; renderTourBar(null); syncUrl();
        main.classList.remove('loading');
        appData.competitions[compKey] = { name: COMP_FULL[compKey], type: estLigue(compKey) ? 'championnat' : undefined, french_clubs_focus: [], matches: [], standings: [], standings_source: 'absent' };
        renderCompetition(compKey);
        return;
      }
      tourChoice[compKey] = t.id;
      renderTourBar(t); syncUrl();
      let hit = tourCache.get(compKey + '|' + t.id);
      if (!hit) {
        main.classList.add('loading');
        hit = await loadTour(t);
        if (token !== tourToken) return;   // un autre tour / une autre coupe a été demandé entre-temps
      }
      main.classList.remove('loading');
      if (!hit) {
        main.insertAdjacentHTML('afterbegin', `<div class="empty-state" id="soiree-err">Impossible de charger ${esc(t.titre)}.</div>`);
        return;
      }
      appData.competitions[compKey] = hit.comp;
      updateBadge(hit.meta);
      renderCompetition(compKey);
      if (slide) slideIn(main, slide);
    }

    async function initDashboard() {
      const [idx] = await Promise.all([fetchJson('soirees/index.json'), loadClubIndex()]);
      const lignes = Array.isArray(idx) ? idx.filter(l => l && /^\d{4}-\d{2}-\d{2}$/.test(l.date)).sort((a, b) => b.date.localeCompare(a.date)) : [];
      soireeIndex = lignes.length ? lignes : null;
      appData = { competitions: {} };
      if (soireeIndex) buildTours();
      await route();
    }

    // Aiguillage : sans paramètre = accueil ; ?c=<coupe|championnat>[&tour=] ; ?soiree= (ancien lien) = la coupe de cette soirée
    async function route() {
      const u = urlParams();
      if (estLigue(u.c)) { await showTour(u.c, u.tour); return; }
      if (!u.c && !u.soiree) { await afficherAccueil(); return; }
      await ouvrirCoupes(u);
    }
    window.addEventListener('popstate', () => { closeInfo(); route(); });

    async function ouvrirCoupes(u) {
      if (soireeIndex) {
        let comp = 'ucl', id = null;
        const row = u.soiree && soireeIndex.find(l => l.date === u.soiree);
        if (row) {   // ancien lien ?soiree= : ouvre la coupe et le tour de cette soirée
          const ks = COMP_KEYS.filter(k => row.competitions && row.competitions[k]);
          if (ks.length) {
            comp = ks.includes(u.c) ? u.c : ks[0];
            const c = row.competitions[comp];
            const t = toursByComp[comp].find(x => x.stage === (c.stage || '') && x.tour === (c.tour || ''));
            id = t && t.id;
          }
        } else {
          if (COMP_KEYS.includes(u.c)) comp = u.c;
          id = u.tour;
        }
        if (!(toursByComp[comp] || []).length) comp = COMP_KEYS.find(k => toursByComp[k].length) || 'ucl';
        await showTour(comp, id);
        return;
      }
      afficherVue('comp');
      // Pas d'index (hébergement ancien, première publication) : data.json seul, sans menu
      const latest = await fetchJson('data.json');
      if (!latest) {
        document.getElementById('comp-view').innerHTML =
          `<div class="empty-state">Impossible de charger data.json.<br>Ouvre la page via GitHub Pages ou un serveur local (python -m http.server).</div>`;
        return;
      }
      appData = latest;
      updateBadge({ last_updated: latest.last_updated, reconstituee: latest.reconstituee });
      const has = (k) => ((latest.competitions || {})[k] || {}).matches && latest.competitions[k].matches.length > 0;
      if (!has(currentComp)) { const k = COMP_KEYS.find(has); if (k) currentComp = k; }
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.comp === currentComp));
      renderCompetition(currentComp);
    }


    // ---------- Vues : accueil / compétition (une seule application ; les liens ?c=… et ?soiree= restent valables) ----------
    let vue = 'comp';
    function renderTabs(espace) {
      const bar = document.getElementById('tabs-bar'), keys = ESPACES[espace].keys;
      bar.classList.toggle('n5', keys.length > 3);
      bar.innerHTML = keys.map(k => `<button class="tab-btn ${k === currentComp ? 'active' : ''}" data-comp="${k}" style="--tab-accent: var(--accent-${k})" onclick="switchCompetition('${k}')">${esc(keys.length > 3 ? LIGUE_COURT[k] : COMP_FULL[k])}</button>`).join('');
    }
    function afficherVue(v) {
      vue = v;
      const acc = v === 'accueil';
      document.getElementById('accueil').hidden = !acc;
      document.getElementById('comp-view').hidden = acc;
      document.getElementById('tabs-bar').hidden = acc;
      document.getElementById('app-header').classList.toggle('accueil', acc);
      document.getElementById('home-btn').setAttribute('aria-label', acc ? 'Accueil' : 'Retour à l\'accueil');
      document.getElementById('espace-titre').textContent = acc ? '' : '· ' + ESPACES[espaceDe(currentComp)].titre;
      if (!acc) renderTabs(espaceDe(currentComp));
      document.title = acc ? 'Football · Coupes d\'Europe et championnats' : COMP_FULL[currentComp] + ' · Football';
    }
    // Entrer dans une compétition depuis l'accueil : nouvelle entrée d'historique (le retour du téléphone revient à l'accueil)
    function entrer(k, tourId) {
      closeInfo();
      const u = new URL(location.href);
      ['soiree', 'tour'].forEach(x => u.searchParams.delete(x));
      u.searchParams.set('c', k); u.hash = '';
      if (tourId) u.searchParams.set('tour', tourId);
      try { history.pushState({ depuisAccueil: 1 }, '', u); } catch (e) { /* aperçu hors page */ }
      showTour(k, tourId);
    }
    function goAccueil() {
      closeInfo();
      if (vue === 'accueil') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      if (history.state && history.state.depuisAccueil) { history.back(); return; }
      afficherAccueil();
    }

    // Dernière date jouée (au moins un match terminé) d'une compétition, et le tour qui la contient
    function derniereDate(k) {
      if (estLigue(k)) { const l = (ligueIndex[k] || []).find(x => (x.termines || 0) > 0); return l ? l.date : null; }
      const l = (soireeIndex || []).find(x => x.competitions && x.competitions[k] && (x.termines || 0) > 0);
      return l ? l.date : null;
    }
    function tourDeDate(k, date) {
      const ts = (toursByComp[k] || []).filter(t => t.dates.includes(date));
      return ts.sort((a, b) => b.matchs - a.matchs)[0] || null;
    }
    const accLigneMatch = (m, k, date) => {
      const fini = m.status !== 'À venir' && m.status !== 'Reporté' && m.status !== 'Annulé';
      const sc = fini ? `<span class="sc">${m.home_team.score} - ${m.away_team.score}</span>` : `<span class="sc av">${esc((m.kickoff || '').slice(-5) || m.status)}</span>`;
      return `<button type="button" class="acc-m" onclick="ouvrirMatchAccueil('${esc(k)}', '${esc(date)}', '${esc(m.match_id)}')">
        <span class="eq d ${m.home_team.is_french && !estLigue(k) ? 'is-fr' : ''}">${esc(m.home_team.name)} ${flag(m.home_team)}</span>${sc}
        <span class="eq ${m.away_team.is_french && !estLigue(k) ? 'is-fr' : ''}">${flag(m.away_team)} ${esc(m.away_team.name)}</span></button>`;
    };
    async function donneesDuJour(k, date) {
      return estLigue(k) ? loadJourLigue(k, date) : loadSoiree(date);
    }
    async function ouvrirMatchAccueil(k, date, matchId) {
      const d = await donneesDuJour(k, date);
      if (d) openMatchModal(matchId, d, k);
    }

    async function afficherAccueil() {
      ++tourToken;
      afficherVue('accueil');
      syncUrl();
      const box = document.getElementById('accueil');
      box.innerHTML = '<div class="acc-note">Chargement…</div>';
      await Promise.all(LIGUE_KEYS.map(loadLigueIndex));
      if (vue !== 'accueil') return;
      const toutes = [...COMP_KEYS, ...LIGUE_KEYS];
      const dates = Object.fromEntries(toutes.map(k => [k, derniereDate(k)]));
      const jour = Object.values(dates).filter(Boolean).sort().pop() || null;
      let html = '';
      if (jour) {
        const ks = toutes.filter(k => dates[k] === jour);
        const datas = await Promise.all(ks.map(k => donneesDuJour(k, jour)));
        if (vue !== 'accueil') return;
        html += `<h2 class="acc-h">Derniers résultats</h2><div class="acc-jour">${esc(jourLong(jour).replace(/^./, c => c.toUpperCase()))}</div>`;
        ks.forEach((k, i) => {
          const c = ((datas[i] || {}).competitions || {})[k];
          if (!c) return;
          const t = tourDeDate(k, jour);
          const ms = (c.matches || []).slice().sort((a, b) => minutesKickoff(a) - minutesKickoff(b));
          html += `<div class="acc-bloc" style="--c-accent: var(--accent-${k})">
            <button type="button" class="acc-bloc-h" onclick="entrer('${k}', ${t ? `'${esc(t.id)}'` : 'null'})">
              <span><b>${esc(COMP_FULL[k])}</b><small>${esc(t ? t.titre : '')}${t ? ' · ' : ''}${ms.length} match${ms.length > 1 ? 's' : ''}</small></span>
              <span class="go">Voir tout ›</span></button>
            ${ms.map(m => accLigneMatch(m, k, jour)).join('')}</div>`;
        });
      } else {
        html += '<div class="acc-note">Aucun résultat disponible pour le moment.</div>';
      }
      const tuile = (k) => {
        const t = defaultTour(k);
        const desc = t ? `<span class="tt">${esc(t.titre)}</span><span>${esc(tourSousTitre(t))}</span>`
          : `<span>${estLigue(k) ? 'Données bientôt disponibles' : 'Aucune soirée conservée'}</span>`;
        return `<button type="button" class="acc-tuile" style="--c-accent: var(--accent-${k})" onclick="entrer('${k}', ${t ? `'${esc(t.id)}'` : 'null'})"><b>${esc(COMP_FULL[k])}</b>${desc}</button>`;
      };
      html += `<h2 class="acc-h">Coupes d'Europe</h2><div class="acc-grille">${COMP_KEYS.map(tuile).join('')}</div>`;
      html += `<h2 class="acc-h">Championnats</h2><div class="acc-grille">${LIGUE_KEYS.map(tuile).join('')}</div>`;
      box.innerHTML = html;
      const maj = [soireeIndex && soireeIndex[0] && soireeIndex[0].maj, ...LIGUE_KEYS.map(k => (ligueIndex[k][0] || {}).maj)].filter(Boolean).sort().pop();
      if (maj) updateBadge({ last_updated: maj });
    }

    function switchCompetition(compKey, slide) {
      closeInfo();
      if (!soireeIndex && !estLigue(compKey)) {   // sans index : data.json seul
        currentComp = compKey;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.comp === compKey));
        renderCompetition(compKey);
        if (slide) slideIn(document.getElementById('main-zone'), slide);
        return;
      }
      showTour(compKey, tourChoice[compKey], slide);   // chaque coupe garde son tour choisi
    }

    function getZoneLabel(zone, rank) {
      if (!rank) return 'Classement n.d.';
      const r = rank === 1 ? '1er' : `${rank}e`;
      if (!zone) return r;   // classement recalculé d'une soirée passée : pas de zone (n'a de sens qu'à la dernière journée)
      if (zone === 'top8') return `${r} • Top 8 (8es)`;
      if (zone === 'playoff') return `${r} • Barrages`;
      return `${r} • Zone élim.`;
    }

    function renderCompetition(compKey) {
      const comp = (appData && appData.competitions && appData.competitions[compKey]) ||
        { name: '', french_clubs_focus: [], matches: [], standings: [] };

      document.getElementById('matchday-indicator').textContent = dateEnToutesLettres(comp.matchday_label || '');

            return `<span class="goal-chip ${mine ? 'mine' : ''}">⚽ ${who}${tag} (${esc(g.minute)})</span>`;

      // 4. Classement : officiel UEFA (soirée récente) ou recalculé depuis les scores (soirée passée) ; rien pour les préliminaires

      stTitle.innerHTML = ligue
        ? `Classement ${infoBtn('<p>Classement officiel (ESPN) relevé à l\'issue de cette journée ; il n\'est conservé que s\'il a été relevé avant le match suivant du championnat. Zones : qualifications européennes et relégation telles que publiées.</p>', 'Source du classement')}`

    // Légende des zones d'un championnat (codes ESPN ; libellé traduit, plage de rangs lue dans le classement)
    let LEGENDE_COUPES = null;
    const ZONES_FR = { ucl: 'Ligue des champions', uel: 'Ligue Europa', uecl: 'Ligue Conférence', barrage: 'Barrage de relégation', relegation: 'Relégation', promotion: 'Promotion' };
    function legendeLigue(rows) {
      const plages = [];
      rows.forEach(r => {
        if (!r.zone) return;
        const p = plages.find(x => x.z === r.zone);
        if (p) { p.a = Math.min(p.a, r.rank); p.b = Math.max(p.b, r.rank); } else plages.push({ z: r.zone, a: r.rank, b: r.rank });
      });
      return plages.map(p => `<span class="legend-item"><i class="legend-dot" style="background:var(--zone-${esc(p.z)}, var(--text-muted))"></i>${p.a === p.b ? p.a : p.a + '-' + p.b} : ${esc(ZONES_FR[p.z] || p.z)}</span>`).join('');
    }

    // Texte de l'info-bulle d'un classement recalculé : ce qui est appliqué, et ce qui ne l'est pas (voir classement.py)

      return `<p><b>Classement calculé</b> d'après les scores des matchs de phase de ligue terminés${d ? ' jusqu\'au ' + esc(d) + ' inclus' : ''} : l'UEFA ne fournit que le classement actuel, jamais celui d'une date passée.</p>
        <p>Départage appliqué, dans l'ordre : points, différence de buts, buts marqués, buts marqués à l'extérieur, victoires, victoires à l'extérieur, puis points, différence de buts et buts marqués de l'ensemble des adversaires affrontés.</p>
        <p>Non appliqués faute de données à cette date : points disciplinaires et coefficient UEFA. Les clubs encore à égalité portent le même rang, suivi de =.</p>
        <p>Les zones (8es directs, barrages, élimination) ne sont pas indiquées : elles n'ont de sens qu'après la dernière journée.</p>`;
    }

          </div>
          <div class="pitch-container" id="pitch">
            <div class="pitch-midline"></div>
            <div class="pitch-circle"></div>
          </div>
          <div class="subs-list">
            <div><b style="color:var(--home-ink)">Entrés (${esc(m.home_team.short)})</b> : ${subs(L.home_subs || [])}</div>
            <div><b style="color:var(--away-ink)">Entrés (${esc(m.away_team.short)})</b> : ${subs(L.away_subs || [])}</div>
            ${(L.home_coach || L.away_coach) ? `<div>Entraîneurs : ${esc(L.home_coach || '—')} / ${esc(L.away_coach || '—')}</div>` : ''}
            <div class="info-row">${infoBtn(`<p>© capitaine · ⭐ homme du match UEFA · ↓ minute de sortie${hasPlayers ? ' · touchez un joueur pour sa fiche' : ''}</p>${hasPlayers ? `<p>Notes sur 10 calculées à partir des statistiques ${m.source ? 'Opta (ESPN)' : 'officielles UEFA'} (méthode : voir la fiche d'un joueur).</p>` : ''}`, 'Légende et méthode des compositions')}</div>
          </div>`;

      else if (currentModalView === 'stats') {
        const keep = container.scrollTop;
