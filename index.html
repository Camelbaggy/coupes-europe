    // ---------- Compos : lignes déduites de la formation + anti-collision ----------
    // Chaque ligne = un rang vertical (gardien, puis un rang par nombre de la formation UEFA). Les joueurs sont
    // rangés par profondeur UEFA (y), puis découpés selon la formation ; dans une ligne, ils sont répartis
    // régulièrement dans l'ordre de leur x UEFA. Aucun joueur n'est changé de ligne ni inventé.
    function lineupRows(list, formation, side) {
      const depth = (p) => side === 'home' ? (p.y ?? 50) : 100 - (p.y ?? 50);
      let gk = list.find(p => p.pos === 'GOALKEEPER');
      if (!gk && list.length) gk = list.reduce((b, p) => depth(p) < depth(b) ? p : b, list[0]);
      const out = list.filter(p => p !== gk).sort((a, b) => depth(a) - depth(b) || (a.x ?? 50) - (b.x ?? 50));
      const counts = String(formation || '').split('-').map(Number);
      let rows = [];
      if (counts.length && counts.every(n => n > 0) && counts.reduce((a, b) => a + b, 0) === out.length) {
        let i = 0;
        counts.forEach(n => { rows.push(out.slice(i, i + n)); i += n; });
      } else {
        out.forEach(p => {
          const last = rows[rows.length - 1];
          if (last && depth(p) - depth(last[last.length - 1]) <= 3.5) last.push(p); else rows.push([p]);
        });
      }
      rows = rows.map(r => r.slice().sort((a, b) => (a.x ?? 50) - (b.x ?? 50)));
      return gk ? [[gk], ...rows] : rows;
    }

    function layoutPitch(pitch, m, hasPlayers) {
      const W = pitch.clientWidth - 4;           // bordure de 2 px
      const dot = W < 360 ? 24 : 26;
      pitch.style.setProperty('--dot', dot + 'px');
      const L = m.lineups || {};
      const coul = couleursMatch(m);
      const sides = [
        { side: 'home', rows: lineupRows(L.home || [], m.home_team.formation || L.home_formation, 'home') },
        { side: 'away', rows: lineupRows(L.away || [], m.away_team.formation || L.away_formation, 'away') },
      ];
      const nodes = [];
      sides.forEach(S => S.rows.forEach((row, r) => row.forEach((p, i) => {
        const el = document.createElement('div');
        el.className = 'player-node';
        if (hasPlayers && p.id) { el.setAttribute('onclick', `openPlayer('${esc(p.id)}')`); el.setAttribute('role', 'button'); }
        const full = (hasPlayers && m.players[p.id] && m.players[p.id].name) || p.name;
        el.title = full;
        el.innerHTML = `<div class="player-dot ${S.side}${coul[S.side].bord ? ' lis' : ''}">${esc(p.number)}`
          + (p.rating ? `<span class="pn-rating rating-badge ${ratingClass(p.rating)}">${esc(Number(p.rating).toFixed(1))}</span>` : '')
          + `</div><span class="player-label"></span>`
          + (p.subbed_out ? `<span class="pn-out">↓${esc(p.subbed_out)}</span>` : '');
        pitch.appendChild(el);
        nodes.push({ el, p, side: S.side, row: r, k: row.length, i, full, label: el.querySelector('.player-label'), R: S.rows.length });
      })));
      // noms : le plus long qui tient dans la place d'un joueur de sa ligne (nom, initiale + nom, ellipse en dernier recours)
      nodes.forEach(n => {
        const pre = (n.p.captain ? '© ' : '') + (n.p.potm ? '⭐ ' : '');
        const maxW = Math.min(96, Math.max(48, (W - 8) / n.k - 14));
        const words = String(n.full).trim().split(/\s+/);
        const cands = [n.p.name];
        if (words.length > 1) {
          cands.push(words[0][0] + '. ' + words.slice(1).join(' '));
          cands.push(words[0][0] + '. ' + words[words.length - 1]);
          cands.push(words[words.length - 1]);
        }
        if (/\S-\S/.test(cands[cands.length - 1])) cands.push(cands[cands.length - 1].replace(/-(\S)\S*$/, '-$1.'));
        let chosen = null;
        for (const c of cands) {
          n.label.textContent = pre + c;
          if (n.label.scrollWidth <= maxW) { chosen = c; break; }
        }
        if (chosen === null) {
          n.label.textContent = pre + cands[0]; n.label.style.fontSize = '0.57rem';
          if (n.label.scrollWidth > maxW) { n.label.style.fontSize = ''; n.label.textContent = pre + cands[cands.length - 1]; n.label.style.maxWidth = maxW + 'px'; }
        }
      });
      const H = Math.max(...nodes.map(n => n.el.offsetHeight));
      const sizes = nodes.map(n => ({ w: n.el.offsetWidth, h: n.el.offsetHeight }));
      const Rmax = Math.max(...sides.map(S => S.rows.length));
      let Hh = Math.max(260, 10 + H + 36 * (Rmax - 1));
      for (let attempt = 0; attempt < 14; attempt++, Hh += 24) {
        const Hc = Hh * 2;
        const pts = nodes.map((n, idx) => {
          const c0 = H / 2 + 5, c1 = Hh - H / 2 - 5;
          const yr = n.R > 1 ? c0 + (c1 - c0) * n.row / (n.R - 1) : c0;
          const y0 = n.side === 'home' ? yr : Hc - yr;
          let x;
          if (n.k === 1) x = Math.max(0.2, Math.min(0.8, (n.p.x ?? 50) / 100)) * W;
          else x = W * (0.13 + 0.74 * n.i / (n.k - 1));
          const hw = sizes[idx].w / 2;
          return { x: Math.max(hw + 2, Math.min(W - hw - 2, x)), y: y0, y0, hw, hh: sizes[idx].h / 2, side: n.side };
        });
        const gap = 3;
        for (let it = 0; it < 120; it++) {
          let moved = false;
          for (let a = 0; a < pts.length; a++) for (let b = a + 1; b < pts.length; b++) {
            const A = pts[a], B = pts[b];
            const dx = B.x - A.x, dy = B.y - A.y;
            const ox = A.hw + B.hw + gap - Math.abs(dx), oy = A.hh + B.hh + gap - Math.abs(dy);
            if (ox > 0 && oy > 0) {
              moved = true;
              if (ox <= oy * 1.4 || Math.abs(dy) < 6) {
                const s = dx === 0 ? (a % 2 ? 1 : -1) : Math.sign(dx);
                A.x -= s * ox / 2; B.x += s * ox / 2;
              } else {
                const s = Math.sign(dy);
                A.y -= s * oy / 2; B.y += s * oy / 2;
              }
            }
          }
          pts.forEach(P => {
            P.x = Math.max(P.hw + 2, Math.min(W - P.hw - 2, P.x));
            const lim = 16;
            P.y = Math.max(P.y0 - lim, Math.min(P.y0 + lim, P.y));
            P.y = P.side === 'home' ? Math.min(P.y, Hh - P.hh - 2) : Math.max(P.y, Hh + P.hh + 2);
            P.y = Math.max(P.hh + 2, Math.min(Hc - P.hh - 2, P.y));
          });
          if (!moved) break;
        }
        let bad = false;
        for (let a = 0; a < pts.length && !bad; a++) for (let b = a + 1; b < pts.length; b++) {
          const A = pts[a], B = pts[b];
          if (A.hw + B.hw - Math.abs(B.x - A.x) > 0.5 && A.hh + B.hh - Math.abs(B.y - A.y) > 0.5) { bad = true; break; }
        }
        pitch.style.height = (Hc + 4) + 'px';
        nodes.forEach((n, idx) => { n.el.style.left = pts[idx].x.toFixed(1) + 'px'; n.el.style.top = pts[idx].y.toFixed(1) + 'px'; });
        if (!bad) break;
      }
    }

    // ===== COULEURS : début =====
    // Couleurs d'équipe (règle du 25/11/2026, voir couleurs.py : jumeau exact, comparé par `python couleurs.py --test`).
    // Maillot porté dans le match > couleur principale du club (clubs/index.json) > repli neutre ; ΔE76 < 25 : l'équipe à
    // l'extérieur prend sa secondaire, sinon un repli neutre. Texte blanc / noir selon le contraste WCAG, liseré pour les aplats
    // quasi blancs ou noirs, `encre` = couleur lisible comme texte sur la page.
    const COUL_SEUIL_DE = 25, COUL_SEUIL_TEXTE = 4.5, COUL_LUM_BLANC = 0.85, COUL_LUM_NOIR = 0.04;
    const COUL_NEUTRE_DOM = '#38bdf8', COUL_NEUTRE_EXT = '#f43f5e';
    const COUL_FONDS_PAGE = ['#151c28', '#0b0f17', '#202b3d'];   // --bg-card, --bg-main, --bg-elevated
    const COUL_BORDS = ['#e2e8f0', '#7c8799', '#1e293b'];
    const coulValide = (h) => typeof h === 'string' && /^#[0-9a-fA-F]{6}$/.test(h);
    const coulRgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    const coulHex = (r, g, b) => '#' + [r, g, b].map(x => Math.max(0, Math.min(255, Math.floor(x + 0.5))).toString(16).padStart(2, '0')).join('');
    const coulLin = (v) => { const s = v / 255; return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4); };
    function coulLuminance(h) { const [r, g, b] = coulRgb(h); return 0.2126 * coulLin(r) + 0.7152 * coulLin(g) + 0.0722 * coulLin(b); }
    function coulContraste(a, b) {
      const la = coulLuminance(a), lb = coulLuminance(b);
      return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
    }
    function coulLab(h) {
      const [R, G, B] = coulRgb(h).map(coulLin);
      const x = (0.4124564 * R + 0.3575761 * G + 0.1804375 * B) / 0.95047;
      const y = 0.2126729 * R + 0.7151522 * G + 0.0721750 * B;
      const z = (0.0193339 * R + 0.1191920 * G + 0.9503041 * B) / 1.08883;
      const f = (t) => t > 216 / 24389 ? Math.pow(t, 1 / 3) : (24389 / 27 * t + 16) / 116;
      const fx = f(x), fy = f(y), fz = f(z);
      return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
    }
    function coulDeltaE76(a, b) {
      const p = coulLab(a), q = coulLab(b);
      return Math.sqrt((p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2 + (p[2] - q[2]) ** 2);
    }
    const coulTexteSur = (fond) => coulContraste('#ffffff', fond) >= coulContraste('#000000', fond) ? '#ffffff' : '#000000';
    function coulBordPour(fond, fondsPage) {
      const lum = coulLuminance(fond);
      if (!(lum > COUL_LUM_BLANC || lum < COUL_LUM_NOIR)) return null;
      let best = COUL_BORDS[0], score = -1;
      for (const b of COUL_BORDS) {
        const s = Math.min(coulContraste(b, fond), ...fondsPage.map(p => coulContraste(b, p)));
        if (s > score + 1e-9) { best = b; score = s; }
      }
      return best;
    }
    function coulEncrePour(fond, fondsPage) {
      const sombre = fondsPage.reduce((s, f) => s + coulLuminance(f), 0) / fondsPage.length < 0.5;
      const cible = sombre ? '#ffffff' : '#000000';
      const [r0, g0, b0] = coulRgb(fond), [r1, g1, b1] = coulRgb(cible);
      for (let k = 0; k <= 20; k++) {
        const t = k / 20, c = coulHex(r0 + (r1 - r0) * t, g0 + (g1 - g0) * t, b0 + (b1 - b0) * t);
        if (Math.min(...fondsPage.map(p => coulContraste(c, p))) >= COUL_SEUIL_TEXTE) return c;
      }
      return cible;
    }
    function coulHabiller(fond, source, fondsPage) {
      return { fond, texte: coulTexteSur(fond), bord: coulBordPour(fond, fondsPage), encre: coulEncrePour(fond, fondsPage), source };
    }
    function coulChoix(eq, neutre) {
      if (coulValide(eq.maillot)) return [eq.maillot.toLowerCase(), 'maillot'];
      if (coulValide(eq.principale)) return [eq.principale.toLowerCase(), 'club'];
      return [neutre, 'neutre'];
    }
    // dom / ext : { maillot, principale, secondaire } (clés facultatives) -> { home, away } = { fond, texte, bord, encre, source }
    function coulChoisir(dom, ext, fondsPage) {
      let [h, hs] = coulChoix(dom, COUL_NEUTRE_DOM), [a, as] = coulChoix(ext, COUL_NEUTRE_EXT);
      if (coulDeltaE76(h, a) < COUL_SEUIL_DE) {
        const cands = [];
        if (coulValide(ext.secondaire)) cands.push([ext.secondaire.toLowerCase(), 'secondaire']);
        cands.push([COUL_NEUTRE_EXT, 'neutre'], [COUL_NEUTRE_DOM, 'neutre']);
        for (const [hx, src] of cands) {
          if (coulDeltaE76(h, hx) >= COUL_SEUIL_DE) { a = hx; as = src; break; }
        }
      }
      return { home: coulHabiller(h, hs, fondsPage), away: coulHabiller(a, as, fondsPage) };
    }
    // Fonds de page réels (thème courant) ; repli = valeurs du thème sombre
    function coulFondsPage() {
      try {
        const cs = getComputedStyle(document.documentElement);
        const l = ['--bg-card', '--bg-main', '--bg-elevated'].map(k => cs.getPropertyValue(k).trim());
        return l.every(coulValide) ? l : COUL_FONDS_PAGE;
      } catch (e) { return COUL_FONDS_PAGE; }
    }
    // LA fonction de couleurs d'un match : { home: { fond, texte, bord, encre, source }, away: { … } }
    function couleursMatch(m) {
      const eq = (t) => {
        const c = (clubIndex && t && t.id != null && clubIndex.get(String(t.id)) || {}).couleurs || {};
        return { maillot: t && t.shirt_color, principale: c.principale, secondaire: c.secondaire };
      };
      return coulChoisir(eq(m.home_team), eq(m.away_team), coulFondsPage());
    }
    // Couleur d'un club seul (accent de sa fiche) : principale du club, sinon accent neutre de la page
    function couleurClub(id) {
      const c = (clubIndex && id != null && clubIndex.get(String(id)) || {}).couleurs || {};
      return coulHabiller(coulValide(c.principale) ? c.principale.toLowerCase() : COUL_NEUTRE_DOM, coulValide(c.principale) ? 'club' : 'neutre', coulFondsPage());
    }
    // Variables CSS --<pref>-color / -ink / -on / -bord d'une équipe (un style en ligne, valeurs déjà validées en hex)
    const coulVars = (pref, c) => `--${pref}-color:${c.fond};--${pref}-ink:${c.encre};--${pref}-on:${c.texte};--${pref}-bord:${c.bord || 'transparent'};`;
    // ===== COULEURS : fin =====
    const COUL_PROPS = ['color', 'ink', 'on', 'bord'];
    // Pose les variables CSS des deux équipes d'un match sur un élément (fiche de match, tuile, carte)
    function coulPoserMatch(el, m) {
      const c = couleursMatch(m);
      for (const [pref, k] of [['home', c.home], ['away', c.away]]) {
        el.style.setProperty(`--${pref}-color`, k.fond); el.style.setProperty(`--${pref}-ink`, k.encre);
        el.style.setProperty(`--${pref}-on`, k.texte); el.style.setProperty(`--${pref}-bord`, k.bord || 'transparent');
      }
      return c;
    }
    const coulStyleMatch = (m) => { const c = couleursMatch(m); return coulVars('home', c.home) + coulVars('away', c.away); };
    function coulPoserClub(el, id) {
      const c = couleurClub(id);
      el.style.setProperty('--club-color', c.fond); el.style.setProperty('--club-ink', c.encre);
      el.style.setProperty('--club-on', c.texte); el.style.setProperty('--club-bord', c.bord || 'transparent');
    }

    // ---------- Momentum (en tête de l'onglet Stats) ----------
    const MO = { W: 300, X0: 5, MID: 66, AMP: 60, BOTTOM: 132 };
    function momentumHtml(m) {
      const pts = m.momentum || [];
      if (pts.length === 0) {
        if (m.direct) return `<h4 class="st-sec">Momentum</h4><div class="empty-state">En direct, le graphique de pression n'est pas encore disponible : il est calculé à partir des actions du match, après la rencontre.</div>`;
        if (m.flux === 'reduit') return `<h4 class="st-sec">Momentum</h4><div class="empty-state">ESPN ne publie pour ce match que les actions clés (buts, cartons, remplacements) : pas de graphique de pression, pas de stats par mi-temps, pas de note des joueurs ni de buts attendus (xG). Les statistiques ci-dessous sont celles du match entier.</div>`;
        return `<h4 class="st-sec">Momentum</h4><div class="empty-state">Actions du match indisponibles : pas de graphique de pression pour cette rencontre.</div>`;
      }
      const { W, X0, MID, AMP, BOTTOM } = MO;
      const n = pts.length;
      const xOf = (i) => X0 + (n > 1 ? i * W / (n - 1) : W / 2);
      const yOf = (v) => MID - Math.max(-100, Math.min(100, Number(v) || 0)) / 100 * AMP;
      const labelOf = (p) => p.label || `${p.minute}'`;
      const idxOfLabel = (lbl, minute) => {
        let i = pts.findIndex(p => labelOf(p) === lbl);
        if (i < 0) i = pts.reduce((best, p, j) => Math.abs(p.minute - minute) < Math.abs(pts[best].minute - minute) ? j : best, 0);
        return i;
      };
      const line = pts.map((p, i) => `${xOf(i).toFixed(2)},${yOf(p.value).toFixed(2)}`).join(' L ');
      const area = `M ${xOf(0).toFixed(2)},${MID} L ${line} L ${xOf(n - 1).toFixed(2)},${MID} Z`;
      const htIdx = pts.findIndex(p => p.phase === 'SECOND_HALF');
      const htX = htIdx > 0 ? (xOf(htIdx - 1) + xOf(htIdx)) / 2 : null;
      const ticks = [15, 30, 45, 60, 75, 90].filter(mn => !(mn === 45 && htIdx > 0)).map(mn => {
        const i = pts.findIndex(p => p.minute === mn && !String(labelOf(p)).includes('+'));
        return i < 0 ? '' : `<text x="${xOf(i).toFixed(1)}" y="${BOTTOM + 9}" font-size="8" fill="#94a3b8" text-anchor="middle">${mn}'</text>`;
      }).join('');
      const cm = couleursMatch(m);
      const goals = (m.events || []).filter(e => e.type === 'goal').map(e => {
        const x = xOf(idxOfLabel(e.minute_label, e.minute));
        const home = e.team === 'home';
        const y = home ? 6 : BOTTOM - 4;
        return `<line x1="${x.toFixed(1)}" y1="${home ? 12 : MID}" x2="${x.toFixed(1)}" y2="${home ? MID : BOTTOM - 10}" stroke="${home ? cm.home.fond : cm.away.fond}" stroke-opacity="0.55" stroke-width="0.6" stroke-dasharray="1.5,1.5" />
                <text x="${x.toFixed(1)}" y="${y}" font-size="9" text-anchor="middle" dominant-baseline="middle">⚽</text>`;
      }).join('');
      return `
        <h4 class="st-sec">Momentum ${infoBtn(`<p>⚽ but · MT mi-temps · au-dessus de la ligne : pression de ${esc(m.home_team.short)}, en dessous : ${esc(m.away_team.short)}.</p><p>Indice de pression minute par minute (lissé sur environ 5 min), calculé à partir des actions ${m.source ? 'Opta (ESPN) : buts, tirs, passes et centres vers la surface adverse' : 'officielles UEFA : buts, tirs, attaques dangereuses'}, corners, arrêts adverses, hors-jeu et coups francs obtenus.</p>`, 'Comment lire le momentum')}</h4>
        <div class="momentum-box">
          <div class="momentum-legend">
            <span style="color:var(--home-ink)">▲ ${esc(m.home_team.short)}</span>
            <span id="momentum-readout" style="color:var(--text-muted);font-weight:500">Touchez le graphique</span>
            <span style="color:var(--away-ink)">▼ ${esc(m.away_team.short)}</span>
          </div>
          <svg id="momentum-svg" data-noswipe="1" viewBox="0 0 310 ${BOTTOM + 14}" style="width:100%;height:auto;touch-action:pan-y;display:block">
            <defs>
              <clipPath id="clip-home"><rect x="0" y="0" width="310" height="${MID}" /></clipPath>
              <clipPath id="clip-away"><rect x="0" y="${MID}" width="310" height="${BOTTOM - MID}" /></clipPath>
              <linearGradient id="grad-home" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${cm.home.fond}" stop-opacity="0.95"/><stop offset="1" stop-color="${cm.home.fond}" stop-opacity="0.25"/></linearGradient>
              <linearGradient id="grad-away" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${cm.away.fond}" stop-opacity="0.25"/><stop offset="1" stop-color="${cm.away.fond}" stop-opacity="0.95"/></linearGradient>
            </defs>
            ${htX !== null ? `<line x1="${htX.toFixed(1)}" y1="2" x2="${htX.toFixed(1)}" y2="${BOTTOM}" stroke="#475569" stroke-dasharray="2,2" stroke-width="0.6" /><text x="${htX.toFixed(1)}" y="${BOTTOM + 9}" font-size="8" fill="#94a3b8" text-anchor="middle">MT</text>` : ''}
            <path d="${area}" fill="url(#grad-home)" clip-path="url(#clip-home)"${cm.home.bord ? ` stroke="${cm.home.bord}" stroke-width="0.8"` : ''} />
            <path d="${area}" fill="url(#grad-away)" clip-path="url(#clip-away)"${cm.away.bord ? ` stroke="${cm.away.bord}" stroke-width="0.8"` : ''} />
            <line x1="0" y1="${MID}" x2="310" y2="${MID}" stroke="#475569" stroke-width="0.6" />
            ${goals}${ticks}
            <line id="momentum-cursor" x1="0" y1="2" x2="0" y2="${BOTTOM}" stroke="#e2e8f0" stroke-width="0.5" visibility="hidden" />
          </svg>
        </div>`;
    }

    function bindMomentum(m) {
      const svg = document.getElementById('momentum-svg');
      if (!svg) return;
      const pts = m.momentum || [], n = pts.length;
      const { W, X0, BOTTOM } = MO;
      const xOf = (i) => X0 + (n > 1 ? i * W / (n - 1) : W / 2);
      const readout = document.getElementById('momentum-readout');
      const cursor = document.getElementById('momentum-cursor');
      const show = (evt) => {
        const r = svg.getBoundingClientRect();
        const x = (evt.clientX - r.left) / r.width * 310;
        const i = Math.max(0, Math.min(n - 1, Math.round((x - X0) / (n > 1 ? W / (n - 1) : 1))));
        const p = pts[i];
        const who = p.value > 15 ? `pression ${m.home_team.short}` : p.value < -15 ? `pression ${m.away_team.short}` : 'équilibré';
        readout.textContent = `${p.label || p.minute + "'"} · ${who}`;
        cursor.setAttribute('x1', xOf(i)); cursor.setAttribute('x2', xOf(i)); cursor.setAttribute('visibility', 'visible');
      };
      svg.addEventListener('pointermove', show);
      svg.addEventListener('pointerdown', show);
    }

    // ---------- Stats : rubriques, possession en grand, lignes à barre divergente ----------
    const STAT_GROUPS = [
      ['Tirs', ['xgot', 'xg_sans_penalty', 'attempts', 'attempts_on_target', 'attempts_off_target', 'attempts_blocked', 'shot_in_penalty_area', 'big_chances', 'woodwork']],
      ['Construction / passes', ['xa', 'passes_attempted', 'passes_completed', 'passes_accuracy', 'key_passes', 'delivery_into_penalty_area', 'box_entries', 'final_third_entries', 'touches_opp_box', 'cross_attempted', 'long_balls']],
      ['Attaque', ['attacks', 'counterattack', 'dribbles', 'corners', 'offsides']],
      ['Défense / gardien', ['saves', 'recovered_ball', 'tackles', 'tackles_won', 'interceptions', 'clearances', 'duels_won', 'aerials_won', 'ppda']],
      ['Discipline', ['fouls_committed', 'yellow_cards', 'red_cards']],
      ['Physique', ['distance_covered', 'top_speed', 'sprints']],
    ];
    // Buts attendus (ESPN / Opta) : 2 décimales, virgule française ; absents des mi-temps (ESPN n'en donne pas)
    const XG_KEYS = ['xg', 'xgot', 'xg_sans_penalty', 'xa'];
    const fmtStat = (v, pct, dec) => {
      const n = Number(v);
      const t = Number.isFinite(n)
        ? n.toLocaleString('fr-FR', dec ? { minimumFractionDigits: 2, maximumFractionDigits: 2 } : { maximumFractionDigits: 1 })
        : String(v ?? '—');
      return pct ? t + ' %' : t;
    };

    function statsHtml(m) {
      const statsObj = m.stats || {};
      const hasHalves = (statsObj['1st'] || []).length > 0 && (statsObj['2nd'] || []).length > 0;
      const period = hasHalves ? currentStatsPeriod : 'all';
      const items = statsObj[period] || [];
      const pills = hasHalves ? `
        <div class="period-pills">
          <button class="period-btn ${period === 'all' ? 'active' : ''}" onclick="switchStatsPeriod('all')">Match complet</button>
          <button class="period-btn ${period === '1st' ? 'active' : ''}" onclick="switchStatsPeriod('1st')">1re mi-temps</button>
          <button class="period-btn ${period === '2nd' ? 'active' : ''}" onclick="switchStatsPeriod('2nd')">2e mi-temps</button>
        </div>` : '';
      if (!items.length) return `<h4 class="st-sec">Statistiques</h4>${pills}<div class="empty-state">Statistiques indisponibles.</div>`;
      const row = (s) => {
        const h = Number(s.home), a = Number(s.away);
        const pct = /\(%\)/.test(s.label || '');
        const label = String(s.label || '').replace(/\s*\(%\)/, '');
        const dec = XG_KEYS.includes(s.key);
        const total = (Number.isFinite(h) ? h : 0) + (Number.isFinite(a) ? a : 0);
        const hp = total > 0 ? Math.round(h / total * 100) : 0, ap = total > 0 ? 100 - hp : 0;
        const dh = h > a ? 'dom' : h === a ? 'eq' : '', da = a > h ? 'dom' : h === a ? 'eq' : '';
        return `
          <div class="st-row">
            <div class="st-top">
              <span class="st-v home ${dh}">${esc(fmtStat(s.home, pct, dec))}</span>
              <span class="st-l">${esc(label)}</span>
              <span class="st-v away ${da}">${esc(fmtStat(s.away, pct, dec))}</span>
            </div>
            <div class="st-bar">
              <span class="st-half l"><i class="${a > h ? 'dim' : ''}" style="width:${hp}%"></i></span>
              <span class="st-half r"><i class="${h > a ? 'dim' : ''}" style="width:${ap}%"></i></span>
            </div>
          </div>`;
      };
      const poss = items.find(s => s.key === 'ball_possession' && Number.isFinite(Number(s.home)) && Number.isFinite(Number(s.away)) && Number(s.home) + Number(s.away) > 0);
      const possHtml = poss ? (() => {
        const t = Number(poss.home) + Number(poss.away), hp = Number(poss.home) / t * 100;
        return `<div class="poss"><div class="poss-lbl">Possession</div>
          <div class="poss-vals"><span class="poss-v home">${esc(fmtStat(poss.home, true))}</span><span class="poss-v away">${esc(fmtStat(poss.away, true))}</span></div>
          <div class="poss-bar"><i class="h" style="width:${hp.toFixed(1)}%"></i><i class="a" style="width:${(100 - hp).toFixed(1)}%"></i></div></div>`;
      })() : '';
      const xg = period === 'all' ? items.find(s => s.key === 'xg' && Number.isFinite(Number(s.home)) && Number.isFinite(Number(s.away))) : null;
      const xgHtml = xg ? (() => {
        const t = Number(xg.home) + Number(xg.away), hp = t > 0 ? Number(xg.home) / t * 100 : 50;
        const info = infoBtn(`<p><b>Buts attendus (xG)</b> : somme, tir par tir, de la probabilité estimée qu'il devienne un but. C'est une <b>estimation statistique</b> de la qualité des occasions, pas un fait du match.</p><p>Source : ${esc(m.xg_source || 'ESPN (Opta)')} — le modèle d'Opta, relayé par ESPN ; l'UEFA ne publie pas d'xG. Valeur du match complet seulement (pas de décompte par mi-temps). xGOT : xG des tirs cadrés ; xA : passes décisives attendues.</p>${m.xg_note ? `<p>${esc(m.xg_note)}</p>` : ''}`, 'Définition et source des buts attendus');
        return `<div class="poss xg"><div class="poss-lbl">Buts attendus <span style="text-transform:none">(xG)</span> ${info}</div>
          <div class="poss-vals"><span class="poss-v home">${esc(fmtStat(xg.home, false, true))}</span><span class="poss-v away">${esc(fmtStat(xg.away, false, true))}</span></div>
          <div class="poss-bar"><i class="h" style="width:${hp.toFixed(1)}%"></i><i class="a" style="width:${(100 - hp).toFixed(1)}%"></i></div></div>`;
      })() : '';
      const used = new Set([...(poss ? ['ball_possession'] : []), ...(xg ? ['xg'] : [])]);
      const groups = STAT_GROUPS.map(([title, keys]) => {
        const rows = items.filter(s => keys.includes(s.key));
        rows.forEach(s => used.add(s.key));
        return rows.length ? `<h4 class="st-sec">${esc(title)}</h4>${rows.map(row).join('')}` : '';
      }).join('');
      const rest = items.filter(s => !used.has(s.key));
      const restHtml = rest.length ? `<h4 class="st-sec">Autres</h4>${rest.map(row).join('')}` : '';
      const srcNom = m.source ? 'ESPN (données Opta)' : 'statistiques officielles UEFA';
      const note = period !== 'all' ? `Par mi-temps : décompte des actions ${m.source ? 'Opta' : 'officielles UEFA'} de la période (pas de buts attendus : ESPN n'en donne que pour le match complet).` : 'Source : ' + srcNom + (m.xg_source && !m.source ? ' ; buts attendus (xG, xGOT, xA) : ' + m.xg_source + '.' : '.');
      return `<h4 class="st-sec">Statistiques ${infoBtn(`<p>${esc(note)}</p>`, 'Source des statistiques')}</h4>${pills}
        <div class="st-wrap">
          <div class="st-head">
            <span class="st-team home"><i class="sw"></i>${flag(m.home_team)}<span>${esc(m.home_team.short || m.home_team.name)}</span></span>
            <span class="st-team away"><span>${esc(m.away_team.short || m.away_team.name)}</span>${flag(m.away_team)}<i class="sw"></i></span>
          </div>
          ${possHtml}${xgHtml}${groups}${restHtml}
        </div>`;
    }

    // ---------- Fermeture d'une feuille par glissement vers le bas (fiche de match ET fiche joueur) ----------
    // Part de la poignée / de l'en-tête (headSel), ou du contenu déjà tout en haut (scrollTop = 0) ; la feuille suit
    // le doigt, se ferme au-delà de 25 % de sa hauteur ou d'un geste rapide, sinon revient en place.
    function attachSheetDrag(sheet, scroller, headSel, onClose) {
      let st = null;
      const reduce = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      sheet.addEventListener('touchstart', (e) => {
        st = null;
        if (e.touches.length !== 1) return;
        const head = !!e.target.closest(headSel);
        const inBody = scroller.contains(e.target);
        if (!head && !(inBody && scroller.scrollTop <= 0)) return;
        st = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now(), head, drag: false, dy: 0, top: scroller.scrollTop };
        sheet.classList.remove('settle');
      }, { passive: true });
      sheet.addEventListener('touchmove', (e) => {
        if (!st) return;
        const dx = e.touches[0].clientX - st.x, dy = e.touches[0].clientY - st.y;
        if (!st.drag) {
          if (!(dy > 8 && dy > 1.5 * Math.abs(dx))) { if (Math.abs(dx) > 12 || dy < -8) st = null; return; }
          if (!st.head && scroller.scrollTop > 0) { st = null; return; }
          st.drag = true;
          // Le glissement de feuille possède tout le reste du geste : le contenu ne défile plus jusqu'au relâchement.
          scroller.style.overflowY = 'hidden';
          closeInfo();
        }
        if (e.cancelable) e.preventDefault();
        scroller.scrollTop = st.top;
        st.dy = Math.max(0, dy);
        sheet.style.transform = `translateY(${st.dy}px)`;
      }, { passive: false });
      const end = () => {
        if (!st) return;
        const s = st; st = null;
        if (!s.drag) return;
        scroller.style.overflowY = '';
        scroller.scrollTop = s.top;
        const v = s.dy / Math.max(1, Date.now() - s.t);
        const close = s.dy > sheet.offsetHeight * 0.25 || (v > 0.4 && s.dy > 30);
        const done = () => { sheet.classList.remove('settle'); sheet.style.transform = ''; };
        if (reduce()) { if (close) onClose(); done(); return; }
        sheet.classList.add('settle');
        sheet.style.transform = close ? 'translateY(100%)' : 'translateY(0)';
        setTimeout(() => { if (close) onClose(); done(); }, 230);
      };
      sheet.addEventListener('touchend', end, { passive: true });
      sheet.addEventListener('touchcancel', end, { passive: true });
    }
    attachSheetDrag(document.getElementById('modal-sheet'), document.getElementById('modal-body-content'), '.sheet-handle, .modal-header', () => closeMatchModal());
    attachSheetDrag(document.getElementById('player-sheet'), document.getElementById('player-body'), '.sheet-handle, .ps-head', () => closePlayer());
    attachSheetDrag(document.getElementById('tour-sheet'), document.getElementById('tour-list'), '.sheet-handle, .tour-head', () => closeTourMenu());
    attachSheetDrag(document.getElementById('club-sheet'), document.getElementById('club-body'), '.sheet-handle, .club-head', () => closeClub());

    // ---------- Glissement horizontal entre onglets : COMPOSANT UNIQUE ----------
    // slideIn(el, 'slide-l' | 'slide-r') : transition d'arrivée du nouveau contenu (désactivée si prefers-reduced-motion).
    function slideIn(el, cls) {
      el.classList.remove('slide-l', 'slide-r');
      if (cls) { void el.offsetWidth; el.classList.add(cls); }
    }
    // attachTabSwipe({ zone, stop, tabs, current, go }) : un geste horizontal dans `zone()` passe à l'onglet voisin.
    //   zone()    élément sensible (null = désactivé) ; stop() borne de la remontée DOM pour détecter un défilement en X
    //   tabs()    identifiants des onglets dans l'ordre ; current() onglet actif ; go(id, 'slide-l' | 'slide-r') change d'onglet
    // Règles communes à tous les usages : seuil 56 px, |dx| >= 1,5 |dy| (le défilement vertical n'est jamais gêné), pas de
    // boucle (aucun effet au premier / dernier onglet), ignoré sur un élément défilant en X ou marqué data-noswipe, et sur les
    // champs de saisie. Écoute en fin de geste seulement (aucun preventDefault) : le défilement vertical reste natif.
    // Réutilisé par l'accueil (coupes), la fiche de match (Déroulé / Compos / Stats) et toute future feuille (fiche club).
    function attachTabSwipe({ zone, stop, tabs, current, go, min = 56 }) {
      let sx = 0, sy = 0, ok = false;
      const scrollsX = (el, limit) => {
        for (; el && el !== limit; el = el.parentElement) {
          if (el.dataset && el.dataset.noswipe) return true;
          if (el.scrollWidth > el.clientWidth + 1 && /(auto|scroll)/.test(getComputedStyle(el).overflowX)) return true;
        }
        return false;
      };
      document.addEventListener('touchstart', (e) => {
        const z = zone();
        ok = !!(z && e.touches.length === 1 && z.contains(e.target) && !e.target.closest('input, select, textarea') &&
                !scrollsX(e.target, stop ? stop() : z.parentElement));
        if (ok) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
      }, { passive: true });
      document.addEventListener('touchcancel', () => { ok = false; }, { passive: true });
      document.addEventListener('touchend', (e) => {
        if (!ok) return;
        ok = false;
        const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
        if (Math.abs(dx) < min || Math.abs(dx) < 1.5 * Math.abs(dy)) return;
        const list = tabs(), i = list.indexOf(current()), j = i + (dx < 0 ? 1 : -1);
        if (i < 0 || j < 0 || j >= list.length) return;
        closeInfo();
        go(list[j], dx < 0 ? 'slide-l' : 'slide-r');
      }, { passive: true });
    }
    const MODAL_VIEWS = ['events', 'lineups', 'stats'];
    attachTabSwipe({   // fiche de match
      zone: () => document.getElementById('modal-body-content'),
      stop: () => document.getElementById('modal-sheet'),
      tabs: () => MODAL_VIEWS, current: () => currentModalView, go: switchModalView,
    });
    attachTabSwipe({   // accueil : LDC / LE / LC (la zone s'arrête là où commence une feuille ouverte : elles sont hors de <main>)
      zone: () => document.getElementById('main-zone'),
      stop: () => document.body,
      tabs: () => vue === 'comp' ? ESPACES[espaceDe(currentComp)].keys : [], current: () => currentComp, go: switchCompetition,
    });

    // ---------- Empilement des feuilles : la dernière ouverte est au-dessus (fiche de match, de club, de joueur) ----------
    // Chaque feuille (backdrop) reçoit un z-index croissant à l'ouverture : une fiche club ouverte depuis un match est au-dessus
    // du match, un match ouvert depuis une fiche club au-dessus du club, un joueur au-dessus de ce qui l'ouvre. La fermeture
    // (bouton, glissement vers le bas, fond, Échap) ne ferme que la feuille du dessus.
    let zTop = 100;
    function bringToFront(el) { el.style.zIndex = String(++zTop); }
    const SHEET_IDS = ['match-modal', 'club-modal', 'player-modal', 'tour-modal'];
    function syncBodyLock() {
      document.body.style.overflow = SHEET_IDS.some(id => document.getElementById(id).classList.contains('open')) ? 'hidden' : '';
    }
    function closeTopSheet() {
      const ouvertes = SHEET_IDS.map(id => document.getElementById(id)).filter(el => el.classList.contains('open'));
      if (!ouvertes.length) return;
      const haut = ouvertes.reduce((a, b) => Number(b.style.zIndex || 0) > Number(a.style.zIndex || 0) ? b : a);
      if (haut.id === 'player-modal') closePlayer(); else if (haut.id === 'club-modal') closeClub(); else if (haut.id === 'tour-modal') closeTourMenu(); else closeMatchModal();
    }
    let toastTimer = null;
    function toast(msg) {
      let t = document.getElementById('toast');
      if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
      t.textContent = msg; t.hidden = false;
      clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
    }

    // « Soirée du 2026-11-04 » -> « Soirée du mercredi 4 novembre » (les libellés enregistrés portent une date ISO)
    function dateEnToutesLettres(txt) {
      return String(txt).replace(/\b(\d{4})-(\d{2})-(\d{2})\b/g, (m, a, b, c) => {
        const d = new Date(`${a}-${b}-${c}T12:00:00Z`);
        return isNaN(d) ? m : d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
      });
    }

    // ---------- Fiches de club : clubs/index.json (108 clubs) + clubs/<id UEFA>.json ----------
    const CLUB_VIEWS = ['apercu', 'matchs', 'stats', 'effectif', 'histoire'];
        let clubIndex = null;            // Map id -> entrée de l'index ; null = pas d'index (aucun lien vers une fiche)
    const clubCache = new Map();
    let activeClub = null, currentClubView = 'apercu', clubToken = 0;

    // Index commun des fiches : clubs des coupes (clubs/index.json, ids UEFA) + clubs des championnats (donnees-football,
    // championnats/clubs/index.json, ids `espn-…`). Un club présent des deux côtés (correspondance PROUVÉE par un match de coupe,
    // fiches_ligues.py) a UNE fiche : les deux entrées pointent l'une vers l'autre (`uefa_id` / `espn`).
    async function loadClubIndex() {
      const [d, l, eu] = await Promise.all([fetchJson('clubs/index.json'), fetchJson(DONNEES + 'championnats/clubs/index.json'), fetchJson('clubs/europe.json')]);
      europeSaison = eu && eu.clubs ? eu : null;
      const m = new Map();
      ((d && d.clubs) || []).forEach(c => m.set(String(c.id), c));
      ((l && l.clubs) || []).forEach(c => {
        m.set(String(c.id), { ...c, source: 'ligue' });
        if (c.uefa_id && m.has(String(c.uefa_id))) m.set(String(c.uefa_id), { ...m.get(String(c.uefa_id)), espn: String(c.id) });
      });
      clubIndex = m.size ? m : null;
    }
    const hasClub = (id) => !!(clubIndex && id != null && clubIndex.has(String(id)));
    // Lien vers la fiche d'un club (texte simple si le club n'a pas de fiche) ; `html` est déjà échappé par l'appelant
    function clubLink(id, html) {
      return hasClub(id) && !ctxSelection ? `<button type="button" class="club-link" onclick="event.stopPropagation(); openClub('${esc(id)}')">${html}</button>` : html;
    }

    const jourCourt = (iso) => iso ? new Date(iso + 'T12:00:00Z').toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }) : '';
    const jourLong = (iso) => iso ? new Date(iso + 'T12:00:00Z').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }) : '';
    const heureParis = (isoUtc) => isoUtc ? new Date(isoUtc).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris' }) : '';
    const nf = (v) => (typeof v === 'number') ? v.toLocaleString('fr-FR', { maximumFractionDigits: 1 }) : v;
    const lienSur = (u) => /^https?:\/\//i.test(u || '') ? u : '';

    async function loadClub(id) {
      if (clubCache.has(id)) return clubCache.get(id);
      const e = (clubIndex && clubIndex.get(id)) || {};
      const idUefa = id.startsWith('espn-') ? e.uefa_id : id;
      const idLigue = id.startsWith('espn-') ? id : e.espn;
      const eLigue = idLigue && clubIndex && clubIndex.get(idLigue);
      const [u, l] = await Promise.all([
        idUefa ? fetchJson('clubs/' + encodeURIComponent(idUefa) + '.json') : null,
        eLigue ? fetchJson(DONNEES + eLigue.fichier) : null]);
      const f = fusionnerFiches(u, l);
      if (f) [id, idUefa, idLigue].filter(Boolean).forEach(k => clubCache.set(String(k), f));
      return f;
    }
    // Fiche unique d'un club présent en coupe ET en championnat : base UEFA (stade, Wikidata, Wikipédia, histoire européenne),
    // + championnat (matchs, classement, stats) ; joueurs rapprochés par date de naissance ET nom (un mot du nom en commun), jamais
    // par le nom seul ; un joueur non rapproché reste listé tel quel.
    const motsNom = (n) => new Set(String(n || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').split(/[^a-z]+/).filter(x => x.length > 2));
    function fusionnerFiches(u, l) {
      if (!u || !l) return u || l || null;
      const matchs = [...((l.saison || {}).matchs || []), ...((u.saison || {}).matchs || [])]
        .sort((a, b) => String(a.heure_utc || a.date).localeCompare(String(b.heure_utc || b.date)));
      const joues = matchs.filter(x => x.pour != null);
      const maintenant = new Date().toISOString().slice(0, 16);
      const futur = matchs.find(x => x.pour == null && String(x.heure_utc || '') >= maintenant);
      const eff = (u.effectif || []).map(j => ({ ...j }));
      (l.effectif || []).forEach(e => {
        const mots = motsNom(e.nom);
        const j = e.naissance && eff.find(x => x.naissance === e.naissance && [...motsNom(x.nom)].some(w => mots.has(w)));
        if (j) { j.stats = { ...(e.stats || {}), ...(j.stats || {}) }; j.matchs = e.matchs; j.joue = j.joue || e.joue; j.ids = [j.id, e.id]; j.wd = j.wd || e.wd; j.wp = j.wp || e.wp; }
        else eff.push(e);
      });
      return { ...u, ligue: l.ligue, espn_id: l.espn_id, competitions: [...(l.competitions || []), ...(u.competitions || [])],
        saison: { ...(u.saison || {}), matchs, forme: joues.slice(-5).map(x => x.resultat), prochain: futur ? futur.match_id : null },
        rang: [...(l.rang || []), ...(u.rang || [])], stats: { ...(l.stats || {}), ...(u.stats || {}) },
        stade: u.stade || l.stade, championnat_hist: l.championnat_hist, effectif: eff, maj: [u.maj, l.maj].filter(Boolean).sort().pop() };
    }
    // Nationalité en français d'après le code drapeau (ESPN donne le nom anglais) ; repli : nom tel que publié
    const NOMS_PAYS = (() => { try { return new Intl.DisplayNames(['fr'], { type: 'region' }); } catch (e) { return null; } })();
    function nationaliteFr(j) {
      if (j && /^[a-z]{2}$/.test(j.drapeau || '') && NOMS_PAYS && String(j.id || '').startsWith('espn-')) {
        try { return NOMS_PAYS.of(j.drapeau.toUpperCase()) || j.nationalite; } catch (e) { /* code inconnu */ }
      }
      return (j && j.nationalite) || '';
    }

    async function openClub(id, view) {
      id = String(id);
      const token = ++clubToken;
      const modal = document.getElementById('club-modal'), body = document.getElementById('club-body');
      modal.classList.add('open'); bringToFront(modal); syncBodyLock();
      const entree = clubIndex && clubIndex.get(id);
      coulPoserClub(document.getElementById('club-sheet'), id);
      if (!activeClub || activeClub.id !== id) {
        activeClub = null;
        document.getElementById('club-head').innerHTML = clubHeadHtml(entree ? { id, nom: entree.nom, pays: entree.pays, drapeau: entree.drapeau, logos: entree.logos } : { id, nom: '…' });
        body.innerHTML = '<div class="empty-state">Chargement de la fiche…</div>';
      }
      const f = await loadClub(id);
      if (token !== clubToken) return;
      if (!f) {
        body.innerHTML = `<div class="empty-state">La fiche de ce club est indisponible pour le moment.</div>`;
        return;
      }
      activeClub = f;
      document.getElementById('club-head').innerHTML = clubHeadHtml(f);
      switchClubView(view || 'apercu');
    }

    function closeClub() {
      document.getElementById('club-modal').classList.remove('open');
      syncBodyLock();
    }

    function clubHeadHtml(f) {
      const logo = f.logos && (f.logos['240'] || f.logos['70']);
      const comps = (f.competitions || []).map(c => COMP_FULL[c] || c).join(' · ');
      return `<div class="modal-close-row">
          <span class="section-sub">${esc(comps)}</span>
          <button class="btn-close" onclick="closeClub()" aria-label="Fermer">✕</button>
        </div>
        <div class="club-id">
          ${logo ? `<img class="club-logo" src="${esc(logo)}" alt="" onerror="this.style.visibility='hidden'">` : '<span class="club-logo vide"></span>'}
          <div>
            <div class="club-name">${esc(f.nom)}</div>
            <div class="club-sub">${flag({ flag: f.drapeau, country_name: f.pays })} ${esc(f.pays || '')}${f.nom_officiel && f.nom_officiel !== f.nom ? ` · ${esc(f.nom_officiel)}` : ''}</div>
          </div>
        </div>`;
    }

    function switchClubView(view, slide) {
      currentClubView = view;
      document.querySelectorAll('#club-tabs .subtab-btn').forEach(b => b.classList.toggle('active', b.dataset.cview === view));
      const body = document.getElementById('club-body');
      body.scrollTop = 0;
      if (!activeClub) return;
      body.innerHTML = view === 'matchs' ? clubMatchsHtml(activeClub) : view === 'stats' ? clubStatsHtml(activeClub)
        : view === 'effectif' ? clubEffectifHtml(activeClub) : view === 'histoire' ? '<div class="empty-state">Chargement de l\'historique…</div>' : clubApercuHtml(activeClub);
      slideIn(body, slide);
      if (view === 'histoire') renderHistoire(activeClub);
    }
    attachTabSwipe({   // fiche de club : Aperçu / Matchs / Stats / Effectif / Histoire
      zone: () => document.getElementById('club-body'),
      stop: () => document.getElementById('club-sheet'),
      tabs: () => CLUB_VIEWS, current: () => currentClubView, go: switchClubView,
    });

    // --- Aperçu
    function clubApercuHtml(f) {
      const wd = f.wikidata || {}, wp = f.wikipedia || null, st = f.stade || null;
      const sections = [];
      const rangs = (f.rang || []).map(r => {
        const fl = { UP: '▲', DOWN: '▼', STABLE: '=' }[r.tendance] || '';
        const prec = r.rang_precedent != null ? ` · avant : ${r.rang_precedent}${r.rang_precedent === 1 ? 'er' : 'e'}` : '';
        return `<div class="cl-rank"><b>${esc(r.rang)}${r.rang === 1 ? 'er' : 'e'}</b>
          ${fl ? `<span class="cl-trend-${esc(r.tendance)}" title="Évolution depuis la journée précédente">${fl}</span>` : ''}
          <span>${esc(COMP_FULL[r.comp] || r.comp)} · ${estLigue(r.comp) ? 'championnat' : 'phase de ligue'} · ${esc(r.points ?? '–')} pts · ${esc(r.joues ?? '–')} match${r.joues > 1 ? 's' : ''}${esc(prec)}</span></div>`;
      }).join('');
      if (rangs) sections.push(`<div class="cl-sec"><h4>Classement actuel ${infoBtn('<p>Classements officiels (UEFA pour les coupes, ESPN pour les championnats) à la date de la dernière mise à jour de la fiche (ils ne disent rien du classement d\'une journée passée : voir la page de la compétition).</p>', 'Source du classement')}</h4>${rangs}</div>`);
      const formeHtml = (f.saison && f.saison.forme || []).map(r => `<span class="form-dot form-${esc(r)}" title="${{ V: 'Victoire', N: 'Nul', D: 'Défaite' }[r]}">${esc(r)}</span>`).join('');
      if (formeHtml) sections.push(`<div class="cl-sec"><h4>Forme (5 derniers matchs) ${infoBtn('<p>Victoire / nul / défaite <b>calculés</b> d\'après les scores des matchs terminés (tirs au but : nul). Du plus ancien au plus récent.</p>', 'Méthode de la forme')}</h4><div class="cl-form">${formeHtml}</div></div>`);
      const prochain = (f.saison && f.saison.matchs || []).find(x => x.match_id === (f.saison || {}).prochain);
      if (prochain) {
        sections.push(`<div class="cl-sec"><h4>Prochain match</h4><div class="cl-next">
          <b>${esc(jourLong(prochain.date))}</b>${prochain.heure_utc ? ` · ${esc(heureParis(prochain.heure_utc))}` : ''}<br>
          ${prochain.domicile ? 'À domicile' : 'À l\'extérieur'} · ${clubLink(prochain.adversaire.id, esc(prochain.adversaire.nom))}<br>
          <span style="color:var(--text-muted);font-size:0.78rem">${esc(COMP_FULL[prochain.comp] || prochain.comp)} · ${esc(prochain.tour)}${prochain.journee ? ' · ' + esc(prochain.journee) : ''}${prochain.stade ? ' · ' + esc(prochain.stade) : ''}</span></div></div>`);
      }
      const faits = [];
      if (st && st.nom) faits.push(['Stade', esc(st.nom) + (st.capacite ? ` (${esc(st.capacite.toLocaleString('fr-FR'))} places)` : '')]);
      if (st && st.ville) faits.push(['Ville', esc(st.ville)]);
      if (st && st.ouverture) faits.push(['Stade ouvert en', esc(st.ouverture.slice(0, 4))]);
      if (wd.fondation_annee) faits.push(['Fondation', esc(wd.fondation_annee)]);
      if (wd.ville_siege && wd.ville_siege !== (st && st.ville)) faits.push(['Siège', esc(wd.ville_siege)]);
      if (wd.surnom) faits.push(['Surnom', esc(wd.surnom)]);
      if (lienSur(wd.site)) faits.push(['Site officiel', `<a href="${esc(lienSur(wd.site))}" target="_blank" rel="noopener noreferrer">${esc(wd.site.replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, ''))}</a>`]);
      const infoSrc = infoBtn(`<p><b>Sources.</b> Stade : ${st && st.source === 'Wikidata' ? '<b>Wikidata</b> (stade actuel du club ; aucun match à domicile collecté)' : `${st && st.source === 'ESPN' ? 'ESPN' : 'UEFA'} (stade le plus utilisé par le club à domicile cette saison${st && st.autres_stades ? ' ; autres stades : ' + esc(st.autres_stades.join(', ')) : ''})${st && st.complement ? ' ; capacité, ville et ouverture : <b>Wikidata</b> (même stade, nom ou autre nom identique)' : ''}`}. Fondation, surnom, siège, site officiel : <b>Wikidata</b>${wd.qid ? ` (<a href="https://www.wikidata.org/wiki/${esc(wd.qid)}" target="_blank" rel="noopener noreferrer">${esc(wd.qid)}</a>, rapproché par ${wd.preuve === 'alias' ? 'un rapprochement validé à la main' : wd.preuve === 'article' ? `l'article Wikipédia du club cité par la page de la saison (${esc((wd.article || {}).preuve || '')})` : 'l\'identifiant d\'équipe UEFA (P7361)'})` : ' (club non rapproché)'}, CC0. Une information absente n'est pas affichée.</p><p>Le logo est celui ${String(f.id).startsWith('espn-') ? 'd\'ESPN' : 'de l\'UEFA'} (lien direct vers son image).</p>`, 'Sources de la fiche');
      if (faits.length) sections.push(`<div class="cl-sec"><h4>Le club ${infoSrc}</h4><dl class="cl-facts">${faits.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl></div>`);
      else sections.push(`<div class="cl-sec"><h4>Le club ${infoSrc}</h4><div class="empty-state">Informations générales indisponibles.</div></div>`);
      if (wp && wp.extrait) {
        sections.push(`<div class="cl-sec"><h4>Présentation</h4><p class="cl-extract">${esc(wp.extrait)}</p>
          <div class="cl-credit">Source : ${lienSur(wp.url) ? `<a href="${esc(wp.url)}" target="_blank" rel="noopener noreferrer">Wikipédia</a>` : 'Wikipédia'} (${esc(wp.licence || 'CC BY-SA 4.0')})
          ${infoBtn(`<p>Extrait de l'article « ${esc(wp.titre || '')} » de Wikipédia en français, sous licence <a href="${esc(wp.licence_url || 'https://creativecommons.org/licenses/by-sa/4.0/deed.fr')}" target="_blank" rel="noopener noreferrer">${esc(wp.licence || 'CC BY-SA 4.0')}</a>. Auteurs : voir l'historique de l'article. Relu au plus une fois par mois.</p>`, 'Crédit Wikipédia')}</div></div>`);
      }
      return sections.join('') + (f.maj ? `<p class="momentum-note">Fiche mise à jour le ${esc(new Date(f.maj).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Europe/Paris' }))}.</p>` : '');
    }

    // --- Matchs : tous les matchs de la saison dans les compétitions UEFA, groupés par tour
    function clubMatchsHtml(f) {
      const matchs = (f.saison && f.saison.matchs) || [];
      if (!matchs.length) return `<div class="empty-state">Aucun match cette saison.</div>`;
      const groupes = [];
      matchs.forEach(x => {
        const cle = x.comp + '|' + (x.stage === 'league' ? 'league' : x.tour);
        let g = groupes.find(k => k.cle === cle);
        if (!g) { g = { cle, comp: x.comp, titre: estLigue(x.comp) ? 'Championnat' : x.stage === 'league' ? 'Phase de ligue' : (x.tour || 'Tour'), liste: [] }; groupes.push(g); }
        g.liste.push(x);
      });
      const comps = new Set(groupes.map(g => g.comp));
      const info = infoBtn('<p>Tous les matchs du club cette saison : championnat (calendrier ESPN) et compétitions UEFA (tours préliminaires compris). Le score est donné <b>du point de vue du club</b> ; D = à domicile, E = à l\'extérieur ; tab = tirs au but (le résultat V/N/D est calculé sur le score hors tirs au but).</p><p>Un score encadré ouvre la fiche du match de la soirée conservée par le dashboard.</p>', 'Aide des matchs');
      groupes.sort((a, b) => (estLigue(b.comp) ? 1 : 0) - (estLigue(a.comp) ? 1 : 0));   // championnat d'abord
      return `<div class="cl-round" style="display:flex;justify-content:space-between;align-items:center">Saison ${esc(f.saison_uefa ? (f.saison_uefa - 1) + '-' + String(f.saison_uefa).slice(2) : (f.saison_label || ''))} ${info}</div>` + groupes.map(g => `
        <div class="cl-round">${comps.size > 1 ? esc(COMP_FULL[g.comp] || g.comp) + ' · ' : ''}${esc(g.titre)}</div>
        ${g.liste.map(x => {
          const res = x.resultat ? `<span class="cl-res form-${esc(x.resultat)}">${esc(x.resultat)}</span>` : '<span></span>';
          const score = x.pour != null ? `${esc(x.pour)} - ${esc(x.contre)}${x.tab ? `<small>tab ${esc(x.tab.pour)}-${esc(x.tab.contre)}</small>` : ''}`
            : `<small style="font-size:0.74rem">${esc(heureParis(x.heure_utc) || x.statut)}</small>`;
          const cible = x.soiree && x.pour != null
            ? `<button type="button" class="cl-score" onclick="openMatchFromClub('${esc(x.match_id)}', '${esc(x.soiree)}', '${esc(x.comp)}')" aria-label="Ouvrir la fiche du match">${score}</button>`
            : `<span class="cl-score">${score}</span>`;
          return `<div class="cl-match">
            <span class="cl-date">${esc(jourCourt(x.date))}${x.journee ? '<br>' + esc(x.journee) : ''}</span>
            <span class="cl-opp"><span class="cl-loc">${x.domicile ? 'D' : 'E'}</span>${x.adversaire.logo ? `<img src="${esc(x.adversaire.logo)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : ''}<span class="nm">${clubLink(x.adversaire.id, esc(x.adversaire.nom))}</span></span>
            ${cible}${res}</div>`;
        }).join('')}`).join('');
    }


    // --- Histoire : clubs/historique/<id>.json (chargé à la demande, jamais avec la fiche). Tout y est calculé par histoire.py ;
    // la page ne fait que regrouper et afficher (aucune règle de palmarès ici).
    const histoCache = new Map();
    let histoToken = 0;
    // Club de championnat sans fiche UEFA : `histoire` = {uefa_id, ou: coupes|donnees, fichier} (encyclo_ligues.py, id UEFA lu dans Wikidata)
    const histoChemin = (f) => f.histoire && f.histoire.ou === 'donnees' ? DONNEES + f.histoire.fichier
      : 'clubs/historique/' + encodeURIComponent(f.histoire ? f.histoire.uefa_id : f.id) + '.json';
    async function loadHistoire(id, chemin) {
      if (histoCache.has(id)) return histoCache.get(id);
      const d = await fetchJson(chemin);

    // Parcours en championnat (classements finaux publiés, fiche `championnat_hist` = [[saison, rang, clubs, pts, mention?]]) :

    async function renderHistoire(f) {

    }
    const hiDate = (iso) => iso ? new Date(iso + 'T12:00:00Z').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }) : '';
    const hiPlur = (n, s, p) => `${n} ${n > 1 ? (p || s + 's') : s}`;
    function hiAdv(h, id) {
      const a = h.adv[id] || ['Adversaire inconnu', '', ''];

    // Score d'un match du point de vue du club : « 3-1 », a.p. = après prolongation, tab = tirs au but ; annulé / arrêté / forfait = jamais comptés
    function hiScore(m) {
      const x = m[6] || {};
      if (x.st === 'annule') return '<span class="hi-st">Annulé</span>';
      if (x.st === 'arrete') return '<span class="hi-st">Arrêté</span>';
      if (m[4] == null) return '<span class="hi-st">Sans score</span>';
      const note = [x.ap ? 'a.p.' : '', x.tab ? `tab ${x.tab[0]}-${x.tab[1]}` : '', x.st === 'forfait' ? 'forfait' : ''].filter(Boolean).join(' · ');
      return `${esc(m[4])}-${esc(m[5])}${note ? `<small>${esc(note)}</small>` : ''}`;
    }
    const hiRes = (m) => (m[4] == null || (m[6] && m[6].st)) ? '' : m[4] > m[5] ? 'V' : m[4] < m[5] ? 'D' : 'N';
    function hiMatchRow(h, m) {
      const r = hiRes(m), lieu = m[3] === 1 ? 'D' : m[3] === 0 ? 'E' : '';

    }
    // « 3-0 puis 0-2 » ; finale à match unique : « 1-1 a.p. (tab 5-4) »
    const hiManche = (m) => `${m[2]}-${m[3]}${m[6] ? ' a.p.' : ''}${m[4] != null && m[5] != null ? ` (tab ${m[4]}-${m[5]})` : ''}`;
    function hiFinaleHtml(h, e) {
      const f = e.f, res = f.r === 'V' ? 'V' : f.r === 'D' ? 'D' : 'q';
      const verbe = { V: 'Titre', D: 'Finale perdue', '?': 'Issue non déterminée' }[f.r];
      let score;
      if (f.m.length === 1) score = hiManche(f.m[0]);
      else if (f.rejoue) score = f.m.map((m, i) => hiManche(m) + (i === f.m.length - 1 ? ' (match rejoué)' : '')).join(', puis ');

    // Issue d'une édition : Vainqueur / Finaliste / tour atteint ; « En cours » pour la saison courante
    function hiIssue(h, e) {
      const ec = e.ec ? 'À ce jour · ' : '';     // saison courante : tour atteint jusqu'ici (le club peut déjà être éliminé)
      if (e.i === 'V') return ['Vainqueur', 'win'];
      if (e.i === 'D') return ['Finaliste', 'fin'];

        <p><b>Calcul</b> d'après les scores UEFA, jamais inventé : finale à match unique = score (prolongation comprise) puis tirs au but ; finale en <b>deux manches</b> (Coupe UEFA jusqu'en 1997, Supercoupe, villes de foires…) = <b>cumul</b> des deux scores ; en cas d'égalité, tirs au but de la 2e manche, sinon le vainqueur que l'UEFA indique (buts à l'extérieur, tirage au sort…), sinon « issue non déterminée ». Finale rejouée : le match rejoué décide.</p>`, 'Méthode du palmarès');
      const officielles = comps.filter(c => h.comp[c].titre), autres = comps.filter(c => !h.comp[c].titre);
      const palOff = officielles.map(ligne).join(''), palAut = autres.map(ligne).join('');
      const toutes = h.ed.filter(e => e.f);
      sec.push(`<div class="cl-sec"><h4>Palmarès européen ${infoPal}</h4>${palOff || '<div class="empty-state">Aucune finale européenne jouée.</div>'}

        ${toutes.length ? `<details class="hi-fins"><summary>Toutes les finales (${toutes.length})</summary>${toutes.slice().reverse().map(e => hiFinaleHtml(h, e)).join('')}</details>` : ''}</div>`);
      // --- Bilan par compétition + meilleur parcours
      const infoBilan = infoBtn(`<p>Matchs <b>terminés</b>, score après prolongation ; une victoire aux tirs au but compte pour un nul (comme partout dans le dashboard). Les matchs annulés, arrêtés ou perdus / gagnés par forfait ne sont pas comptés. <b>Meilleur parcours</b> : tour le plus avancé atteint ; l'ordre des tours numérotés d'autrefois par rapport aux phases de groupes est indicatif.</p>`, 'Méthode du bilan');
      const cartes = comps.map(c => {
        const b = h.bilan[c] || {}, m = (h.meilleurs || {})[c];
        const best = m ? `Meilleur parcours : <b>${esc(m.lib)}</b> (${esc(m.s.length > 4 ? m.s.slice(0, 4).join(', ') + '…' : m.s.join(', '))})` : '';
        return `<div class="hi-comp"><div class="h"><span>${esc(h.comp[c].nom)}</span><small>${esc(hiPlur(b.ed || 0, 'édition'))}</small></div>

      const infoSaisons = infoBtn(`<p><b>Source</b> : UEFA (match.uefa.com), tous les matchs du club depuis ${esc(h.depuis ? h.depuis.slice(0, 4) : 'l\'origine')}. La <b>saison européenne</b> court du 20 juin au 19 juin ; la Coupe Intertoto, jouée de juin à août, prend l'année du match. Nom de la compétition : celui de l'époque. Score du point de vue du club (D = à domicile, E = à l'extérieur, a.p. = après prolongation, tab = tirs au but) ; aucun D / E pour les finales à match unique (lieu non précisé par l'UEFA).</p>`, 'Source et méthode des saisons');

    // Ouverture d'une édition : ses matchs sont rendus une seule fois, groupés par tour
