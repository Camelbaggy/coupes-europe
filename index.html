      else if (e.key === 'Tab') {
        const f = [...document.querySelectorAll('#tour-sheet button')].filter(x => x.tabIndex >= 0), a = document.activeElement;
        if (e.shiftKey && a === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && a === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      }
    });

    // URL partageable : ?c=ucl&tour=j5 ; ?soiree=AAAA-MM-JJ (ancien format, aussi #soiree= ou #AAAA-MM-JJ) reste compris en lecture
    function urlParams() {
      const p = new URLSearchParams(location.search), h = location.hash.replace(/^#(soiree=)?/, '');
      return { c: p.get('c'), tour: p.get('tour'), vue: p.get('vue'), saison: p.get('saison'),
        soiree: [p.get('soiree'), h].find(v => v && /^\d{4}-\d{2}-\d{2}$/.test(v)) || null };
    }
    function syncUrl() {
      const u = new URL(location.href), id = tourChoice[currentComp];
      if (vue === 'accueil') {
        ['c', 'tour', 'soiree', 'vue', 'saison'].forEach(x => u.searchParams.delete(x)); u.hash = '';
        try { history.replaceState(history.state, '', u); } catch (e) { /* aperçu hors page */ }
        return;
      }
      u.searchParams.delete('soiree'); u.searchParams.set('c', currentComp);
      if (id) u.searchParams.set('tour', id); else u.searchParams.delete('tour');
      const histo = estLigue(currentComp) && vueLigue === 'histo';
      if (histo) { u.searchParams.set('vue', 'histo'); if (histChoix[currentComp]) u.searchParams.set('saison', histChoix[currentComp]); else u.searchParams.delete('saison'); }
      else { u.searchParams.delete('vue'); u.searchParams.delete('saison'); }
      u.hash = '';
      try { history.replaceState(history.state, '', u); } catch (e) { /* aperçu hors page : sans effet */ }
    }

    // Affiche la coupe `compKey` pour le tour `id` (défaut : le plus récent joué) ; `slide` = animation du glissement entre coupes
    async function showTour(compKey, id, slide) {
      const token = ++tourToken;
      const main = document.getElementById('main-zone');
      currentComp = compKey;
      afficherVue('comp');
      if (estLigue(compKey) && !ligueIndex[compKey]) {
        main.classList.add('loading');
        await loadLigueIndex(compKey);
        if (token !== tourToken) return;
        main.classList.remove('loading');
      }
      if (estIntl(compKey) && !intlComplet[compKey]) {   // compétition internationale : index de toutes ses éditions (menu des tours)
        main.classList.add('loading');
        await chargerIntl(compKey, true);
        if (token !== tourToken) return;
        main.classList.remove('loading');
      }
      const t = (toursByComp[compKey] || []).find(x => x.id === id) || defaultTour(compKey);
      const err = document.getElementById('soiree-err'); if (err) err.remove();
      if (!t) {   // coupe sans aucune soirée conservée
        tourChoice[compKey] = null; renderTourBar(null); syncUrl();
        main.classList.remove('loading');
        appData.competitions[compKey] = { name: COMP_FULL[compKey], type: estLigue(compKey) ? 'championnat' : undefined, french_clubs_focus: [], matches: [], standings: [], standings_source: 'absent', _intl: estIntl(compKey) ? {} : undefined };
        renderCompetition(compKey);
        return;
      }
      tourChoice[compKey] = t.id;
      renderTourBar(t); syncUrl();
      let hit = tourCache.get(compKey + '|' + t.id);
      if (!hit) {
        main.classList.add('loading');
        hit = await loadTour(t);
        if (token !== tourToken) return;   // un autre tour / une autre coupe a été demandé entre-temps
      }
      main.classList.remove('loading');
      if (!hit) {
        main.insertAdjacentHTML('afterbegin', `<div class="empty-state" id="soiree-err">Impossible de charger ${esc(t.titre)}.</div>`);
        return;
      }
      appData.competitions[compKey] = Object.assign(hit.comp, { _futur: !!t.futur, _avenir: t.avenir || [] });
      updateBadge(hit.meta);
      renderCompetition(compKey);
      if (slide) slideIn(main, slide);
    }

    async function initDashboard() {
      const [idx, prog] = await Promise.all([fetchJson('soirees/index.json'), fetchJson('clubs/programme.json'), loadClubIndex()]);
      programmeCoupes = prog && prog.competitions ? prog : null;
      const lignes = Array.isArray(idx) ? idx.filter(l => l && /^\d{4}-\d{2}-\d{2}$/.test(l.date)).sort((a, b) => b.date.localeCompare(a.date)) : [];
      soireeIndex = lignes.length ? lignes : null;
      appData = { competitions: {} };
      if (soireeIndex) buildTours();
      await route();
    }

    // Aiguillage : sans paramètre = accueil ; ?c=<coupe|championnat>[&tour=] ; ?soiree= (ancien lien) = la coupe de cette soirée
    async function route() {
      const u = urlParams();
      if (estLigue(u.c)) {
        vueLigue = u.vue === 'histo' ? 'histo' : 'saison';
        if (u.saison) histChoix[u.c] = u.saison;
        await showTour(u.c, u.tour); return;
      }
      if (estIntl(u.c)) { vueLigue = 'saison'; await showTour(u.c, u.tour); return; }
      if (!u.c && !u.soiree) { await afficherAccueil(); return; }
      await ouvrirCoupes(u);
    }
    window.addEventListener('popstate', () => { closeInfo(); route(); });

    async function ouvrirCoupes(u) {
      if (soireeIndex) {
        let comp = 'ucl', id = null;
        const row = u.soiree && soireeIndex.find(l => l.date === u.soiree);
        if (row) {   // ancien lien ?soiree= : ouvre la coupe et le tour de cette soirée
          const ks = COMP_KEYS.filter(k => row.competitions && row.competitions[k]);
          if (ks.length) {
            comp = ks.includes(u.c) ? u.c : ks[0];
            const c = row.competitions[comp];
            const t = toursByComp[comp].find(x => x.stage === (c.stage || '') && x.tour === (c.tour || ''));
            id = t && t.id;
          }
        } else {
          if (COMP_KEYS.includes(u.c)) comp = u.c;
          id = u.tour;
        }
        if (!(toursByComp[comp] || []).length) comp = COMP_KEYS.find(k => toursByComp[k].length) || 'ucl';
        await showTour(comp, id);
        return;
      }
      afficherVue('comp');
      // Pas d'index (hébergement ancien, première publication) : data.json seul, sans menu
      const latest = await fetchJson('data.json');
      if (!latest) {
        document.getElementById('comp-view').innerHTML =
          `<div class="empty-state">Impossible de charger data.json.<br>Ouvre la page via GitHub Pages ou un serveur local (python -m http.server).</div>`;
        return;
      }
      appData = latest;
      updateBadge({ last_updated: latest.last_updated, reconstituee: latest.reconstituee });
      const has = (k) => ((latest.competitions || {})[k] || {}).matches && latest.competitions[k].matches.length > 0;
      if (!has(currentComp)) { const k = COMP_KEYS.find(has); if (k) currentComp = k; }
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.comp === currentComp));
      renderCompetition(currentComp);
    }


    // ---------- Vues : accueil / compétition (une seule application ; les liens ?c=… et ?soiree= restent valables) ----------
    let vue = 'comp';
    function renderTabs(espace) {
      const bar = document.getElementById('tabs-bar'), keys = ESPACES[espace].keys;
      bar.classList.toggle('n5', keys.length === 5 || keys.length === 4);
      bar.classList.toggle('n6', keys.length === 6);
      bar.classList.toggle('n7', keys.length >= 7);
      bar.innerHTML = keys.map(k => `<button class="tab-btn ${k === currentComp ? 'active' : ''}" data-comp="${k}" style="--tab-accent: var(--accent-${k})" onclick="switchCompetition('${k}')" aria-label="${esc(estLigue(k) ? nomLigue(k) + ' (' + DRAPEAU_LIGUE[k][1] + ')' : COMP_FULL[k])}">${estLigue(k) ? `<span class="tab-ligue">${drapeauLigue(k)}<span>${esc(LIGUE_COURT[k])}</span></span>` : esc(tabTexte(k))}</button>`).join('');
      marquerDirect();
    }
    function afficherVue(v) {
      vue = v;
      const acc = v === 'accueil';
      document.getElementById('accueil').hidden = !acc;
      document.getElementById('comp-view').hidden = acc;
      document.getElementById('tabs-bar').hidden = acc;
      document.getElementById('app-header').classList.toggle('accueil', acc);
      document.getElementById('home-btn').setAttribute('aria-label', acc ? 'Accueil' : 'Retour à l\'accueil');
      document.getElementById('espace-titre').textContent = acc ? '' : '· ' + ({ coupes: 'Coupes de clubs', selections: 'Sélections' }[espaceDe(currentComp)] || 'Championnats');
      if (!acc) renderTabs(espaceDe(currentComp));
      document.title = acc ? 'Football · Coupes d\'Europe et championnats' : COMP_FULL[currentComp] + ' · Football';
    }
    // Entrer dans une compétition depuis l'accueil : nouvelle entrée d'historique (le retour du téléphone revient à l'accueil)
    function entrer(k, tourId) {
      closeInfo();
      const u = new URL(location.href);
      ['soiree', 'tour', 'vue', 'saison'].forEach(x => u.searchParams.delete(x));
      u.searchParams.set('c', k); u.hash = '';
      vueLigue = 'saison';
      if (tourId) u.searchParams.set('tour', tourId);
      try { history.pushState({ depuisAccueil: 1 }, '', u); } catch (e) { /* aperçu hors page */ }
      showTour(k, tourId);
    }
    function goAccueil() {
      closeInfo();
      if (vue === 'accueil') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      if (history.state && history.state.depuisAccueil) { history.back(); return; }
      afficherAccueil();
    }

    // Dernière date jouée (au moins un match terminé) d'une compétition, et le tour qui la contient
    function derniereDate(k) {
      if (estIntl(k)) {   // édition la plus récente qui a des matchs terminés (parmi les éditions lues)
        for (const e of intlEditions(k)) { const E = intlEd(k, e.edition), l = E && E.lignes.find(x => (x.termines || 0) > 0); if (l) return l.date; }
        return null;
      }
      if (estLigue(k)) { const l = (ligueIndex[k] || []).find(x => (x.termines || 0) > 0); return l ? l.date : null; }
      const l = (soireeIndex || []).find(x => x.competitions && x.competitions[k] && (x.termines || 0) > 0);
      return l ? l.date : null;
    }
    function tourDeDate(k, date) {
      const ts = (toursByComp[k] || []).filter(t => t.dates.includes(date));
      return ts.sort((a, b) => b.matchs - a.matchs)[0] || null;
    }
    const accLigneMatch = (m, k, date) => {
      const fini = m.status !== 'À venir' && m.status !== 'Reporté' && m.status !== 'Annulé';
      const sc = fini ? `<span class="sc">${m.home_team.score} - ${m.away_team.score}</span>` : `<span class="sc av">${esc((m.kickoff || '').slice(-5) || m.status)}</span>`;
      return `<button type="button" class="acc-m" onclick="ouvrirMatchAccueil('${esc(k)}', '${esc(date)}', '${esc(m.match_id)}')">
        <span class="eq d ${m.home_team.is_french && !estLigue(k) ? 'is-fr' : ''}">${esc(m.home_team.name)} ${flag(m.home_team)}</span>${sc}
        <span class="eq ${m.away_team.is_french && !estLigue(k) ? 'is-fr' : ''}">${flag(m.away_team)} ${esc(m.away_team.name)}</span></button>`;
    };
    async function donneesDuJour(k, date) {
      if (estIntl(k)) { const e = intlEditions(k).find(x => { const E = intlEd(k, x.edition); return E && E.lignes.some(l => l.date === date); }); return e ? loadJourIntl(k, e.edition, date) : null; }
      return estLigue(k) ? loadJourLigue(k, date) : loadSoiree(date);
    }
    async function ouvrirMatchAccueil(k, date, matchId) {
      const d = await donneesDuJour(k, date);
      if (d) openMatchModal(matchId, d, k);
    }

    async function afficherAccueil() {
      ++tourToken;
      afficherVue('accueil');
      syncUrl();
      const box = document.getElementById('accueil');
      box.innerHTML = '<div class="acc-note">Chargement…</div>';
      await Promise.all([...LIGUE_KEYS.map(loadLigueIndex), ...INTL_KEYS.map(k => chargerIntl(k, false))]);
      if (vue !== 'accueil') return;
      const toutes = [...COMP_KEYS, ...LIGUE_MAJEURS, ...INTL_KEYS];   // derniers résultats : coupes, championnats majeurs et compétitions internationales
      const dates = Object.fromEntries(toutes.map(k => [k, derniereDate(k)]));
      const jour = Object.values(dates).filter(Boolean).sort().pop() || null;
      let html = '<div id="direct-accueil"></div>';
      if (jour) {
        const ks = toutes.filter(k => dates[k] === jour);
        const datas = await Promise.all(ks.map(k => donneesDuJour(k, jour)));
        if (vue !== 'accueil') return;
        html += `<h2 class="acc-h">Derniers résultats</h2><div class="acc-jour">${esc(jourLong(jour).replace(/^./, c => c.toUpperCase()))}</div>`;
        ks.forEach((k, i) => {
          const c = ((datas[i] || {}).competitions || {})[k];
          if (!c) return;
          const t = tourDeDate(k, jour);
          const ms = (c.matches || []).slice().sort((a, b) => minutesKickoff(a) - minutesKickoff(b));
          html += `<div class="acc-bloc" style="--c-accent: var(--accent-${k})">
            <button type="button" class="acc-bloc-h" onclick="entrer('${k}', ${t ? `'${esc(t.id)}'` : 'null'})">
              <span><b>${estLigue(k) ? drapeauLigue(k) + ' ' : ''}${esc(estLigue(k) ? nomLigue(k) : COMP_FULL[k])}</b><small>${esc(t ? t.titre : '')}${t ? ' · ' : ''}${ms.length} match${ms.length > 1 ? 's' : ''}</small></span>
              <span class="go">Voir tout ›</span></button>
            ${ms.map(m => accLigneMatch(m, k, jour)).join('')}</div>`;
        });
      } else {
        html += '<div class="acc-note">Aucun résultat disponible pour le moment.</div>';
      }
      const tuile = (k) => {
        const t = defaultTour(k);
        const desc = t ? `<span class="tt">${esc(t.titre)}</span><span>${esc(tourSousTitre(t))}</span>`
          : `<span>${estLigue(k) || estIntl(k) ? 'Données bientôt disponibles' : 'Aucune soirée conservée'}</span>`;
        return `<button type="button" class="acc-tuile" data-k="${k}" style="--c-accent: var(--accent-${k})" onclick="entrer('${k}', ${t ? `'${esc(t.id)}'` : 'null'})"><b>${estLigue(k) ? drapeauLigue(k) + ' ' : ''}${esc(estLigue(k) ? nomLigue(k) : COMP_FULL[k])}</b>${desc}</button>`;
      };
      html += `<h2 class="acc-h">Coupes de clubs</h2><div class="acc-grille">${COUPES_KEYS.map(tuile).join('')}</div>`;
      html += `<h2 class="acc-h">Sélections nationales</h2><div class="acc-grille">${SEL_KEYS.map(tuile).join('')}</div>`;
      html += `<h2 class="acc-h">Championnats majeurs</h2><div class="acc-grille">${LIGUE_MAJEURS.map(tuile).join('')}</div>`;
      html += `<h2 class="acc-h">Autres championnats</h2><div class="acc-grille">${LIGUE_AUTRES.map(tuile).join('')}</div>`;
      box.innerHTML = html;
      const maj = [soireeIndex && soireeIndex[0] && soireeIndex[0].maj, ...LIGUE_MAJEURS.map(k => (ligueIndex[k][0] || {}).maj)].filter(Boolean).sort().pop();
      if (maj) updateBadge({ last_updated: maj });
      directDemarrer();
    }

    function switchCompetition(compKey, slide) {
      closeInfo();
      if (!soireeIndex && !estLigue(compKey) && !estIntl(compKey)) {   // sans index : data.json seul
        currentComp = compKey;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.comp === compKey));
        renderCompetition(compKey);
        if (slide) slideIn(document.getElementById('main-zone'), slide);
        return;
      }
      showTour(compKey, tourChoice[compKey], slide);   // chaque coupe garde son tour choisi
    }

    function getZoneLabel(zone, rank) {
      if (!rank) return 'Classement n.d.';
      const r = rank === 1 ? '1er' : `${rank}e`;
      if (!zone) return r;   // classement recalculé d'une soirée passée : pas de zone (n'a de sens qu'à la dernière journée)
      if (zone === 'top8') return `${r} • Top 8 (8es)`;
      if (zone === 'playoff') return `${r} • Barrages`;
      return `${r} • Zone élim.`;
    }

    // Programme du tour : matchs à venir groupés par jour (heure de Paris), stade ; aucun score ni lien de fiche (rien n'est joué)
    function renderProgramme(k, comp) {
      const sec = document.getElementById('prog-section'), ms = progVisibles(comp._avenir);
      sec.hidden = !ms.length;
      if (!ms.length) { document.getElementById('prog-container').innerHTML = ''; return; }
      const ligue = estLigue(k), intl = estIntl(k), maintenant = Date.now();
      document.getElementById('prog-title').textContent = comp._futur ? 'Programme' : intl ? 'À venir dans ce tour' : 'À venir dans cette journée';
      document.getElementById('prog-sub').innerHTML = infoBtn(`<p>${intl ? 'Calendrier ' + esc((comp._intl || {}).progSource || 'officiel') : ligue ? 'Calendrier ESPN' : 'Calendrier officiel de l\'UEFA'}, relevé régulièrement : dates et heures (heure de Paris) peuvent encore changer.</p>${intl ? '<p>Une équipe encore inconnue est notée « À déterminer » avec le code donné par la source (ex. W4) ; elle apparaît quand le tour précédent est joué.</p>' : ligue ? (JOURNEES_DEDUITES.has(k) ? '<p>Le numéro de journée est déduit du calendrier : chaque club joue une fois par journée, la journée d\'un match est celle dont il partage la date avec tous les autres matchs de ses deux clubs (contrôlé : 0 erreur sur 850 matchs joués des championnats où Wikipédia donne les journées ; un match reporté peut rester sans journée ou, rarement, être mal placé tant qu\'il n\'est pas joué). Sans journée déduite : rangé par semaine.</p>' : '<p>Le numéro de journée vient de Wikipédia ; un match sans journée connue est rangé par semaine.</p>') : '<p>Les affiches des phases à élimination directe n\'apparaissent qu\'après le tirage.</p>'}`, 'Source du programme');
      const nomEq = (t) => t.a_determiner ? `<i>${esc(t.name || 'À déterminer')}</i>` : clubLink(t.id, esc(t.name));
      const estFr = (t) => !ligue && t.is_french;
      let dernier = null;
      document.getElementById('prog-container').innerHTML = [...ms].sort((a, b) => (a.debut || '').localeCompare(b.debut || '')).map(x => {
        const jour = x.date || (x.debut || '').slice(0, 10);
        const sep = jour !== dernier ? `<div class="date-sep">${esc(jourLong(jour))}</div>` : '';
        dernier = jour;
        const parti = x.debut && new Date(x.debut).getTime() <= maintenant && x.statut !== 'Reporté';
        const statut = parti ? 'Commencé' : x.statut === 'À venir' ? '' : x.statut;
        const lieu = [x.stade, x.ville].filter(Boolean).join(', ');
        return sep + `
          <div class="match-tile prog">
            <div class="tile-teams">
              <div class="tile-team-row"><span class="tile-team-name ${estFr(x.home_team) ? 'is-fr' : ''}">${flag(x.home_team)} ${nomEq(x.home_team)}</span></div>
              <div class="tile-team-row"><span class="tile-team-name ${estFr(x.away_team) ? 'is-fr' : ''}">${flag(x.away_team)} ${nomEq(x.away_team)}</span></div>
              ${lieu ? `<div class="prog-stade" title="${esc(lieu)}">🏟 ${esc(lieu)}</div>` : ''}
            </div>
            <div class="tile-meta">
              <div class="prog-h">${x.debut && x.statut !== 'Reporté' ? esc(heureParis(x.debut)) : '—'}</div>
              ${statut ? `<div class="prog-st ${parti || x.statut === 'Reporté' ? 'alerte' : ''}">${esc(statut)}</div>` : ''}
            </div>
          </div>`;
      }).join('');
    }

    // ---------- Compétitions internationales : tableaux de groupe et tableau final (rendu) ----------
    const ZONES_INTL = { qualifie: ['Qualifié', 'var(--zone-top8)'], meilleur_troisieme: ['Meilleur troisième (qualifié)', 'var(--zone-playoff)'], elimine: ['Éliminé', 'var(--zone-elim)'] };
    const zoneIntl = (r) => r.zone || (r.qualifie ? 'qualifie' : '');
    // Groupes concernés par le tour affiché : phase de groupes -> groupes de la phase `groupes` ; éliminatoires -> groupes `qualification` ;
    // on ne garde que les groupes dont un match figure dans le tour (ou son programme), sinon tous ceux de la phase. Phase finale : groupes de la phase `groupes`.
    function groupesIntl(comp) {
      const I = comp._intl || {};
      if (!I.classements || !Array.isArray(I.classements.groupes)) return [];
      let gs = I.classements.groupes.filter(g => g.phase === (I.phase === 'qualification' ? 'qualification' : 'groupes'));
      if (I.phase !== 'finale') {
        const noms = new Set([...(comp.matches || []), ...(comp._avenir || [])].map(m => m.groupe).filter(Boolean).map(slug));
        const r = gs.filter(g => noms.has(slug(g.nom)));
        if (r.length) gs = r;
      }
      return gs;
    }
    function groupeIntlHtml(g, ouvert) {
      const fr = (g.lignes || []).some(r => r.is_french);
      const lignes = (g.lignes || []).map(r => {
        const z = zoneIntl(r);
        return `<tr class="${z ? 'zone-' + esc(z) : ''} ${r.is_french ? 'is-fr-row' : ''}">
          <td class="rank-cell">${esc(r.rank)}</td>
          <td class="col-team">${flag(r)} ${esc(r.team)}${r.is_french ? '<span class="fr-badge-inline">FRA</span>' : ''}</td>
          <td>${esc(r.played)}</td><td>${esc(r.gd)}</td><td style="font-weight:800">${esc(r.points)}</td></tr>`;
      }).join('');
      return `<details class="grp"${ouvert ? ' open' : ''}><summary>${esc(g.nom)}${fr ? '<span class="grp-fr">FRA</span>' : ''}<small>${(g.lignes || []).length} équipes</small></summary>
        <table class="standings-table grp-table"><thead><tr><th>#</th><th class="col-team">Équipe</th><th>MJ</th><th>Diff</th><th>Pts</th></tr></thead><tbody>${lignes}</tbody></table></details>`;
    }
    function renderGroupesIntl(compKey, comp) {
      const sec = document.getElementById('standings-section'), cont = document.getElementById('standings-container'), titre = document.getElementById('standings-title');
      document.getElementById('standings-legend').hidden = true;
      const gs = groupesIntl(comp), I = comp._intl || {}, cl = I.classements || {};
      sec.hidden = !gs.length;
      if (!gs.length) { cont.innerHTML = ''; return; }
      const zones = [...new Set(gs.flatMap(g => (g.lignes || []).map(zoneIntl)).filter(Boolean))];
      const maj = cl.maj ? new Date(cl.maj).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', timeZone: 'Europe/Paris' }) : '';

    // Vainqueur d'un match terminé : score, puis tirs au but ; null si nul sans départage ou pas fini
    function gagnantIntl(m) {

    // Tableau final : une colonne par tour de la phase finale (matchs joués + matchs à venir du programme), défilement horizontal dans ce seul bloc

    // ===================== EN DIRECT (ESPN, interrogé par le navigateur) =====================
    // L'API d'ESPN accepte les appels d'une autre page (en-tête CORS « * », vérifié le 26/11/2026). Pendant les matchs, la page interroge
    // elle-même les tableaux du jour (toutes les 60 s s'il y a un match en cours ou imminent, sinon toutes les 5 min, page visible
    // seulement) et la fiche ouverte (30 s). Données PROVISOIRES, marquées comme telles : la collecte habituelle (UEFA pour les coupes,
    // ESPN complet pour les championnats) les remplace après le match. En direct : score, minute, buts, cartons, remplacements, compos,
    // stats d'équipe ; ni note ni résumé ni momentum (calculés après le match). Rien n'est enregistré.
    // site.web.api.espn.com (et non site.api.espn.com : ce dernier répond « Access Denied » à certains navigateurs, constaté le 26/11/2026)
    const ESPN_WEB = 'https://site.web.api.espn.com/apis/site/v2/sports/soccer';
    const SLUG_ESPN = { ucl: 'uefa.champions', uel: 'uefa.europa', uecl: 'uefa.europa.conf', fl1: 'fra.1', fl2: 'fra.2', pl: 'eng.1', liga: 'esp.1',
      sa: 'ita.1', bl: 'ger.1', por: 'por.1', ned: 'ned.1', bel: 'bel.1', tur: 'tur.1', aut: 'aut.1', gre: 'gre.1', nor: 'nor.1',
      cdm: 'fifa.world', euro: 'uefa.euro', ldn: 'uefa.nations', cdmc: 'fifa.cwc', ci: 'fifa.intercontinental_cup' };
    const DIRECT_APRES_FIN_MIN = 165;   // un match terminé reste dans le bloc jusqu'à 165 min après son coup d'envoi
    const directEtat = { live: {}, minuterie: null, jeton: 0, fiche: null, ficheMinuterie: null };
    const jourParisCompact = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/Paris' }).replace(/-/g, '');
    const espnEquipe = (c, k) => {
      const t = (c && c.team) || {};
      const e = { id: 'espn-' + t.id, espn_id: String(t.id || ''), name: String(t.shortDisplayName || t.displayName || t.name || '').trim(),
        short: t.abbreviation || '', logo: t.logo || ((t.logos || [])[0] || {}).href || '', score: Number(c && c.score) || 0 };
      return estIntl(k) ? paysDirect(e, t, k) : e;
    };
    // Compétition internationale, bloc « En direct » : drapeaux partout (décision du 26/11/2026), mais ESPN ne donne pas le pays d'un club.
    // Pays lu (1) dans la fiche du club (index des fiches : identifiant ESPN des clubs des championnats suivis), sinon (2) dans les équipes
    // FIFA déjà chargées de l'édition (programme, jours) : sélection = même code, club = un mot distinctif commun, UN SEUL candidat.
    // Sans correspondance sûre : aucune image (jamais de logo, jamais de pays deviné).
    const MOTS_VIDES_CLUB = new Set(['club', 'football', 'futbol', 'sport', 'sports', 'sporting', 'united', 'city', 'real', 'athletic', 'atletico',
      'deportivo', 'saint', 'san', 'santa', 'union', 'racing', 'olympique', 'association']);
    function equipesIntlConnues(k) {
      const out = new Map();
      Object.keys(intlEds).filter(c => c.startsWith(k + '|')).forEach(c => {
        (intlEds[c].programme || []).forEach(m => [m.home_team, m.away_team].forEach(x => { if (x && x.flag && !x.a_determiner) out.set(x.fifa_id || x.name, x); }));
      });
      soireeCache.forEach((d, cle) => {
        if (!String(cle).startsWith(k + '@')) return;
        (((d.competitions || {})[k] || {}).matches || []).forEach(m => [m.home_team, m.away_team].forEach(x => { if (x && x.flag) out.set(x.fifa_id || x.name, x); }));
      });
      return [...out.values()];
    }
    function paysDirect(e, t, k) {
      e.intl = true;
      const f = clubIndex && clubIndex.get(e.id);
      if (f && f.drapeau) return Object.assign(e, { flag: f.drapeau, country: f.code_pays || '', country_name: f.pays || '', is_french: !!f.francais });
      const ab = String(t.abbreviation || '').toUpperCase();
      const mots = (n) => [...motsNom(n)].filter(x => !MOTS_VIDES_CLUB.has(x));
      const noms = [t.displayName, t.shortDisplayName, t.name, t.location].filter(Boolean);
      const cand = equipesIntlConnues(k).filter(x => estSelection(k)
        ? ab && String(x.short || x.country || '').toUpperCase() === ab
        : noms.some(n => mots(n).some(w => mots(x.name).includes(w) || mots(x.official_name).includes(w))));
      const pays = new Set(cand.map(x => x.flag));
      if (cand.length && new Set(cand.map(x => x.fifa_id || x.name)).size === 1 && pays.size === 1) {
        const x = cand[0];
        Object.assign(e, { flag: x.flag, country: x.country || '', country_name: x.country_name || '', is_french: !!x.is_french });
      } else if (estSelection(k) && /\/teamlogos\/countries\//.test(e.logo)) {
        e.intl = false;   // sélection non retrouvée : l'image ESPN d'une sélection EST son drapeau, on la garde
      }
      return e;
    }
    function directResume(k, ev) {
      const comp = (ev.competitions || [{}])[0], cs = comp.competitors || [];
      const st = ev.status || {}, ty = st.type || {};
      return { k, id: String(ev.id), date: ev.date, state: ty.state, mitemps: ty.name === 'STATUS_HALFTIME', minute: st.displayClock || '',
        home: espnEquipe(cs.find(c => c.homeAway === 'home'), k), away: espnEquipe(cs.find(c => c.homeAway === 'away'), k) };
    }
    async function directTableau(k) {
      try {
        const r = await fetch(`${ESPN_WEB}/${SLUG_ESPN[k]}/scoreboard?dates=${jourParisCompact()}`, { cache: 'no-store' });
        if (!r.ok) return null;
        return ((await r.json()).events || []).map(ev => directResume(k, ev));
      } catch (e) { return null; }
    }
    const directVisible = (x, maintenant) => x.state === 'in' ||
      (x.state === 'post' && maintenant - new Date(x.date).getTime() < DIRECT_APRES_FIN_MIN * 60000);
    function directLigne(x) {
      const etat = x.state === 'in' ? (x.mitemps ? 'Mi-temps' : x.minute) : 'Terminé · provisoire';
      return `<button type="button" class="acc-m" onclick="ouvrirDirect('${esc(x.k)}', '${esc(x.id)}')">
        <span class="eq d">${esc(x.home.name)} ${flag(x.home)}</span><span class="sc ${x.state === 'in' ? 'live' : ''}">${x.home.score} - ${x.away.score}</span>
        <span class="eq">${flag(x.away)} ${esc(x.away.name)}</span><span class="min ${x.state === 'in' ? '' : 'fin'}">${esc(etat)}</span></button>`;
    }
    function directHtml(listes, avecComp) {
      const maintenant = Date.now();
      const blocs = Object.entries(listes).map(([k, l]) => [k, (l || []).filter(x => directVisible(x, maintenant))]).filter(([, l]) => l.length);
      if (!blocs.length) return '';
      const enCours = blocs.reduce((t, [, l]) => t + l.filter(x => x.state === 'in').length, 0);
      const info = infoBtn('<p>Scores, minute et fiches de match <b>en direct</b>, lus sur ESPN toutes les minutes pendant les matchs (fiche ouverte : toutes les 30 secondes). Données <b>provisoires</b> : la collecte habituelle les remplace après le match (UEFA pour les coupes). En direct : buts, cartons, remplacements, compositions et statistiques d\'équipe ; les notes, le momentum et les résumés sont calculés après le match.</p>', 'Le direct');
      return `<div class="direct-bloc"><div class="direct-h"><span class="pt"></span>En direct${enCours ? ` · ${enCours} match${enCours > 1 ? 's' : ''}` : ''}<small>ESPN · provisoire</small>${info}</div>
        ${blocs.map(([k, l]) => `${avecComp ? `<div class="direct-comp">${estLigue(k) ? drapeauLigue(k) + ' ' + esc(nomLigue(k)) : esc(COMP_FULL[k])}</div>` : ''}${l.map(directLigne).join('')}`).join('')}</div>`;
    }
    // Relance l'interrogation pour la vue affichée (accueil : coupes + championnats majeurs ; compétition : celle-ci)
    function directDemarrer() {
      clearTimeout(directEtat.minuterie);
      const jeton = ++directEtat.jeton;
      const tour = async () => {
        if (jeton !== directEtat.jeton) return;
        if (document.hidden) { directEtat.minuterie = setTimeout(tour, 60000); return; }
        const accueil = vue === 'accueil';
        // interrogées : toutes les tuiles de l'accueil, ou toute la rangée d'onglets (pastilles) ; bloc détaillé : coupes + majeurs / compétition affichée
        const cles = (accueil ? [...COUPES_KEYS, ...SEL_KEYS, ...LIGUE_MAJEURS, ...LIGUE_AUTRES] : ESPACES[espaceDe(currentComp)].keys).filter(k => SLUG_ESPN[k]);
        const res = await Promise.all(cles.map(directTableau));
        if (jeton !== directEtat.jeton) return;
        const listes = Object.fromEntries(cles.map((k, i) => [k, res[i] || []]));
        directEtat.live = Object.fromEntries(cles.map(k => [k, listes[k].filter(x => x.state === 'in').length]));
        marquerDirect();
        const montres = accueil ? [...COUPES_KEYS, ...SEL_KEYS, ...LIGUE_MAJEURS] : [currentComp];
        const html = directHtml(Object.fromEntries(montres.filter(k => listes[k]).map(k => [k, listes[k]])), accueil);
        const cible = document.getElementById(accueil ? 'direct-accueil' : 'direct-section');
        if (cible) { cible.innerHTML = html; if (!accueil) cible.hidden = !html; }
        const maintenant = Date.now();
        const actif = Object.values(listes).flat().some(x => x.state === 'in' ||
          (x.state === 'pre' && new Date(x.date).getTime() - maintenant < 20 * 60000 && new Date(x.date).getTime() > maintenant - 60 * 60000));
        directEtat.minuterie = setTimeout(tour, actif ? 60000 : 300000);
      };
      tour();
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) directDemarrer(); });
    // Pastilles « en direct » : tuiles de l'accueil (« En direct · N ») et onglets de compétition (point rouge)
    function marquerDirect() {
      const live = directEtat.live || {};
      document.querySelectorAll('.acc-tuile[data-k]').forEach(t => {
        const n = live[t.dataset.k] || 0;
        let b = t.querySelector('.live-badge');
        if (!n) { if (b) b.remove(); return; }
        if (!b) { b = document.createElement('i'); b.className = 'live-badge'; t.prepend(b); }
        b.textContent = `En direct · ${n}`;
        t.setAttribute('aria-label', `${t.querySelector('b').textContent.trim()} : ${n} match${n > 1 ? 's' : ''} en direct`);
      });
      document.querySelectorAll('.tab-btn[data-comp]').forEach(t => {
        const n = live[t.dataset.comp] || 0;
        t.classList.toggle('live', n > 0);
        t.title = n ? `${n} match${n > 1 ? 's' : ''} en direct` : '';
      });
    }

    // Fiche de match en direct : résumé ESPN converti au format des fiches (déroulé, compos placées, stats d'équipe)
    const LIGNE_POSTE = [[/^G$/, 0], [/^(SW|CD.*|LB|RB|LWB|RWB|D.*)$/, 1], [/^DM.*$/, 2], [/^(CM.*|LM|RM|M)$/, 3], [/^AM.*$/, 4], [/^(F|CF.*|LF|RF|RCF|S|LW|RW|ST)$/, 5]];
    const PROFONDEUR_POSTE = [6.2, 15.0, 22.0, 29.0, 37.0, 45.0];   // même échelle que ligues.placer (Python)
    function placerDirect(titulaires, side) {
      const lignes = {};
      titulaires.forEach((p, i) => {
        const a = String(p.abbr || '').toUpperCase();
        const ligne = (LIGNE_POSTE.find(([rx]) => rx.test(a)) || [null, 3])[1];
        const largeur = ['RB', 'RWB', 'RM', 'RF', 'RW'].includes(a) ? 0 : ['LB', 'LWB', 'LM', 'LF', 'LW'].includes(a) ? 4 : a.endsWith('-R') ? 1 : a.endsWith('-L') ? 3 : 2;
        (lignes[ligne] = lignes[ligne] || []).push([i, largeur]);
      });
      const pos = [];
      Object.entries(lignes).forEach(([ligne, membres]) => {
        membres.sort((a, b) => a[1] - b[1] || a[0] - b[0]);
        const n = membres.length;
        membres.forEach(([i, largeur], k) => {
          const x = n > 1 ? 15 + 70 * k / (n - 1) : 15 + 17.5 * largeur, y = PROFONDEUR_POSTE[ligne];
          pos[i] = [Math.round((side === 'home' ? x : 100 - x) * 10) / 10, Math.round((side === 'home' ? y : 100 - y) * 10) / 10];
        });
      });
      return pos;
    }
    const POSTE_ABBR = (a) => a === 'G' ? 'GOALKEEPER' : /^(SW|CD|LB|RB|LWB|RWB|D)/.test(a) ? 'DEFENDER' : /^(F|CF|LF|RF|S|LW|RW|ST)/.test(a) ? 'FORWARD' : 'MIDFIELDER';
    const STATS_DIRECT = [['possessionPct', 'ball_possession', 'Possession (%)', 1], ['totalShots', 'attempts', 'Tirs', 1], ['shotsOnTarget', 'attempts_on_target', 'Tirs cadrés', 1],
      ['blockedShots', 'attempts_blocked', 'Tirs contrés', 1], ['wonCorners', 'corners', 'Corners', 1], ['offsides', 'offsides', 'Hors-jeu', 1],
      ['saves', 'saves', 'Arrêts du gardien', 1], ['accuratePasses', 'passes_completed', 'Passes réussies', 1], ['totalPasses', 'passes_attempted', 'Passes tentées', 1],
      ['passPct', 'passes_accuracy', 'Précision des passes (%)', 100], ['totalCrosses', 'cross_attempted', 'Centres tentés', 1],
      ['accurateLongBalls', 'long_balls', 'Longs ballons réussis', 1], ['effectiveTackles', 'tackles_won', 'Tacles réussis', 1],
      ['interceptions', 'interceptions', 'Interceptions', 1], ['totalClearance', 'clearances', 'Dégagements', 1],
      ['foulsCommitted', 'fouls_committed', 'Fautes commises', 1], ['yellowCards', 'yellow_cards', 'Cartons jaunes', 1], ['redCards', 'red_cards', 'Cartons rouges', 1]];
    function directVersMatch(k, sm, id) {
      const h = ((sm.header || {}).competitions || [{}])[0] || {}, cs = h.competitors || [];
      const ch = cs.find(c => c.homeAway === 'home') || {}, ca = cs.find(c => c.homeAway === 'away') || {};
      const cote = { [String((ch.team || {}).id)]: 'home', [String((ca.team || {}).id)]: 'away' };
      const st = h.status || {}, ty = st.type || {};
      const home = espnEquipe(ch, k), away = espnEquipe(ca, k);
      const nom = (p) => ((p || {}).athlete || {}).displayName || '';
      const pid = (p) => ((p || {}).athlete || {}).id ? 'espn-' + p.athlete.id : '';
      const events = [];
      (sm.keyEvents || []).forEach(e => {
        const t = String((e.type || {}).type || ''), ps = e.participants || [], team = cote[String((e.team || {}).id)];
        if (!team || !ps.length) return;
        const base = { minute: parseInt((e.clock || {}).displayValue, 10) || 0, minute_label: (e.clock || {}).displayValue || '', team, player: nom(ps[0]), player_id: pid(ps[0]) };
        if (t.startsWith('goal') || t.startsWith('penalty---scored') || t === 'own-goal') {
          events.push({ ...base, type: 'goal', detail: t === 'own-goal' ? 'Contre son camp' : t.startsWith('penalty') ? 'Penalty' : ps[1] ? 'Passe déc. : ' + nom(ps[1]) : 'But', other_id: pid(ps[1]) });
        } else if (t.includes('red')) events.push({ ...base, type: 'red_card', detail: t.includes('yellow') ? 'Deuxième jaune' : 'Carton rouge' });
        else if (t.includes('yellow')) events.push({ ...base, type: 'yellow_card', detail: 'Carton jaune' });
        else if (t === 'substitution') events.push({ ...base, type: 'sub', detail: ps[1] ? 'Remplace ' + nom(ps[1]) : 'Entrée en jeu', other_id: pid(ps[1]) });
      });
      const lineups = {};
      (sm.rosters || []).forEach(ro => {
        const side = ro.homeAway === 'away' ? 'away' : 'home', r = ro.roster || [];
        const minuteSub = (p) => ((p.plays || []).find(x => x.substitution) || {}).clock;
        const tit = r.filter(p => p.starter).map(p => ({ p, abbr: ((p.position || {}).abbreviation) || '' }));
        const pos = placerDirect(tit, side);
        lineups[side] = tit.map(({ p, abbr }, i) => ({ id: pid(p), number: String(p.jersey || ''), name: (p.athlete || {}).lastName || (p.athlete || {}).shortName || nom(p),
          pos: POSTE_ABBR(abbr), captain: false, potm: false, x: pos[i][0], y: pos[i][1], rating: null,
          subbed_out: p.subbedOut ? ((minuteSub(p) || {}).displayValue || null) : null }));
        lineups[side + '_subs'] = r.filter(p => p.subbedIn).map(p => ({ id: pid(p), number: String(p.jersey || ''), name: (p.athlete || {}).lastName || nom(p),
          minute: (minuteSub(p) || {}).displayValue || '', potm: false, rating: null }));
        if (ro.formation) (side === 'home' ? home : away).formation = ro.formation;
      });
      const parEq = {};
      (((sm.boxscore || {}).teams) || []).forEach(t => { parEq[cote[String((t.team || {}).id)]] = Object.fromEntries((t.statistics || []).map(s => [s.name, parseFloat(s.displayValue)])); });
      const all = STATS_DIRECT.filter(([n]) => parEq.home && parEq.away && isFinite(parEq.home[n]) && isFinite(parEq.away[n]))
        .map(([n, key, label, f]) => ({ key, label, home: Math.round(parEq.home[n] * f * 10) / 10, away: Math.round(parEq.away[n] * f * 10) / 10 }));
      const venue = (((sm.gameInfo || {}).venue) || {}).fullName || '';
      return { match_id: 'direct-' + id, espn_id: String(id), direct: true, source: 'ESPN (direct)', finished: !!ty.completed,
        status: ty.state === 'in' ? (ty.name === 'STATUS_HALFTIME' ? 'Mi-temps' : 'En direct · ' + (st.displayClock || '')) : ty.completed ? 'Terminé · provisoire' : 'À venir',
        kickoff: h.date ? new Date(h.date).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris' }) : '',
        venue, home_team: home, away_team: away, events, goals: [], momentum: [], lineups: Object.keys(lineups).length ? lineups : null, players: {},
        stats: { all, '1st': [], '2nd': [] } };
    }
    async function lireDirect(k, id) {
      try {
        const r = await fetch(`${ESPN_WEB}/${SLUG_ESPN[k]}/summary?event=${encodeURIComponent(id)}`, { cache: 'no-store' });
        return r.ok ? directVersMatch(k, await r.json(), id) : null;
      } catch (e) { return null; }
    }
    async function ouvrirDirect(k, id) {
      closeInfo();
      const m = await lireDirect(k, id);
      if (!m) { toast('Fiche du match en direct indisponible pour le moment.'); return; }
      openMatchModal(m.match_id, { competitions: { [k]: { name: estLigue(k) ? nomLigue(k) : COMP_FULL[k], matches: [m] } } }, k);
      clearInterval(directEtat.ficheMinuterie);
      directEtat.ficheMinuterie = setInterval(async () => {
        const ouvert = document.getElementById('match-modal').classList.contains('open');
        if (!ouvert || !activeMatch || activeMatch.match_id !== m.match_id) { clearInterval(directEtat.ficheMinuterie); return; }
        if (document.hidden) return;
        const n = await lireDirect(k, id);
        if (!n || !activeMatch || activeMatch.match_id !== m.match_id) return;
        const avant = JSON.stringify([activeMatch.events, activeMatch.lineups, activeMatch.stats, activeMatch.status, activeMatch.home_team.score, activeMatch.away_team.score]);
        Object.assign(activeMatch, n);
        if (JSON.stringify([n.events, n.lineups, n.stats, n.status, n.home_team.score, n.away_team.score]) === avant) return;
        document.getElementById('modal-score').textContent = `${n.home_team.score} - ${n.away_team.score}`;
        document.getElementById('modal-comp-label').textContent = [estLigue(k) ? nomLigue(k) : COMP_FULL[k], n.kickoff, n.status].filter(Boolean).join(' • ');
        const body = document.getElementById('modal-body-content'), haut = body.scrollTop;
        renderModalContent();
        body.scrollTop = haut;
        if (n.finished) clearInterval(directEtat.ficheMinuterie);
      }, 30000);
    }

    // ---------- Championnats : classements finaux des saisons passées (historique_classements.py, donnees-football) ----------
    // Données publiées telles quelles : rang publié (jamais re-trié), mentions (déclassé…) et pénalités affichées, aucun titre décompté.
    const histLigueCache = new Map(), histChoix = {};
    let histTok = 0;
    async function loadHistLigue(k) {
      if (histLigueCache.has(k)) return histLigueCache.get(k);
      const [d, l] = await Promise.all([fetchJson(DONNEES + 'championnats/historique/' + k + '.json'),
        fetchJson(DONNEES + 'championnats/clubs/liens_historique.json')]);
      if (!d || !d.saisons) return null;
      const v = { d, liens: (l && l[k]) || {} };
      histLigueCache.set(k, v);
      return v;
    }
    const histSaisons = (d) => Object.keys(d.saisons).filter(x => (d.saisons[x].rows || []).length).sort().reverse();
    // Vue d'un championnat : « Cette saison » (journées, classement actuel) ou « Saisons passées » (vue dédiée, sans le reste)
    let vueLigue = 'saison';
    function majVueLigue(k) {
      const nav = document.getElementById('ligue-nav'), cv = document.getElementById('comp-view');
      const ligue = estLigue(k);
      nav.hidden = !ligue;
      nav.style.setProperty('--tab-accent', `var(--accent-${k})`);
      nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', String(ligue && b.dataset.lvue === vueLigue)));
      cv.classList.toggle('histo', ligue && vueLigue === 'histo');
    }
    function choisirVueLigue(v) {
      closeInfo();
      if (vueLigue === v) return;
      vueLigue = v;
      majVueLigue(currentComp);
      renderHistLigue(currentComp);
      syncUrl();
      window.scrollTo({ top: 0 });
    }
    async function renderHistLigue(k) {
      const sec = document.getElementById('hist-section');
      const tok = ++histTok;
      majVueLigue(k);
      if (!estLigue(k) || vueLigue !== 'histo') { sec.hidden = true; return; }
      sec.hidden = false;
      document.getElementById('hist-container').innerHTML = '<div class="empty-state">Chargement des saisons passées…</div>';
      const v = await loadHistLigue(k);
      if (tok !== histTok || currentComp !== k) return;
      if (!v || !histSaisons(v.d).length) {
        document.getElementById('hist-title').textContent = 'Saisons passées';
        document.getElementById('hist-container').innerHTML = '<div class="empty-state">Les classements des saisons passées de ce championnat ne sont pas encore disponibles.</div>';
        return;
      }
      if (!histChoix[k] || !(v.d.saisons[histChoix[k]] || {}).rows) histChoix[k] = histSaisons(v.d)[0];
      const n = histSaisons(v.d).length, ill = Object.keys(v.d.saisons).length - n;
      document.getElementById('hist-title').innerHTML = `${drapeauLigue(k)} ${esc(nomLigue(k))} · saisons passées ${infoBtn(`<p>Classement <b>final</b> de chaque saison de première division, tel que publié : ESPN depuis 2002-03, Wikipédia avant (page française, sinon page de la langue du championnat). Rien n'est recalculé ni corrigé : le rang est celui de la source, les mentions (déclassement, pénalités) sont affichées telles quelles.</p><p>Contrôles : matchs = victoires + nuls + défaites, buts marqués = buts encaissés sur l'ensemble du championnat ; une saison qui ne les passe pas n'est pas affichée${ill ? ` (${ill} saison${ill > 1 ? 's' : ''} sur ${n + ill})` : ''}. Un nombre de points qui diffère du barème de l'époque est signalé sous le tableau.</p><p>Un club est cliquable quand il est relié à une fiche du dashboard (identifiant ESPN, ou article Wikipédia du club = même élément Wikidata).</p>`, 'Source des saisons passées')}`;
      document.getElementById('hist-container').innerHTML = histLigueHtml(k, v);
      sec.hidden = false;
    }
    function choisirSaisonHist(k, x) {
      histChoix[k] = x;
      syncUrl();
      const v = histLigueCache.get(k);
      if (v) document.getElementById('hist-container').innerHTML = histLigueHtml(k, v);
    }
    function histLigueHtml(k, v) {
      const x = histChoix[k], sv = v.d.saisons[x], rows = sv.rows || [];
      const idClub = (r) => sv.source === 'ESPN' && r.espn_id ? 'espn-' + r.espn_id : (r.club_wiki && v.liens[r.club_wiki]) || null;
      const opts = histSaisons(v.d).map(y => `<option value="${esc(y)}"${y === x ? ' selected' : ''}>${esc(y)}</option>`).join('');
      const corps = rows.map(r => {
        const id = idClub(r), nom = esc(r.club);
        return `<tr${id && hasClub(id) ? ` class="clickable" onclick="openClub('${esc(id)}')"` : ''}><td class="rank-cell">${esc(r.rang ?? '')}</td>
          <td class="col-team club">${id ? clubLink(id, nom) : nom}${r.mention ? `<span class="mention">${esc(r.mention)}</span>` : ''}${r.penalite ? `<span class="mention">${esc(r.penalite)} pt${r.penalite > 1 ? 's' : ''} retiré${r.penalite > 1 ? 's' : ''}</span>` : ''}</td>
          <td>${esc(r.j ?? '')}</td><td>${esc(r.g ?? '')}-${esc(r.n ?? '')}-${esc(r.p ?? '')}</td><td>${esc(r.bp ?? '')}:${esc(r.bc ?? '')}</td><td style="font-weight:800">${esc(r.pts ?? '')}</td></tr>`;
      }).join('');
      const ecarts = ((sv.controles || {}).ecarts_points || []).map(e => `${esc(e.club)} (${esc(e.publie)} publiés, ${esc(e.bareme)} au barème)`).join(' ; ');
      const src = lienSur(sv.url) ? `<a href="${esc(sv.url)}" target="_blank" rel="noopener noreferrer">${esc(sv.titre || sv.source)}</a>` : esc(sv.titre || sv.source);
      const champions = histSaisons(v.d).map(y => {
        const s1 = v.d.saisons[y], r = (s1.rows || []).find(z => z.rang === 1);
        if (!r) return '';
        const id = s1.source === 'ESPN' && r.espn_id ? 'espn-' + r.espn_id : (r.club_wiki && v.liens[r.club_wiki]) || null;
        return `<div class="hs-ch"><span class="s">${esc(y)}</span><span>${id ? clubLink(id, esc(r.club)) : esc(r.club)}${r.mention ? ` <span style="color:var(--text-muted);font-size:0.74rem">(${esc(r.mention)})</span>` : ''}</span></div>`;
      }).join('');
      return `<div class="hs-bar"><label for="hs-sel" class="section-sub">Saison</label>
          <select id="hs-sel" onchange="choisirSaisonHist('${esc(k)}', this.value)">${opts}</select></div>
        <table class="standings-table hs-table"><thead><tr><th>#</th><th class="col-team">Club</th><th>MJ</th><th>V-N-D</th><th>Buts</th><th>Pts</th></tr></thead>
          <tbody>${corps}</tbody></table>
        <div class="hs-note">Source : ${src} (${esc(sv.source)})${(sv.controles || {}).points_victoire ? ` · victoire à ${esc(sv.controles.points_victoire)} points` : ''}${ecarts ? `<br>Points différents du barème, tels que publiés (pénalité, bonus…) : ${ecarts}.` : ''}</div>
        <details class="hs-champ"><summary>Palmarès : 1er de chaque saison (${histSaisons(v.d).length} saisons)</summary>${champions}
          <div class="hs-note" style="padding:6px 0 0">Club classé 1er dans la source, mention comprise : ce n'est pas une liste officielle des titres (un titre peut avoir été retiré).</div></details>`;
    }

    // Classement d'un championnat recalculé depuis les scores (classement_ligue.py) : critères appliqués selon le championnat
    const CRITERES_LIGUE = {
      ned: 'points, différence de buts, buts marqués', nor: 'points, différence de buts, buts marqués', aut: 'points, différence de buts, buts marqués',
      por: 'points seulement', bel: 'points seulement', tur: 'points seulement', gre: 'points seulement',
      fl2: 'points, différence de buts, buts marqués', pl: 'points, différence de buts, buts marqués', bl: 'points, différence de buts, buts marqués', fl1: 'points, différence de buts, buts marqués',
      liga: 'points, confrontations directes (points puis différence de buts, seulement si l\'aller et le retour ont été joués), différence de buts, buts marqués',
      sa: 'points, confrontations directes (points puis différence de buts, seulement si l\'aller et le retour ont été joués), différence de buts, buts marqués',
    };
    function classementLigueInfo(k, at) {
      const d = at ? new Date(at + 'T12:00:00Z').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }) : '';
      return `<p><b>Classement calculé</b> d'après les scores des matchs terminés${d ? ' jusqu\'au ' + esc(d) + ' inclus' : ''} : ESPN ne donne que le classement actuel, jamais celui d'une date passée.</p>
        <p>Départage appliqué, dans l'ordre : ${esc(CRITERES_LIGUE[k] || 'points, différence de buts, buts marqués')}. Les critères suivants du règlement ne sont pas appliqués : les clubs encore à égalité portent le même rang, suivi de =.</p>
        ${['fl1', 'pl', 'liga', 'sa', 'bl'].includes(k) ? '<p>Vérifié : le calcul à la date du jour est identique au classement officiel ESPN des cinq grands championnats.</p><p>' : '<p>'}Les zones (Europe, relégation) ne sont pas indiquées : elles décrivent la fin de saison.</p>`;
    }

    // Légende des zones d'un championnat (codes ESPN ; libellé traduit, plage de rangs lue dans le classement)
    let LEGENDE_COUPES = null;
    const ZONES_FR = { ucl: 'Ligue des champions', uel: 'Ligue Europa', uecl: 'Ligue Conférence', barrage: 'Barrage de relégation', relegation: 'Relégation', promotion: 'Montée directe', barrage_promo: "Barrages d'accession" };
    // Parcours européen de la saison (clubs/europe.json, calculé par clubs.py depuis les listes UEFA) : pastille LDC / LE / LC dans le
    // classement d'un championnat ; pleine = en lice, barrée = éliminé, 🏆 = vainqueur. Club relié par l'id UEFA de sa fiche (correspondance
    // prouvée `uefa_id`, sinon Wikidata `uefa_wd`) ; seulement pour la saison européenne du classement affiché.
    let europeSaison = null;
    const SIGLE_COUPE = { ucl: 'LDC', uel: 'LE', uecl: 'LC' };
    function saisonEuropeDe(k) {   // « 2026-27 » -> 2027 ; Norvège « 2026 » (année civile : coupes de l'été 2026) -> 2027
      const l = String(saisonDe[k] || SAISON_LIGUES || ''), m = /^(\d{4})-(\d{2})$/.exec(l);
      return m ? Number(m[1].slice(0, 2) + m[2]) : /^\d{4}$/.test(l) ? Number(l) + 1 : null;
    }
    function europeDe(k, teamId) {
      if (!europeSaison || !clubIndex || Number(europeSaison.saison) !== saisonEuropeDe(k)) return null;
      const c = clubIndex.get(String(teamId));
      const uid = c && (c.uefa_id || c.uefa_wd);
      return uid ? europeSaison.clubs[String(uid)] || null : null;
    }
    function badgeEurope(k, teamId) {
      const e = europeDe(k, teamId);
      if (!e || !SIGLE_COUPE[e.comp]) return '';
      const avant = (e.parcours || []).filter(c => c !== e.comp).map(c => COMP_FULL[c]).join(', ');
      const etat = e.statut === 'vainqueur' ? 'vainqueur' : e.statut === 'elimine' ? 'éliminé' + (e.sortie ? ' (' + e.sortie + ')' : '') : 'en lice';
      const txt = `${COMP_FULL[e.comp]} : ${etat}${avant ? ' · auparavant : ' + avant : ''}`;
      return `<span class="eu-b ${e.comp} ${e.statut === 'elimine' ? 'out' : ''}" title="${esc(txt)}" aria-label="${esc(txt)}">${e.statut === 'vainqueur' ? '🏆 ' : ''}${SIGLE_COUPE[e.comp]}</span>`;
    }
    // Légende des pastilles : uniquement dans l'info-bulle du titre du classement (ajoutée au texte de ce bouton ⓘ)
    function legendeEurope(k, rows) {
      if (!rows.some(r => europeDe(k, r.team_id))) return '';
      const saison = String(europeSaison.saison - 1) + '-' + String(europeSaison.saison).slice(2);
      return `<hr><p><b>Pastilles · Coupes d'Europe ${esc(saison)}</b></p>
        <p><span class="eu-b ucl">LDC</span> <span class="eu-b uel">LE</span> <span class="eu-b uecl">LC</span> : en lice<br>
        <span class="eu-b ucl out">LDC</span> : éliminé (tour de sortie au survol de la pastille)<br><span class="eu-b ucl">🏆 LDC</span> : vainqueur</p>
        <p>Coupe où le club joue (ou a joué en dernier) cette saison, d'après les matchs officiels de l'UEFA, tours préliminaires compris. Un club éliminé d'une coupe et reversé dans une autre porte la pastille de la seconde. Après la phase de ligue, les clubs classés 1 à 24 restent en lice jusqu'au tirage. État actuel, quelle que soit la journée affichée.</p>`;
    }

    function legendeLigue(rows) {
      const plages = [];
      rows.forEach(r => {
        if (!r.zone) return;
        const p = plages.find(x => x.z === r.zone);
        if (p) { p.a = Math.min(p.a, r.rank); p.b = Math.max(p.b, r.rank); } else plages.push({ z: r.zone, a: r.rank, b: r.rank });
      });
      return plages.map(p => `<span class="legend-item"><i class="legend-dot" style="background:var(--zone-${esc(p.z)}, var(--text-muted))"></i>${p.a === p.b ? p.a : p.a + '-' + p.b} : ${esc(ZONES_FR[p.z] || p.z)}</span>`).join('');
    }

    // Texte de l'info-bulle d'un classement recalculé : ce qui est appliqué, et ce qui ne l'est pas (voir classement.py)
    function standingsInfoHtml(at) {
      const d = at ? new Date(at + 'T12:00:00Z').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }) : '';
      return `<p><b>Classement calculé</b> d'après les scores des matchs de phase de ligue terminés${d ? ' jusqu\'au ' + esc(d) + ' inclus' : ''} : l'UEFA ne fournit que le classement actuel, jamais celui d'une date passée.</p>
        <p>Départage appliqué, dans l'ordre : points, différence de buts, buts marqués, buts marqués à l'extérieur, victoires, victoires à l'extérieur, puis points, différence de buts et buts marqués de l'ensemble des adversaires affrontés.</p>
        <p>Non appliqués faute de données à cette date : points disciplinaires et coefficient UEFA. Les clubs encore à égalité portent le même rang, suivi de =.</p>
        <p>Les zones (8es directs, barrages, élimination) ne sont pas indiquées : elles n'ont de sens qu'après la dernière journée.</p>`;
    }
