<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0f17" />
  <title>Coupes d'Europe</title>
  <style>
    :root {
      --app-h: 100vh;
      --sheet-gap: calc(10px + env(safe-area-inset-top, 0px));
      --bg-main: #0b0f17;
      --bg-card: #151c28;
      --bg-card-hover: #1c2536;
      --bg-elevated: #202b3d;
      --border: #263248;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-ucl: #38bdf8;
      --accent-uel: #fb923c;
      --accent-uecl: #34d399;
      --french-accent: #60a5fa;
      --zone-top8: #10b981;
      --zone-playoff: #f59e0b;
      --zone-elim: #ef4444;
      --home-color: #38bdf8;
      --away-color: #f43f5e;
      /* Variantes lisibles (contraste AA) des couleurs d'équipe pour le texte */
      --home-ink: color-mix(in srgb, var(--home-color) 80%, var(--text-main));
      --away-ink: color-mix(in srgb, var(--away-color) 55%, var(--text-main));
      /* Surchargées en ligne par couleursMatch() / coulVars() : couleur de l'aplat, encre lisible sur la page, texte posé sur l'aplat, liseré */
      --home-on: #fff; --away-on: #fff; --home-bord: transparent; --away-bord: transparent;
      --club-color: var(--accent-ucl); --club-ink: var(--accent-ucl); --club-on: #000; --club-bord: transparent;
    }

    [hidden] { display: none !important; }
    /* Un balayage horizontal sert aux onglets (attachTabSwipe) : pas de retour arrière du navigateur par-dessus */
    html, body { overscroll-behavior-x: none; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.45;
      padding-bottom: 48px;
      overflow-x: hidden;
    }

    /* HEADER & NAVIGATION PAR ONGLETS */
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(11, 15, 23, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .app-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-live {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--zone-top8);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .tabs-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 10px 4px;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s ease;
    }

    .tab-btn.active[data-comp="ucl"] {
      color: var(--accent-ucl);
      border-bottom-color: var(--accent-ucl);
    }
    .tab-btn.active[data-comp="uel"] {
      color: var(--accent-uel);
      border-bottom-color: var(--accent-uel);
    }
    .tab-btn.active[data-comp="uecl"] {
      color: var(--accent-uecl);
      border-bottom-color: var(--accent-uecl);
    }

    /* Menu des journées / tours (propre à chaque coupe) : bouton en tête du contenu + feuille du bas */
    .tour-bar { display: flex; align-items: stretch; gap: 8px; margin-bottom: -8px; }
    .tour-bar[hidden] { display: none; }
    .tour-btn {
      flex: 1; min-width: 0; min-height: 52px; display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 14px; text-align: left;
      background: var(--bg-card); color: var(--text-main); font: inherit; cursor: pointer;
      border: 1px solid var(--border); border-left: 4px solid var(--tour-accent, var(--accent-ucl)); border-radius: 12px;
    }
    .tour-btn:focus-visible, .tour-opt:focus-visible { outline: 2px solid var(--tour-accent, var(--accent-ucl)); outline-offset: 2px; }
    .tour-btn[aria-expanded="true"] { background: var(--bg-card-hover); }
    .tour-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
    .tour-t { font-size: 1rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tour-d { font-size: 0.76rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tour-chev { width: 12px; height: 8px; flex-shrink: 0; opacity: 0.8; }
    .tour-bar .info-btn { align-self: center; }
    .date-sep { grid-column: 1 / -1; font-size: 0.76rem; font-weight: 700; color: var(--text-muted); margin-top: 4px; }
    .date-sep::first-letter { text-transform: uppercase; }
    .date-sep:first-child { margin-top: 0; }
    .tour-backdrop {
      position: fixed; top: 0; left: 0; right: 0; height: var(--app-h); z-index: 56; display: none; align-items: flex-end; justify-content: center;
      background: rgba(0, 0, 0, 0.6);
    }
    .tour-backdrop.open { display: flex; }
    .tour-sheet {
      background: var(--bg-card); width: 100%; max-width: 520px; max-height: calc(var(--app-h) - var(--sheet-gap) - 40px); display: flex; flex-direction: column;
      border-radius: 20px 20px 0 0; border-top: 1px solid var(--border); overflow: hidden; animation: slideUp 0.2s ease-out; will-change: transform;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .tour-sheet.settle { transition: transform 0.22s ease-out; }
    @media (prefers-reduced-motion: reduce) { .tour-sheet.settle { transition: none; } }
    .tour-sheet .sheet-handle { background: var(--bg-card); }
    .tour-head { touch-action: none; display: flex; justify-content: space-between; align-items: center; padding: 2px 16px 10px; border-bottom: 1px solid var(--border); }
    .tour-head b { font-size: 1rem; }
    .tour-head small { display: block; font-size: 0.76rem; color: var(--text-muted); }
    .tour-list { overflow-y: auto; flex: 1; min-height: 0; overscroll-behavior: contain; padding: 4px 12px 16px; }
    .tour-grp { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); padding: 14px 4px 6px; }
    .tour-opt {
      width: 100%; min-height: 52px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin-bottom: 4px; text-align: left;
      background: transparent; color: var(--text-main); font: inherit; cursor: pointer; border: 1px solid transparent; border-radius: 12px;
    }
    .tour-opt .tour-t { font-weight: 700; }
    .tour-opt:active { background: var(--bg-card-hover); }
    .tour-opt[aria-selected="true"] { background: color-mix(in srgb, var(--tour-accent) 16%, var(--bg-card)); border-color: var(--tour-accent); }
    .tour-opt[aria-selected="true"]::after { content: "✓"; color: var(--tour-accent); font-weight: 800; }
    .tour-opt .tour-n { font-size: 0.74rem; color: var(--text-muted); white-space: nowrap; }
    main.loading { opacity: 0.45; pointer-events: none; transition: opacity 0.15s ease; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); border: 0; }

    /* CONTENEUR PRINCIPAL */
    main {
      min-height: calc(var(--app-h) - 150px); /* zone de glissement entre coupes : toute la hauteur visible */
      max-width: 680px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 0.92rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
    }

    .section-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* 1. FOCUS CLUBS FRANÇAIS */
    .fr-cards-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .fr-card {
      background: linear-gradient(160deg, #172133 0%, #131a26 100%);
      border: 1px solid #2b3b57;
      border-left: 4px solid var(--french-accent);
      border-radius: 14px;
      padding: 15px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .fr-card:active {
      transform: scale(0.99);
    }

    .fr-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .fr-club-tag {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--french-accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .rank-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .rank-pill.top8 {
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .rank-pill.playoff {
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .rank-pill.none {
      background: var(--bg-elevated); color: var(--text-muted); border: 1px solid var(--border);
    }
    .rank-pill.eliminated {
      background: rgba(239, 68, 68, 0.16);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .fr-scoreline {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      background: rgba(11, 15, 23, 0.55);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .team-name {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .team-name.home { text-align: right; display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
    .team-name.away { text-align: left; display: flex; justify-content: flex-start; align-items: center; gap: 6px; }
    .team-name.is-fr { color: #ffffff; font-weight: 700; }

    .score-box {
      background: var(--bg-elevated);
      padding: 4px 12px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      border: 1px solid var(--border);
    }

    .goals-timeline {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .goal-chip {
      font-size: 0.74rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      padding: 2px 8px;
      border-radius: 6px;
      color: #cbd5e1;
    }

    .ai-summary-text {
      font-size: 0.87rem;
      color: #dbeafe;
      line-height: 1.52;
      background: rgba(15, 23, 42, 0.5);
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.14);
    }

    .fr-card-footer {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* 2. GRILLE DES RÉSULTATS DE LA SOIRÉE */
    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
    }

    .match-tile {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s ease;
    }

    .match-tile:hover {
      background: var(--bg-card-hover);
    }

    .tile-teams {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .tile-team-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-right: 12px;
    }

    .tile-team-name {
      font-size: 0.9rem;
      color: var(--text-main);
    }
    .tile-team-name.is-fr {
      font-weight: 700;
      color: var(--french-accent);
    }

    .tile-team-score {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .tile-meta {
      border-left: 1px solid var(--border);
      padding-left: 12px;
      text-align: center;
      min-width: 64px;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* 4. CLASSEMENT DES 36 ÉQUIPES */
    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .standings-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    table.standings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.83rem;
    }

    .standings-table th {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.72rem;
      text-transform: uppercase;
      padding: 9px 8px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .standings-table th.col-team,
    .standings-table td.col-team {
      text-align: left;
    }

    .standings-table td {
      padding: 9px 8px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .standings-table tr.is-fr-row {
      background: rgba(56, 189, 248, 0.11);
      font-weight: 700;
    }

    .rank-cell {
      font-weight: 700;
      position: relative;
      padding-left: 12px !important;
    }

    .rank-cell::before {
      content: "";
      position: absolute;
      left: 0;
      top: 4px;
      bottom: 4px;
      width: 4px;
      border-radius: 0 3px 3px 0;
    }

    tr.zone-top8 .rank-cell::before { background: var(--zone-top8); }
    tr.zone-playoff .rank-cell::before { background: var(--zone-playoff); }
    tr.zone-eliminated .rank-cell::before { background: var(--zone-elim); }

    /* Délimitation explicite entre les zones (Places 8 et 24) */
    tr.zone-cutoff td {
      border-bottom: 2px dashed rgba(148, 163, 184, 0.45);
    }

    .fr-badge-inline {
      font-size: 0.65rem;
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent-ucl);
      padding: 1px 5px;
      border-radius: 4px;
      margin-left: 5px;
      vertical-align: middle;
    }

    /* 3. TIROIR MODAL : FICHE DE MATCH COMPLÈTE */
    @supports (height: 100dvh) { :root { --app-h: 100dvh; } }
    /* --app-h est recalée en px par JS (visualViewport) : hauteur réellement visible, barre d'adresse comprise */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--app-h);
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      background: var(--bg-card);
      width: 100%;
      max-width: 680px;
      height: calc(var(--app-h) - var(--sheet-gap));
      border-radius: 20px 20px 0 0;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.22s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .sheet-handle {
      flex-shrink: 0; height: 22px; background: var(--bg-elevated); touch-action: none; position: relative;
    }
    .sheet-handle::after {
      content: ""; position: absolute; left: 50%; top: 8px; width: 40px; height: 4px; margin-left: -20px;
      border-radius: 99px; background: var(--text-muted); opacity: 0.6;
    }
    .modal-sheet { will-change: transform; }
    .modal-sheet.settle { transition: transform 0.22s ease-out; }
    @media (prefers-reduced-motion: reduce) { .modal-sheet.settle { transition: none; } }
    .modal-header {
      touch-action: none;
      padding: 4px 16px 14px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
    }

    .modal-close-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .btn-close {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-main);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
    }

    .modal-subtabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--bg-main);
      border-bottom: 1px solid var(--border);
    }

    .subtab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 11px 4px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .subtab-btn.active {
      color: var(--accent-ucl);
      border-bottom-color: var(--accent-ucl);
    }
    #club-tabs .subtab-btn.active { color: var(--club-ink); border-bottom-color: var(--club-ink); }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
      overscroll-behavior: contain;
    }

    /* VUE 1 : ÉVÉNEMENTS */
    .event-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: rgba(255, 255, 255, 0.02);
      font-size: 0.85rem;
    }
    .event-row.away {
      flex-direction: row-reverse;
      text-align: right;
    }
    .event-row.neutral {
      justify-content: center;
      background: rgba(250, 204, 21, 0.07);
    }
    .ev-min {
      font-weight: 700;
      color: var(--accent-ucl);
      min-width: 34px;
    }

    /* MOMENTUM (en tête de l'onglet Stats) */
    .momentum-box {
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 8px 12px;
    }
    .momentum-legend {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      font-size: 0.76rem;
      margin-bottom: 8px;
      font-weight: 600;
      padding: 0 4px;
    }
    .momentum-key { font-size: 0.7rem; color: var(--text-muted); padding: 0 4px; margin-top: 6px; }

    /* VUE 3 : TERRAIN TACTIQUE (positions calculées en JS : lignes déduites de la formation + anti-collision) */
    .pitch-container {
      position: relative;
      width: 100%;
      height: 520px;
      background: linear-gradient(180deg, #14532d 0%, #166534 50%, #14532d 100%);
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 12px;
      overflow: hidden;
    }
    .pitch-midline {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.35);
    }
    .pitch-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 72px;
      height: 72px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
    }
    .player-node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: max-content;
      padding: 8px 12px 0;
      text-align: center;
    }
    .player-dot {
      position: relative;
      width: var(--dot, 26px);
      height: var(--dot, 26px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 800;
      color: #fff;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.45);
    }
    .player-dot.home { background: var(--home-color); color: var(--home-on); }
    .player-dot.away { background: var(--away-color); color: var(--away-on); }
    .player-dot.home.lis { border-color: var(--home-bord); } .player-dot.away.lis { border-color: var(--away-bord); }
    /* Pastille / bandeau d'équipe : aplat de la couleur d'équipe, liseré 1 px si quasi blanc ou quasi noir */
    .sw-eq { margin-right: 6px; display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; vertical-align: baseline; }
    .sw-eq.home { background: var(--home-color); box-shadow: 0 0 0 1px var(--home-bord); }
    .sw-eq.away { background: var(--away-color); box-shadow: 0 0 0 1px var(--away-bord); }
    .duo-bar { display: flex; height: 4px; border-radius: 99px; overflow: hidden; gap: 2px; margin-top: 8px; }
    .duo-bar i { flex: 1; display: block; }
    .duo-bar i.home { background: var(--home-color); box-shadow: inset 0 0 0 1px var(--home-bord); }

        <button class="subtab-btn" data-view="stats" onclick="switchModalView('stats')">Stats</button>
      </div>

      <div class="modal-body" id="modal-body-content"></div>
    </div>
  </div>

  <!-- FICHE JOUEUR (au-dessus de la fiche de match) -->
  <div class="player-backdrop" id="player-modal" onclick="if (event.target.id === 'player-modal') closePlayer()">
    <div class="player-sheet" id="player-sheet">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="player-body" id="player-body"></div>
    </div>
  </div>


  <!-- MENU DES JOURNÉES / TOURS (feuille du bas, propre à la coupe affichée) -->
  <div class="tour-backdrop" id="tour-modal" onclick="if (event.target.id === 'tour-modal') closeTourMenu()">
    <div class="tour-sheet" id="tour-sheet" role="dialog" aria-modal="true" aria-labelledby="tour-sheet-title">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="tour-head" id="tour-head"></div>
      <div class="tour-list" id="tour-list" role="listbox" aria-labelledby="tour-sheet-title"></div>
    </div>
  </div>

  <!-- FICHE DE CLUB (empilée selon l'ordre d'ouverture : bringToFront) -->
  <div class="club-backdrop" id="club-modal" onclick="if (event.target.id === 'club-modal') closeClub()">
    <div class="club-sheet" id="club-sheet" role="dialog" aria-label="Fiche de club">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="club-head" id="club-head"></div>
      <div class="modal-subtabs" id="club-tabs">
        <button class="subtab-btn active" data-cview="apercu" onclick="switchClubView('apercu')">Aperçu</button>
        <button class="subtab-btn" data-cview="matchs" onclick="switchClubView('matchs')">Matchs</button>
        <button class="subtab-btn" data-cview="stats" onclick="switchClubView('stats')">Stats</button>
        <button class="subtab-btn" data-cview="effectif" onclick="switchClubView('effectif')">Effectif</button>
      </div>
      <div class="club-body" id="club-body"></div>
    </div>
  </div>

  <script>
    let appData = null;
    let currentComp = 'ucl';
    let activeMatch = null;
    let currentModalView = 'events';
    let currentStatsPeriod = 'all';

    // Drapeau de la nationalité d'un club (code fourni par le collecteur à partir du pays UEFA)
    const flag = (t) => t && t.flag
      ? `<img class="flag" src="https://flagcdn.com/w40/${esc(t.flag)}.png" alt="${esc(t.country || '')}" title="${esc(t.country_name || t.country || '')}" loading="lazy" width="18" height="13">`
      : '';
    // ---------- Hauteur visible réelle (barre d'adresse mobile) : --app-h en px ----------
    function syncAppHeight() {
      const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
      if (h) document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
    }
    syncAppHeight();
    window.addEventListener('resize', syncAppHeight);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', syncAppHeight);

    // ---------- Info-bulle unique : infoBtn(html) rend le bouton, #info-pop affiche le texte ----------
    // Le texte (HTML déjà échappé par l'appelant) est conservé dans INFO_TEXTS ; le bouton ne porte que l'indice.
    const INFO_TEXTS = [];
    function infoBtn(html, label) {
      let i = INFO_TEXTS.indexOf(html);
      if (i < 0) { INFO_TEXTS.push(html); i = INFO_TEXTS.length - 1; }
      return `<button type="button" class="info-btn" data-info="${i}" aria-label="${esc(label || 'Informations')}" aria-expanded="false" aria-haspopup="true"></button>`;
    }
    let infoOpenBtn = null;
    function closeInfo() {
      const pop = document.getElementById('info-pop');
      if (pop) pop.classList.remove('open');
      if (infoOpenBtn) infoOpenBtn.setAttribute('aria-expanded', 'false');
      infoOpenBtn = null;
    }
    function openInfo(btn) {
      let pop = document.getElementById('info-pop');
      if (!pop) {
        pop = document.createElement('div');
        pop.id = 'info-pop'; pop.setAttribute('role', 'dialog');
        document.body.appendChild(pop);
      }
      closeInfo();
      pop.innerHTML = INFO_TEXTS[Number(btn.dataset.info)] || '';
      pop.style.visibility = 'hidden'; pop.classList.add('open');
      const vw = document.documentElement.clientWidth, vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
      const w = Math.min(320, vw - 16);
      pop.style.width = w + 'px';
      const r = btn.getBoundingClientRect(), ph = pop.offsetHeight;
      const left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, vw - w - 8));
      let top = r.bottom + 6;
      if (top + ph > vh - 8) top = Math.max(8, r.top - ph - 6);
      pop.style.left = left + 'px'; pop.style.top = top + 'px'; pop.style.visibility = '';
      btn.setAttribute('aria-expanded', 'true');
      infoOpenBtn = btn;
    }
    // Capture : un toucher sur ⓘ ne déclenche pas le clic de la carte / ligne qui le contient.
    document.addEventListener('click', (e) => {
      const b = e.target.closest && e.target.closest('.info-btn');
      if (b) { e.stopPropagation(); e.preventDefault(); if (b === infoOpenBtn) closeInfo(); else openInfo(b); return; }
      if (infoOpenBtn && !(e.target.closest && e.target.closest('#info-pop'))) closeInfo();
    }, true);
    window.addEventListener('resize', closeInfo);

    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    document.getElementById('grid-hint').innerHTML = infoBtn('Toucher un match pour ouvrir sa fiche détaillée.', 'Aide');

    // ---------- Soirées : soirees/index.json (menu) + soirees/<date>.json ; repli sur data.json sans index ----------
    const COMP_KEYS = ['ucl', 'uel', 'uecl'];
    const COMP_FULL = { ucl: 'Ligue des Champions', uel: 'Ligue Europa', uecl: 'Ligue Conférence' };
    let soireeIndex = null;        // lignes de l'index (plus récente d'abord) ; null = pas d'index : pas de menu
    const soireeCache = new Map();

    async function fetchJson(url) {
      try {
        const r = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now());
        return r.ok ? await r.json() : null;
      } catch (e) { return null; }
    }

    // ---------- Menu des journées / tours : un par coupe, construit depuis soirees/index.json ----------
    // Un tour (journée de phase de ligue, barrages, tour préliminaire…) peut s'étaler sur plusieurs soirées : il charge
    // et fusionne les soirees/<date>.json concernées (index : competitions.<clé>.{stage, tour}).
    const GROUPES = [   // ordre du menu : du plus récent au plus ancien
      { k: 'finale', t: 'Phase finale' }, { k: 'ligue', t: 'Phase de ligue' }, { k: 'barrages', t: 'Barrages' }, { k: 'prelim', t: 'Tours préliminaires' }];
    let toursByComp = {};          // clé de coupe -> tours (groupe, puis date décroissante)
    const tourChoice = {};         // clé de coupe -> id du tour choisi (conservé quand on change de coupe)
    const tourCache = new Map();   // 'coupe|id' -> { comp (fusion des matchs), meta }
    let tourToken = 0;

    const slug = (v) => String(v).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    function groupeDe(t) {
      if (t.stage === 'knockout') return 'finale';
      if (t.stage === 'league') return 'ligue';
      if (t.stage === 'qualifying') return /^barrage/i.test(t.tour) ? 'barrages' : 'prelim';
      return /^J\d/.test(t.tour) ? 'ligue' : 'prelim';
    }
    // « J5 » -> « Journée 5 » ; « T3 retour » -> « 3e tour retour » ; « Barrages aller » inchangé
    function tourTitre(t) {
      let m = /^J(\d+)$/.exec(t.tour);
      if (m) return 'Journée ' + m[1];
      m = /^T(\d+) (aller|retour)$/.exec(t.tour);
      if (m) return (m[1] === '1' ? '1er' : m[1] + 'e') + ' tour ' + m[2];
      return t.tour || (GROUPES.find(g => g.k === t.groupe) || {}).t || 'Tour';
    }
    // « 24-25 nov. », « 31 août-1 sept. »
    function datesCourtes(dates) {
      const p = (iso) => ({ j: Number(iso.slice(8)), m: new Date(iso + 'T12:00:00Z').toLocaleDateString('fr-FR', { month: 'short', timeZone: 'UTC' }) });
      const a = p(dates[0]), b = p(dates[dates.length - 1]);
      if (dates.length === 1 || dates[0] === dates[dates.length - 1]) return `${a.j} ${a.m}`;
      return a.m === b.m ? `${a.j}-${b.j} ${a.m}` : `${a.j} ${a.m}-${b.j} ${b.m}`;
    }
    const tourSousTitre = (t) => datesCourtes(t.dates) + (t.matchs ? ` · ${t.matchs} match${t.matchs > 1 ? 's' : ''}` : '');

    function buildTours() {
      toursByComp = {};
      COMP_KEYS.forEach(k => {
        const map = new Map();
        soireeIndex.forEach(l => {
          const c = l.competitions && l.competitions[k];
          if (!c) return;
          const key = (c.stage || '') + '|' + (c.tour || '');
          let t = map.get(key);
          if (!t) { t = { comp: k, stage: c.stage || '', tour: c.tour || '', dates: [], matchs: 0, jouee: false, reconstituee: false }; map.set(key, t); }
          t.dates.push(l.date); t.matchs += c.matchs || 0;
          if ((l.termines || 0) > 0) t.jouee = true;
          if (l.reconstituee) t.reconstituee = true;
        });
        const used = new Set();
        const list = [...map.values()];
        list.forEach(t => {
          t.dates.sort(); t.fin = t.dates[t.dates.length - 1]; t.groupe = groupeDe(t); t.titre = tourTitre(t);
          t.id = slug(t.tour || t.stage || 'tour');
          if (used.has(t.id)) t.id += '-' + slug(t.stage);
          used.add(t.id);
        });
        const rang = (t) => GROUPES.findIndex(g => g.k === t.groupe);
        list.sort((a, b) => rang(a) - rang(b) || b.fin.localeCompare(a.fin));
        toursByComp[k] = list;
      });
    }
    // Par défaut : le tour le plus récent qui a des matchs terminés
    function defaultTour(k) {
      const l = toursByComp[k] || [];
      return l.filter(t => t.jouee).sort((a, b) => b.fin.localeCompare(a.fin))[0] || l[0] || null;
    }

    // Une soirée : cache, puis data.json pour la plus récente (copie de sa soirée), sinon soirees/<date>.json
    async function loadSoiree(date) {
      let data = soireeCache.get(date);
      if (data) return data;
      if (soireeIndex && date === soireeIndex[0].date) {
        const latest = await fetchJson('data.json');
        if (latest && (latest.target_dates || []).length === 1 && latest.target_dates[0] === date) data = latest;
      }
      if (!data) data = await fetchJson('soirees/' + date + '.json');
      if (data) soireeCache.set(date, data);
      return data;
    }
    const minutesKickoff = (m) => {
      const r = /(\d{1,2}):(\d{2})\s*$/.exec(m.kickoff || '');
      return r ? (Number(r[1]) < 6 ? 24 : 0) * 60 + Number(r[1]) * 60 + Number(r[2]) : 0;   // après minuit = fin de soirée
    };
    // Fusionne la coupe de toutes les soirées du tour : matchs (soirée puis heure, sans doublon), cartes des clubs français ;
    // classement et reste = ceux de la soirée la plus récente du tour (officiel ou calculé, règles inchangées).
    async function loadTour(t) {
      const key = t.comp + '|' + t.id;
      if (tourCache.has(key)) return tourCache.get(key);
      const datas = await Promise.all(t.dates.map(loadSoiree));
      if (datas.some(d => !d)) return null;
      const matches = [], focus = [], seen = new Set(), seenF = new Set();
      let base = {}, rec = false;
      datas.forEach((d, i) => {
        const c = (d.competitions || {})[t.comp] || {};
        base = c;
        if (d.reconstituee) rec = true;
        (c.matches || []).map((m, j) => [m, j]).sort((a, b) => minutesKickoff(a[0]) - minutesKickoff(b[0]) || a[1] - b[1]).forEach(([m]) => {
          if (seen.has(m.match_id)) return;
          seen.add(m.match_id); m._soiree = t.dates[i]; matches.push(m);
        });
        (c.french_clubs_focus || []).forEach(f => {
          const k = f.match_id + '|' + f.club_id;
          if (seenF.has(k)) return;
          seenF.add(k); f._soiree = t.dates[i]; focus.push(f);
        });
      });
      const last = datas[datas.length - 1];
      const hit = {
        comp: { ...base, matches, french_clubs_focus: focus, matchday_label: '', _multi: t.dates.length > 1 },
        meta: { last_updated: last.last_updated, reconstituee: rec },
      };
      tourCache.set(key, hit);
      return hit;
    }

    function updateBadge(meta) {
      const badge = document.getElementById('last-updated-badge');
      if (meta && meta.last_updated) {
        const d = new Date(meta.last_updated);
        badge.textContent = (meta.reconstituee ? 'Reconstituée ' : 'MàJ ') +
          d.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris' });
      }
    }
    const RECONSTITUEE_INFO = '<p>Cette journée (ou une de ses soirées) a été rejouée après coup avec le même pipeline que les soirées du jour : scores, buteurs, statistiques, momentum et notes des joueurs viennent de l\'UEFA.</p><p>Le classement de la phase de ligue est recalculé d\'après les scores (voir son info-bulle). Les résumés sont d\'abord générés sans IA à partir des données officielles ; ceux de la phase de ligue sont ensuite remplacés par des résumés IA contrôlés.</p>';

    // Bouton du menu, en tête du contenu de la coupe affichée (+ info-bulle discrète si une soirée du tour est reconstituée)
    function renderTourBar(t) {
      const bar = document.getElementById('tour-bar');
      bar.hidden = !t;
      if (!t) { bar.innerHTML = ''; return; }
      bar.style.setProperty('--tour-accent', `var(--accent-${t.comp})`);
      bar.innerHTML = `<button type="button" class="tour-btn" id="tour-btn" aria-haspopup="dialog" aria-expanded="false" aria-label="${esc(t.titre + ', ' + tourSousTitre(t) + '. Changer de journée ou de tour')}" onclick="openTourMenu()">
          <span class="tour-txt"><span class="tour-t">${esc(t.titre)}</span><span class="tour-d">${esc(tourSousTitre(t))}</span></span>
          <svg class="tour-chev" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>${t.reconstituee ? infoBtn(RECONSTITUEE_INFO, 'Journée reconstituée') : ''}`;
    }

    // Feuille du bas : la liste des tours de la coupe affichée, regroupés, le tour courant surligné
    function openTourMenu() {
      const k = currentComp, list = toursByComp[k] || [];
      if (!list.length) return;
      const cur = tourChoice[k];
      const sheet = document.getElementById('tour-sheet');
      sheet.style.setProperty('--tour-accent', `var(--accent-${k})`);
      document.getElementById('tour-head').innerHTML = `<div><b id="tour-sheet-title">${esc(COMP_FULL[k])}</b><small>Choisir une journée ou un tour</small></div>
        <button type="button" class="btn-close" onclick="closeTourMenu()" aria-label="Fermer">✕</button>`;
      document.getElementById('tour-list').innerHTML = GROUPES.map(g => {
        const ts = list.filter(t => t.groupe === g.k);
        if (!ts.length) return '';
        return `<div role="group" aria-labelledby="tg-${g.k}"><div class="tour-grp" id="tg-${g.k}">${esc(g.t)}</div>${ts.map(t =>
          `<button type="button" role="option" class="tour-opt" data-id="${esc(t.id)}" aria-selected="${t.id === cur}" tabindex="${t.id === cur ? 0 : -1}" onclick="chooseTour('${esc(t.id)}')">
            <span class="tour-txt"><span class="tour-t">${esc(t.titre)}</span><span class="tour-d">${esc(datesCourtes(t.dates))}</span></span>
            <span class="tour-n">${t.matchs} match${t.matchs > 1 ? 's' : ''}</span></button>`).join('')}</div>`;
      }).join('');
      const modal = document.getElementById('tour-modal');
      modal.classList.add('open'); bringToFront(modal); syncBodyLock();
      const b = document.getElementById('tour-btn'); if (b) b.setAttribute('aria-expanded', 'true');
      const sel = document.querySelector('#tour-list .tour-opt[aria-selected="true"]') || document.querySelector('#tour-list .tour-opt');
      if (sel) { sel.focus({ preventScroll: true }); sel.scrollIntoView({ block: 'center' }); }
    }
    function closeTourMenu() {
      const modal = document.getElementById('tour-modal');
      if (!modal.classList.contains('open')) return;
      modal.classList.remove('open'); syncBodyLock();
      const b = document.getElementById('tour-btn');
      if (b) { b.setAttribute('aria-expanded', 'false'); b.focus({ preventScroll: true }); }
    }
    function chooseTour(id) {
      closeTourMenu();
      if (id !== tourChoice[currentComp]) showTour(currentComp, id);
    }
    document.getElementById('tour-modal').addEventListener('keydown', (e) => {   // flèches / Début / Fin dans la liste, Tab piégé dans la feuille
      const opts = [...document.querySelectorAll('#tour-list .tour-opt')], i = opts.indexOf(document.activeElement);
      const go = (n) => { e.preventDefault(); const o = opts[Math.max(0, Math.min(opts.length - 1, n))]; if (o) { opts.forEach(x => x.tabIndex = -1); o.tabIndex = 0; o.focus(); } };
      if (e.key === 'ArrowDown') go(i + 1); else if (e.key === 'ArrowUp') go(i < 0 ? 0 : i - 1);
      else if (e.key === 'Home') go(0); else if (e.key === 'End') go(opts.length - 1);
      else if (e.key === 'Tab') {
        const f = [...document.querySelectorAll('#tour-sheet button')].filter(x => x.tabIndex >= 0), a = document.activeElement;
        if (e.shiftKey && a === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && a === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      }
    });

    // URL partageable : ?c=ucl&tour=j5 ; ?soiree=AAAA-MM-JJ (ancien format, aussi #soiree= ou #AAAA-MM-JJ) reste compris en lecture
    function urlParams() {
      const p = new URLSearchParams(location.search), h = location.hash.replace(/^#(soiree=)?/, '');
      return { c: p.get('c'), tour: p.get('tour'), soiree: [p.get('soiree'), h].find(v => v && /^\d{4}-\d{2}-\d{2}$/.test(v)) || null };
    }
    function syncUrl() {
      const u = new URL(location.href), id = tourChoice[currentComp];
      u.searchParams.delete('soiree'); u.searchParams.set('c', currentComp);
      if (id) u.searchParams.set('tour', id); else u.searchParams.delete('tour');
      u.hash = '';
      try { history.replaceState(null, '', u); } catch (e) { /* aperçu hors page : sans effet */ }
    }

    // Affiche la coupe `compKey` pour le tour `id` (défaut : le plus récent joué) ; `slide` = animation du glissement entre coupes
    async function showTour(compKey, id, slide) {
      const token = ++tourToken;
      const main = document.getElementById('main-zone');
      currentComp = compKey;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.comp === compKey));
      const t = (toursByComp[compKey] || []).find(x => x.id === id) || defaultTour(compKey);
      const err = document.getElementById('soiree-err'); if (err) err.remove();
      if (!t) {   // coupe sans aucune soirée conservée
        tourChoice[compKey] = null; renderTourBar(null); syncUrl();
        main.classList.remove('loading');
        appData.competitions[compKey] = { name: COMP_FULL[compKey], french_clubs_focus: [], matches: [], standings: [], standings_source: 'absent' };
        renderCompetition(compKey);
        return;
      }
      tourChoice[compKey] = t.id;
      renderTourBar(t); syncUrl();
      let hit = tourCache.get(compKey + '|' + t.id);
      if (!hit) {
        main.classList.add('loading');
        hit = await loadTour(t);
        if (token !== tourToken) return;   // un autre tour / une autre coupe a été demandé entre-temps
      }
      main.classList.remove('loading');
      if (!hit) {
        main.insertAdjacentHTML('afterbegin', `<div class="empty-state" id="soiree-err">Impossible de charger ${esc(t.titre)}.</div>`);
        return;
      }
      appData.competitions[compKey] = hit.comp;
      updateBadge(hit.meta);
      renderCompetition(compKey);
      if (slide) slideIn(main, slide);
    }

    async function initDashboard() {
      const [idx] = await Promise.all([fetchJson('soirees/index.json'), loadClubIndex()]);
      const lignes = Array.isArray(idx) ? idx.filter(l => l && /^\d{4}-\d{2}-\d{2}$/.test(l.date)).sort((a, b) => b.date.localeCompare(a.date)) : [];
      soireeIndex = lignes.length ? lignes : null;
      if (soireeIndex) {
        appData = { competitions: {} };
        buildTours();
        const u = urlParams();
        let comp = 'ucl', id = null;
        const row = u.soiree && soireeIndex.find(l => l.date === u.soiree);
        if (row) {   // ancien lien ?soiree= : ouvre la coupe et le tour de cette soirée
          const ks = COMP_KEYS.filter(k => row.competitions && row.competitions[k]);
          if (ks.length) {
            comp = ks.includes(u.c) ? u.c : ks[0];
            const c = row.competitions[comp];
            const t = toursByComp[comp].find(x => x.stage === (c.stage || '') && x.tour === (c.tour || ''));
            id = t && t.id;
          }
        } else {
          if (COMP_KEYS.includes(u.c)) comp = u.c;
          id = u.tour;
        }
        if (!(toursByComp[comp] || []).length) comp = COMP_KEYS.find(k => toursByComp[k].length) || 'ucl';
        await showTour(comp, id);
        return;
      }
      // Pas d'index (hébergement ancien, première publication) : data.json seul, sans menu
      const latest = await fetchJson('data.json');
      if (!latest) {
        document.querySelector('main').innerHTML =
          `<div class="empty-state">Impossible de charger data.json.<br>Ouvre la page via GitHub Pages ou un serveur local (python -m http.server).</div>`;
        return;
      }
      appData = latest;
      updateBadge({ last_updated: latest.last_updated, reconstituee: latest.reconstituee });
      const has = (k) => ((latest.competitions || {})[k] || {}).matches && latest.competitions[k].matches.length > 0;
      if (!has(currentComp)) { const k = COMP_KEYS.find(has); if (k) currentComp = k; }
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.comp === currentComp));
      renderCompetition(currentComp);
    }

    function switchCompetition(compKey, slide) {
      closeInfo();
      if (!soireeIndex) {   // sans index : data.json seul
        currentComp = compKey;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.comp === compKey));
        renderCompetition(compKey);
        if (slide) slideIn(document.getElementById('main-zone'), slide);
        return;
      }
      showTour(compKey, tourChoice[compKey], slide);   // chaque coupe garde son tour choisi
    }

    function getZoneLabel(zone, rank) {
      if (!rank) return 'Classement n.d.';
      const r = rank === 1 ? '1er' : `${rank}e`;
      if (!zone) return r;   // classement recalculé d'une soirée passée : pas de zone (n'a de sens qu'à la dernière journée)
      if (zone === 'top8') return `${r} • Top 8 (8es)`;
      if (zone === 'playoff') return `${r} • Barrages`;
      return `${r} • Zone élim.`;
    }

        { name: '', french_clubs_focus: [], matches: [], standings: [] };

      document.getElementById('matchday-indicator').textContent = dateEnToutesLettres(comp.matchday_label || '');

      // 2. Grille des matchs
      const gridContainer = document.getElementById('matches-grid-container');

    // ---------- Compos : lignes déduites de la formation + anti-collision ----------
    // Chaque ligne = un rang vertical (gardien, puis un rang par nombre de la formation UEFA). Les joueurs sont
    // rangés par profondeur UEFA (y), puis découpés selon la formation ; dans une ligne, ils sont répartis
    // régulièrement dans l'ordre de leur x UEFA. Aucun joueur n'est changé de ligne ni inventé.
    function lineupRows(list, formation, side) {
      const depth = (p) => side === 'home' ? (p.y ?? 50) : 100 - (p.y ?? 50);
      let gk = list.find(p => p.pos === 'GOALKEEPER');
      if (!gk && list.length) gk = list.reduce((b, p) => depth(p) < depth(b) ? p : b, list[0]);
      const out = list.filter(p => p !== gk).sort((a, b) => depth(a) - depth(b) || (a.x ?? 50) - (b.x ?? 50));
      const counts = String(formation || '').split('-').map(Number);
      let rows = [];
      if (counts.length && counts.every(n => n > 0) && counts.reduce((a, b) => a + b, 0) === out.length) {
        let i = 0;
        counts.forEach(n => { rows.push(out.slice(i, i + n)); i += n; });
      } else {
        out.forEach(p => {
          const last = rows[rows.length - 1];
          if (last && depth(p) - depth(last[last.length - 1]) <= 3.5) last.push(p); else rows.push([p]);
        });
      }
      rows = rows.map(r => r.slice().sort((a, b) => (a.x ?? 50) - (b.x ?? 50)));
      return gk ? [[gk], ...rows] : rows;
    }

    function layoutPitch(pitch, m, hasPlayers) {
      const W = pitch.clientWidth - 4;           // bordure de 2 px
      const dot = W < 360 ? 24 : 26;
      pitch.style.setProperty('--dot', dot + 'px');
      const L = m.lineups || {};
      const coul = couleursMatch(m);
      const sides = [
        { side: 'home', rows: lineupRows(L.home || [], m.home_team.formation || L.home_formation, 'home') },
        { side: 'away', rows: lineupRows(L.away || [], m.away_team.formation || L.away_formation, 'away') },
      ];
      const nodes = [];
      sides.forEach(S => S.rows.forEach((row, r) => row.forEach((p, i) => {
        const el = document.createElement('div');
        el.className = 'player-node';
        if (hasPlayers && p.id) { el.setAttribute('onclick', `openPlayer('${esc(p.id)}')`); el.setAttribute('role', 'button'); }
        const full = (hasPlayers && m.players[p.id] && m.players[p.id].name) || p.name;
        el.title = full;
        el.innerHTML = `<div class="player-dot ${S.side}${coul[S.side].bord ? ' lis' : ''}">${esc(p.number)}`
          + (p.rating ? `<span class="pn-rating rating-badge ${ratingClass(p.rating)}">${esc(Number(p.rating).toFixed(1))}</span>` : '')
          + `</div><span class="player-label"></span>`
          + (p.subbed_out ? `<span class="pn-out">↓${esc(p.subbed_out)}</span>` : '');
        pitch.appendChild(el);
        nodes.push({ el, p, side: S.side, row: r, k: row.length, i, full, label: el.querySelector('.player-label'), R: S.rows.length });
      })));
      // noms : le plus long qui tient dans la place d'un joueur de sa ligne (nom, initiale + nom, ellipse en dernier recours)
      nodes.forEach(n => {
        const pre = (n.p.captain ? '© ' : '') + (n.p.potm ? '⭐ ' : '');
        const maxW = Math.min(96, Math.max(48, (W - 8) / n.k - 14));
        const words = String(n.full).trim().split(/\s+/);
        const cands = [n.p.name];
        if (words.length > 1) {
          cands.push(words[0][0] + '. ' + words.slice(1).join(' '));
          cands.push(words[0][0] + '. ' + words[words.length - 1]);
          cands.push(words[words.length - 1]);
        }
        if (/\S-\S/.test(cands[cands.length - 1])) cands.push(cands[cands.length - 1].replace(/-(\S)\S*$/, '-$1.'));
        let chosen = null;
        for (const c of cands) {
          n.label.textContent = pre + c;
          if (n.label.scrollWidth <= maxW) { chosen = c; break; }
        }
        if (chosen === null) {
          n.label.textContent = pre + cands[0]; n.label.style.fontSize = '0.57rem';
          if (n.label.scrollWidth > maxW) { n.label.style.fontSize = ''; n.label.textContent = pre + cands[cands.length - 1]; n.label.style.maxWidth = maxW + 'px'; }
        }
      });
      const H = Math.max(...nodes.map(n => n.el.offsetHeight));
      const sizes = nodes.map(n => ({ w: n.el.offsetWidth, h: n.el.offsetHeight }));
      const Rmax = Math.max(...sides.map(S => S.rows.length));
      let Hh = Math.max(260, 10 + H + 36 * (Rmax - 1));
      for (let attempt = 0; attempt < 14; attempt++, Hh += 24) {
        const Hc = Hh * 2;
        const pts = nodes.map((n, idx) => {
          const c0 = H / 2 + 5, c1 = Hh - H / 2 - 5;
          const yr = n.R > 1 ? c0 + (c1 - c0) * n.row / (n.R - 1) : c0;
          const y0 = n.side === 'home' ? yr : Hc - yr;
          let x;
          if (n.k === 1) x = Math.max(0.2, Math.min(0.8, (n.p.x ?? 50) / 100)) * W;
          else x = W * (0.13 + 0.74 * n.i / (n.k - 1));
          const hw = sizes[idx].w / 2;
          return { x: Math.max(hw + 2, Math.min(W - hw - 2, x)), y: y0, y0, hw, hh: sizes[idx].h / 2, side: n.side };
        });
        const gap = 3;
        for (let it = 0; it < 120; it++) {
          let moved = false;
          for (let a = 0; a < pts.length; a++) for (let b = a + 1; b < pts.length; b++) {
            const A = pts[a], B = pts[b];
            const dx = B.x - A.x, dy = B.y - A.y;
            const ox = A.hw + B.hw + gap - Math.abs(dx), oy = A.hh + B.hh + gap - Math.abs(dy);
            if (ox > 0 && oy > 0) {
              moved = true;
              if (ox <= oy * 1.4 || Math.abs(dy) < 6) {
                const s = dx === 0 ? (a % 2 ? 1 : -1) : Math.sign(dx);
                A.x -= s * ox / 2; B.x += s * ox / 2;
              } else {
                const s = Math.sign(dy);
                A.y -= s * oy / 2; B.y += s * oy / 2;
              }
            }
          }
          pts.forEach(P => {
            P.x = Math.max(P.hw + 2, Math.min(W - P.hw - 2, P.x));
            const lim = 16;
            P.y = Math.max(P.y0 - lim, Math.min(P.y0 + lim, P.y));
            P.y = P.side === 'home' ? Math.min(P.y, Hh - P.hh - 2) : Math.max(P.y, Hh + P.hh + 2);
            P.y = Math.max(P.hh + 2, Math.min(Hc - P.hh - 2, P.y));
          });
          if (!moved) break;
        }
        let bad = false;
        for (let a = 0; a < pts.length && !bad; a++) for (let b = a + 1; b < pts.length; b++) {
          const A = pts[a], B = pts[b];
          if (A.hw + B.hw - Math.abs(B.x - A.x) > 0.5 && A.hh + B.hh - Math.abs(B.y - A.y) > 0.5) { bad = true; break; }
        }
        pitch.style.height = (Hc + 4) + 'px';
        nodes.forEach((n, idx) => { n.el.style.left = pts[idx].x.toFixed(1) + 'px'; n.el.style.top = pts[idx].y.toFixed(1) + 'px'; });
        if (!bad) break;
      }
    }

    // ===== COULEURS : début =====
    // Couleurs d'équipe (règle du 25/11/2026, voir couleurs.py : jumeau exact, comparé par `python couleurs.py --test`).
    // Maillot porté dans le match > couleur principale du club (clubs/index.json) > repli neutre ; ΔE76 < 25 : l'équipe à
    // l'extérieur prend sa secondaire, sinon un repli neutre. Texte blanc / noir selon le contraste WCAG, liseré pour les aplats
    // quasi blancs ou noirs, `encre` = couleur lisible comme texte sur la page.
    const COUL_SEUIL_DE = 25, COUL_SEUIL_TEXTE = 4.5, COUL_LUM_BLANC = 0.85, COUL_LUM_NOIR = 0.04;
    const COUL_NEUTRE_DOM = '#38bdf8', COUL_NEUTRE_EXT = '#f43f5e';
    const COUL_FONDS_PAGE = ['#151c28', '#0b0f17', '#202b3d'];   // --bg-card, --bg-main, --bg-elevated
    const COUL_BORDS = ['#e2e8f0', '#7c8799', '#1e293b'];
    const coulValide = (h) => typeof h === 'string' && /^#[0-9a-fA-F]{6}$/.test(h);
    const coulRgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    const coulHex = (r, g, b) => '#' + [r, g, b].map(x => Math.max(0, Math.min(255, Math.floor(x + 0.5))).toString(16).padStart(2, '0')).join('');
    const coulLin = (v) => { const s = v / 255; return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4); };
    function coulLuminance(h) { const [r, g, b] = coulRgb(h); return 0.2126 * coulLin(r) + 0.7152 * coulLin(g) + 0.0722 * coulLin(b); }
    function coulContraste(a, b) {
      const la = coulLuminance(a), lb = coulLuminance(b);
      return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
    }
    function coulLab(h) {
      const [R, G, B] = coulRgb(h).map(coulLin);
      const x = (0.4124564 * R + 0.3575761 * G + 0.1804375 * B) / 0.95047;
      const y = 0.2126729 * R + 0.7151522 * G + 0.0721750 * B;
      const z = (0.0193339 * R + 0.1191920 * G + 0.9503041 * B) / 1.08883;
      const f = (t) => t > 216 / 24389 ? Math.pow(t, 1 / 3) : (24389 / 27 * t + 16) / 116;
      const fx = f(x), fy = f(y), fz = f(z);
      return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
    }
    function coulDeltaE76(a, b) {
      const p = coulLab(a), q = coulLab(b);
      return Math.sqrt((p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2 + (p[2] - q[2]) ** 2);
    }
    const coulTexteSur = (fond) => coulContraste('#ffffff', fond) >= coulContraste('#000000', fond) ? '#ffffff' : '#000000';
    function coulBordPour(fond, fondsPage) {
      const lum = coulLuminance(fond);
      if (!(lum > COUL_LUM_BLANC || lum < COUL_LUM_NOIR)) return null;
      let best = COUL_BORDS[0], score = -1;
      for (const b of COUL_BORDS) {
        const s = Math.min(coulContraste(b, fond), ...fondsPage.map(p => coulContraste(b, p)));
        if (s > score + 1e-9) { best = b; score = s; }
      }
      return best;
    }
    function coulEncrePour(fond, fondsPage) {
      const sombre = fondsPage.reduce((s, f) => s + coulLuminance(f), 0) / fondsPage.length < 0.5;
      const cible = sombre ? '#ffffff' : '#000000';
      const [r0, g0, b0] = coulRgb(fond), [r1, g1, b1] = coulRgb(cible);
      for (let k = 0; k <= 20; k++) {
        const t = k / 20, c = coulHex(r0 + (r1 - r0) * t, g0 + (g1 - g0) * t, b0 + (b1 - b0) * t);
        if (Math.min(...fondsPage.map(p => coulContraste(c, p))) >= COUL_SEUIL_TEXTE) return c;
      }
      return cible;
    }
    function coulHabiller(fond, source, fondsPage) {
      return { fond, texte: coulTexteSur(fond), bord: coulBordPour(fond, fondsPage), encre: coulEncrePour(fond, fondsPage), source };
    }
    function coulChoix(eq, neutre) {
      if (coulValide(eq.maillot)) return [eq.maillot.toLowerCase(), 'maillot'];
      if (coulValide(eq.principale)) return [eq.principale.toLowerCase(), 'club'];
      return [neutre, 'neutre'];
    }
    // dom / ext : { maillot, principale, secondaire } (clés facultatives) -> { home, away } = { fond, texte, bord, encre, source }
    function coulChoisir(dom, ext, fondsPage) {
      let [h, hs] = coulChoix(dom, COUL_NEUTRE_DOM), [a, as] = coulChoix(ext, COUL_NEUTRE_EXT);
      if (coulDeltaE76(h, a) < COUL_SEUIL_DE) {
        const cands = [];
        if (coulValide(ext.secondaire)) cands.push([ext.secondaire.toLowerCase(), 'secondaire']);
        cands.push([COUL_NEUTRE_EXT, 'neutre'], [COUL_NEUTRE_DOM, 'neutre']);
        for (const [hx, src] of cands) {
          if (coulDeltaE76(h, hx) >= COUL_SEUIL_DE) { a = hx; as = src; break; }
        }
      }
      return { home: coulHabiller(h, hs, fondsPage), away: coulHabiller(a, as, fondsPage) };
    }
    // Fonds de page réels (thème courant) ; repli = valeurs du thème sombre
    function coulFondsPage() {
      try {
        const cs = getComputedStyle(document.documentElement);
        const l = ['--bg-card', '--bg-main', '--bg-elevated'].map(k => cs.getPropertyValue(k).trim());
        return l.every(coulValide) ? l : COUL_FONDS_PAGE;
      } catch (e) { return COUL_FONDS_PAGE; }
    }
    // LA fonction de couleurs d'un match : { home: { fond, texte, bord, encre, source }, away: { … } }
    function couleursMatch(m) {
      const eq = (t) => {
        const c = (clubIndex && t && t.id != null && clubIndex.get(String(t.id)) || {}).couleurs || {};
        return { maillot: t && t.shirt_color, principale: c.principale, secondaire: c.secondaire };
      };
      return coulChoisir(eq(m.home_team), eq(m.away_team), coulFondsPage());
    }
    // Couleur d'un club seul (accent de sa fiche) : principale du club, sinon accent neutre de la page
    function couleurClub(id) {
      const c = (clubIndex && id != null && clubIndex.get(String(id)) || {}).couleurs || {};
      return coulHabiller(coulValide(c.principale) ? c.principale.toLowerCase() : COUL_NEUTRE_DOM, coulValide(c.principale) ? 'club' : 'neutre', coulFondsPage());
    }
    // Variables CSS --<pref>-color / -ink / -on / -bord d'une équipe (un style en ligne, valeurs déjà validées en hex)
    const coulVars = (pref, c) => `--${pref}-color:${c.fond};--${pref}-ink:${c.encre};--${pref}-on:${c.texte};--${pref}-bord:${c.bord || 'transparent'};`;
    // ===== COULEURS : fin =====
    const COUL_PROPS = ['color', 'ink', 'on', 'bord'];
    // Pose les variables CSS des deux équipes d'un match sur un élément (fiche de match, tuile, carte)
    function coulPoserMatch(el, m) {
      const c = couleursMatch(m);
      for (const [pref, k] of [['home', c.home], ['away', c.away]]) {
        el.style.setProperty(`--${pref}-color`, k.fond); el.style.setProperty(`--${pref}-ink`, k.encre);
        el.style.setProperty(`--${pref}-on`, k.texte); el.style.setProperty(`--${pref}-bord`, k.bord || 'transparent');
      }
      return c;
    }
    const coulStyleMatch = (m) => { const c = couleursMatch(m); return coulVars('home', c.home) + coulVars('away', c.away); };
    function coulPoserClub(el, id) {
      const c = couleurClub(id);
      el.style.setProperty('--club-color', c.fond); el.style.setProperty('--club-ink', c.encre);
      el.style.setProperty('--club-on', c.texte); el.style.setProperty('--club-bord', c.bord || 'transparent');
    }

    // ---------- Momentum (en tête de l'onglet Stats) ----------
    const MO = { W: 300, X0: 5, MID: 66, AMP: 60, BOTTOM: 132 };
    function momentumHtml(m) {
      const pts = m.momentum || [];
      if (pts.length === 0) {
        return `<h4 class="st-sec">Momentum</h4><div class="empty-state">Actions du match indisponibles : pas de graphique de pression pour cette rencontre.</div>`;
      }
      const { W, X0, MID, AMP, BOTTOM } = MO;
      const n = pts.length;
      const xOf = (i) => X0 + (n > 1 ? i * W / (n - 1) : W / 2);
      const yOf = (v) => MID - Math.max(-100, Math.min(100, Number(v) || 0)) / 100 * AMP;
      const labelOf = (p) => p.label || `${p.minute}'`;
      const idxOfLabel = (lbl, minute) => {
        let i = pts.findIndex(p => labelOf(p) === lbl);
        if (i < 0) i = pts.reduce((best, p, j) => Math.abs(p.minute - minute) < Math.abs(pts[best].minute - minute) ? j : best, 0);
        return i;
      };
      const line = pts.map((p, i) => `${xOf(i).toFixed(2)},${yOf(p.value).toFixed(2)}`).join(' L ');
      const area = `M ${xOf(0).toFixed(2)},${MID} L ${line} L ${xOf(n - 1).toFixed(2)},${MID} Z`;
      const htIdx = pts.findIndex(p => p.phase === 'SECOND_HALF');
      const htX = htIdx > 0 ? (xOf(htIdx - 1) + xOf(htIdx)) / 2 : null;
      const ticks = [15, 30, 45, 60, 75, 90].filter(mn => !(mn === 45 && htIdx > 0)).map(mn => {
        const i = pts.findIndex(p => p.minute === mn && !String(labelOf(p)).includes('+'));
        return i < 0 ? '' : `<text x="${xOf(i).toFixed(1)}" y="${BOTTOM + 9}" font-size="8" fill="#94a3b8" text-anchor="middle">${mn}'</text>`;
      }).join('');
      const cm = couleursMatch(m);
      const goals = (m.events || []).filter(e => e.type === 'goal').map(e => {
        const x = xOf(idxOfLabel(e.minute_label, e.minute));
        const home = e.team === 'home';
        const y = home ? 6 : BOTTOM - 4;
        return `<line x1="${x.toFixed(1)}" y1="${home ? 12 : MID}" x2="${x.toFixed(1)}" y2="${home ? MID : BOTTOM - 10}" stroke="${home ? cm.home.fond : cm.away.fond}" stroke-opacity="0.55" stroke-width="0.6" stroke-dasharray="1.5,1.5" />
                <text x="${x.toFixed(1)}" y="${y}" font-size="9" text-anchor="middle" dominant-baseline="middle">⚽</text>`;
      }).join('');
      return `
        <h4 class="st-sec">Momentum ${infoBtn(`<p>⚽ but · MT mi-temps · au-dessus de la ligne : pression de ${esc(m.home_team.short)}, en dessous : ${esc(m.away_team.short)}.</p><p>Indice de pression minute par minute (lissé sur environ 5 min), calculé à partir des actions officielles UEFA : buts, tirs, attaques dangereuses, corners, arrêts adverses, hors-jeu et coups francs obtenus.</p>`, 'Comment lire le momentum')}</h4>
        <div class="momentum-box">
          <div class="momentum-legend">
            <span style="color:var(--home-ink)">▲ ${esc(m.home_team.short)}</span>
            <span id="momentum-readout" style="color:var(--text-muted);font-weight:500">Touchez le graphique</span>
            <span style="color:var(--away-ink)">▼ ${esc(m.away_team.short)}</span>
          </div>
          <svg id="momentum-svg" data-noswipe="1" viewBox="0 0 310 ${BOTTOM + 14}" style="width:100%;height:auto;touch-action:pan-y;display:block">
            <defs>
              <clipPath id="clip-home"><rect x="0" y="0" width="310" height="${MID}" /></clipPath>
              <clipPath id="clip-away"><rect x="0" y="${MID}" width="310" height="${BOTTOM - MID}" /></clipPath>
              <linearGradient id="grad-home" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${cm.home.fond}" stop-opacity="0.95"/><stop offset="1" stop-color="${cm.home.fond}" stop-opacity="0.25"/></linearGradient>
              <linearGradient id="grad-away" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${cm.away.fond}" stop-opacity="0.25"/><stop offset="1" stop-color="${cm.away.fond}" stop-opacity="0.95"/></linearGradient>
            </defs>
            ${htX !== null ? `<line x1="${htX.toFixed(1)}" y1="2" x2="${htX.toFixed(1)}" y2="${BOTTOM}" stroke="#475569" stroke-dasharray="2,2" stroke-width="0.6" /><text x="${htX.toFixed(1)}" y="${BOTTOM + 9}" font-size="8" fill="#94a3b8" text-anchor="middle">MT</text>` : ''}
            <path d="${area}" fill="url(#grad-home)" clip-path="url(#clip-home)"${cm.home.bord ? ` stroke="${cm.home.bord}" stroke-width="0.8"` : ''} />
            <path d="${area}" fill="url(#grad-away)" clip-path="url(#clip-away)"${cm.away.bord ? ` stroke="${cm.away.bord}" stroke-width="0.8"` : ''} />
            <line x1="0" y1="${MID}" x2="310" y2="${MID}" stroke="#475569" stroke-width="0.6" />
            ${goals}${ticks}
            <line id="momentum-cursor" x1="0" y1="2" x2="0" y2="${BOTTOM}" stroke="#e2e8f0" stroke-width="0.5" visibility="hidden" />
          </svg>
        </div>`;
    }

    function bindMomentum(m) {
      const svg = document.getElementById('momentum-svg');
      if (!svg) return;
      const pts = m.momentum || [], n = pts.length;
      const { W, X0, BOTTOM } = MO;
      const xOf = (i) => X0 + (n > 1 ? i * W / (n - 1) : W / 2);
      const readout = document.getElementById('momentum-readout');
      const cursor = document.getElementById('momentum-cursor');
      const show = (evt) => {
        const r = svg.getBoundingClientRect();
        const x = (evt.clientX - r.left) / r.width * 310;
        const i = Math.max(0, Math.min(n - 1, Math.round((x - X0) / (n > 1 ? W / (n - 1) : 1))));
        const p = pts[i];
        const who = p.value > 15 ? `pression ${m.home_team.short}` : p.value < -15 ? `pression ${m.away_team.short}` : 'équilibré';
        readout.textContent = `${p.label || p.minute + "'"} · ${who}`;
        cursor.setAttribute('x1', xOf(i)); cursor.setAttribute('x2', xOf(i)); cursor.setAttribute('visibility', 'visible');
      };
      svg.addEventListener('pointermove', show);
      svg.addEventListener('pointerdown', show);
    }

    // ---------- Stats : rubriques, possession en grand, lignes à barre divergente ----------
    const STAT_GROUPS = [
      ['Tirs', ['attempts', 'attempts_on_target', 'attempts_off_target', 'attempts_blocked', 'shot_in_penalty_area']],
      ['Construction / passes', ['passes_completed', 'passes_accuracy', 'key_passes', 'delivery_into_penalty_area', 'cross_attempted']],
      ['Attaque', ['attacks', 'counterattack', 'corners', 'offsides']],
      ['Défense / gardien', ['saves', 'recovered_ball']],
      ['Discipline', ['fouls_committed', 'yellow_cards', 'red_cards']],
      ['Physique', ['distance_covered', 'top_speed', 'sprints']],
    ];
    const fmtStat = (v, pct) => {
      const n = Number(v);
      const t = Number.isFinite(n) ? n.toLocaleString('fr-FR', { maximumFractionDigits: 1 }) : String(v ?? '—');
      return pct ? t + ' %' : t;
    };

    function statsHtml(m) {
      const statsObj = m.stats || {};
      const hasHalves = (statsObj['1st'] || []).length > 0 && (statsObj['2nd'] || []).length > 0;
      const period = hasHalves ? currentStatsPeriod : 'all';
      const items = statsObj[period] || [];
      const pills = hasHalves ? `
        <div class="period-pills">
          <button class="period-btn ${period === 'all' ? 'active' : ''}" onclick="switchStatsPeriod('all')">Match complet</button>
          <button class="period-btn ${period === '1st' ? 'active' : ''}" onclick="switchStatsPeriod('1st')">1re mi-temps</button>
          <button class="period-btn ${period === '2nd' ? 'active' : ''}" onclick="switchStatsPeriod('2nd')">2e mi-temps</button>
        </div>` : '';
      if (!items.length) return `<h4 class="st-sec">Statistiques</h4>${pills}<div class="empty-state">Statistiques indisponibles.</div>`;
      const row = (s) => {
        const h = Number(s.home), a = Number(s.away);
        const pct = /\(%\)/.test(s.label || '');
        const label = String(s.label || '').replace(/\s*\(%\)/, '');
        const total = (Number.isFinite(h) ? h : 0) + (Number.isFinite(a) ? a : 0);
        const hp = total > 0 ? Math.round(h / total * 100) : 0, ap = total > 0 ? 100 - hp : 0;
        const dh = h > a ? 'dom' : h === a ? 'eq' : '', da = a > h ? 'dom' : h === a ? 'eq' : '';
        return `
          <div class="st-row">
            <div class="st-top">
              <span class="st-v home ${dh}">${esc(fmtStat(s.home, pct))}</span>
              <span class="st-l">${esc(label)}</span>
              <span class="st-v away ${da}">${esc(fmtStat(s.away, pct))}</span>
            </div>
            <div class="st-bar">
              <span class="st-half l"><i class="${a > h ? 'dim' : ''}" style="width:${hp}%"></i></span>
              <span class="st-half r"><i class="${h > a ? 'dim' : ''}" style="width:${ap}%"></i></span>
            </div>
          </div>`;
      };
      const poss = items.find(s => s.key === 'ball_possession' && Number.isFinite(Number(s.home)) && Number.isFinite(Number(s.away)) && Number(s.home) + Number(s.away) > 0);
      const possHtml = poss ? (() => {
        const t = Number(poss.home) + Number(poss.away), hp = Number(poss.home) / t * 100;
        return `<div class="poss"><div class="poss-lbl">Possession</div>
          <div class="poss-vals"><span class="poss-v home">${esc(fmtStat(poss.home, true))}</span><span class="poss-v away">${esc(fmtStat(poss.away, true))}</span></div>
          <div class="poss-bar"><i class="h" style="width:${hp.toFixed(1)}%"></i><i class="a" style="width:${(100 - hp).toFixed(1)}%"></i></div></div>`;
      })() : '';
      const used = new Set(poss ? ['ball_possession'] : []);
      const groups = STAT_GROUPS.map(([title, keys]) => {
        const rows = items.filter(s => keys.includes(s.key));
        rows.forEach(s => used.add(s.key));
        return rows.length ? `<h4 class="st-sec">${esc(title)}</h4>${rows.map(row).join('')}` : '';
      }).join('');
      const rest = items.filter(s => !used.has(s.key));
      const restHtml = rest.length ? `<h4 class="st-sec">Autres</h4>${rest.map(row).join('')}` : '';
      const note = period !== 'all' ? 'Par mi-temps : décompte des actions officielles UEFA de la période.' : 'Source : statistiques officielles UEFA.';
      return `<h4 class="st-sec">Statistiques ${infoBtn(`<p>${esc(note)}</p>`, 'Source des statistiques')}</h4>${pills}
        <div class="st-wrap">
          <div class="st-head">
            <span class="st-team home"><i class="sw"></i>${flag(m.home_team)}<span>${esc(m.home_team.short || m.home_team.name)}</span></span>
            <span class="st-team away"><span>${esc(m.away_team.short || m.away_team.name)}</span>${flag(m.away_team)}<i class="sw"></i></span>
          </div>
          ${possHtml}${groups}${restHtml}
        </div>`;
    }

    // ---------- Fermeture d'une feuille par glissement vers le bas (fiche de match ET fiche joueur) ----------
    // Part de la poignée / de l'en-tête (headSel), ou du contenu déjà tout en haut (scrollTop = 0) ; la feuille suit
    // le doigt, se ferme au-delà de 25 % de sa hauteur ou d'un geste rapide, sinon revient en place.
    function attachSheetDrag(sheet, scroller, headSel, onClose) {
      let st = null;
      const reduce = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      sheet.addEventListener('touchstart', (e) => {
        st = null;
        if (e.touches.length !== 1) return;
        const head = !!e.target.closest(headSel);
        const inBody = scroller.contains(e.target);
        if (!head && !(inBody && scroller.scrollTop <= 0)) return;
        st = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now(), head, drag: false, dy: 0, top: scroller.scrollTop };
        sheet.classList.remove('settle');
      }, { passive: true });
      sheet.addEventListener('touchmove', (e) => {
        if (!st) return;
        const dx = e.touches[0].clientX - st.x, dy = e.touches[0].clientY - st.y;
        if (!st.drag) {
          if (!(dy > 8 && dy > 1.5 * Math.abs(dx))) { if (Math.abs(dx) > 12 || dy < -8) st = null; return; }
          if (!st.head && scroller.scrollTop > 0) { st = null; return; }
          st.drag = true;
          // Le glissement de feuille possède tout le reste du geste : le contenu ne défile plus jusqu'au relâchement.
          scroller.style.overflowY = 'hidden';
          closeInfo();
        }
        if (e.cancelable) e.preventDefault();
        scroller.scrollTop = st.top;
        st.dy = Math.max(0, dy);
        sheet.style.transform = `translateY(${st.dy}px)`;
      }, { passive: false });
      const end = () => {
        if (!st) return;
        const s = st; st = null;
        if (!s.drag) return;
        scroller.style.overflowY = '';
        scroller.scrollTop = s.top;
        const v = s.dy / Math.max(1, Date.now() - s.t);
        const close = s.dy > sheet.offsetHeight * 0.25 || (v > 0.4 && s.dy > 30);
        const done = () => { sheet.classList.remove('settle'); sheet.style.transform = ''; };
        if (reduce()) { if (close) onClose(); done(); return; }
        sheet.classList.add('settle');
        sheet.style.transform = close ? 'translateY(100%)' : 'translateY(0)';
        setTimeout(() => { if (close) onClose(); done(); }, 230);
      };
      sheet.addEventListener('touchend', end, { passive: true });
      sheet.addEventListener('touchcancel', end, { passive: true });
    }
    attachSheetDrag(document.getElementById('modal-sheet'), document.getElementById('modal-body-content'), '.sheet-handle, .modal-header', () => closeMatchModal());
    attachSheetDrag(document.getElementById('player-sheet'), document.getElementById('player-body'), '.sheet-handle, .ps-head', () => closePlayer());
    attachSheetDrag(document.getElementById('tour-sheet'), document.getElementById('tour-list'), '.sheet-handle, .tour-head', () => closeTourMenu());
    attachSheetDrag(document.getElementById('club-sheet'), document.getElementById('club-body'), '.sheet-handle, .club-head', () => closeClub());

    // ---------- Glissement horizontal entre onglets : COMPOSANT UNIQUE ----------
    // slideIn(el, 'slide-l' | 'slide-r') : transition d'arrivée du nouveau contenu (désactivée si prefers-reduced-motion).
    function slideIn(el, cls) {
      el.classList.remove('slide-l', 'slide-r');
      if (cls) { void el.offsetWidth; el.classList.add(cls); }
    }
    // attachTabSwipe({ zone, stop, tabs, current, go }) : un geste horizontal dans `zone()` passe à l'onglet voisin.
    //   zone()    élément sensible (null = désactivé) ; stop() borne de la remontée DOM pour détecter un défilement en X
    //   tabs()    identifiants des onglets dans l'ordre ; current() onglet actif ; go(id, 'slide-l' | 'slide-r') change d'onglet
    // Règles communes à tous les usages : seuil 56 px, |dx| >= 1,5 |dy| (le défilement vertical n'est jamais gêné), pas de
    // boucle (aucun effet au premier / dernier onglet), ignoré sur un élément défilant en X ou marqué data-noswipe, et sur les
    // champs de saisie. Écoute en fin de geste seulement (aucun preventDefault) : le défilement vertical reste natif.
    // Réutilisé par l'accueil (coupes), la fiche de match (Déroulé / Compos / Stats) et toute future feuille (fiche club).
    function attachTabSwipe({ zone, stop, tabs, current, go, min = 56 }) {
      let sx = 0, sy = 0, ok = false;
      const scrollsX = (el, limit) => {
        for (; el && el !== limit; el = el.parentElement) {
          if (el.dataset && el.dataset.noswipe) return true;
          if (el.scrollWidth > el.clientWidth + 1 && /(auto|scroll)/.test(getComputedStyle(el).overflowX)) return true;
        }
        return false;
      };
      document.addEventListener('touchstart', (e) => {
        const z = zone();
        ok = !!(z && e.touches.length === 1 && z.contains(e.target) && !e.target.closest('input, select, textarea') &&
                !scrollsX(e.target, stop ? stop() : z.parentElement));
        if (ok) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
      }, { passive: true });
      document.addEventListener('touchcancel', () => { ok = false; }, { passive: true });
      document.addEventListener('touchend', (e) => {
        if (!ok) return;
        ok = false;
        const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
        if (Math.abs(dx) < min || Math.abs(dx) < 1.5 * Math.abs(dy)) return;
        const list = tabs(), i = list.indexOf(current()), j = i + (dx < 0 ? 1 : -1);
        if (i < 0 || j < 0 || j >= list.length) return;
        closeInfo();
        go(list[j], dx < 0 ? 'slide-l' : 'slide-r');
      }, { passive: true });
    }
    const MODAL_VIEWS = ['events', 'lineups', 'stats'];
    attachTabSwipe({   // fiche de match
      zone: () => document.getElementById('modal-body-content'),
      stop: () => document.getElementById('modal-sheet'),
      tabs: () => MODAL_VIEWS, current: () => currentModalView, go: switchModalView,
    });
    attachTabSwipe({   // accueil : LDC / LE / LC (la zone s'arrête là où commence une feuille ouverte : elles sont hors de <main>)
      zone: () => document.getElementById('main-zone'),
      stop: () => document.body,
      tabs: () => COMP_KEYS, current: () => currentComp, go: switchCompetition,
    });

    // ---------- Empilement des feuilles : la dernière ouverte est au-dessus (fiche de match, de club, de joueur) ----------
    // Chaque feuille (backdrop) reçoit un z-index croissant à l'ouverture : une fiche club ouverte depuis un match est au-dessus
    // du match, un match ouvert depuis une fiche club au-dessus du club, un joueur au-dessus de ce qui l'ouvre. La fermeture
    // (bouton, glissement vers le bas, fond, Échap) ne ferme que la feuille du dessus.
    let zTop = 100;
    function bringToFront(el) { el.style.zIndex = String(++zTop); }
    const SHEET_IDS = ['match-modal', 'club-modal', 'player-modal', 'tour-modal'];
    function syncBodyLock() {
      document.body.style.overflow = SHEET_IDS.some(id => document.getElementById(id).classList.contains('open')) ? 'hidden' : '';
    }
    function closeTopSheet() {
      const ouvertes = SHEET_IDS.map(id => document.getElementById(id)).filter(el => el.classList.contains('open'));
      if (!ouvertes.length) return;
      const haut = ouvertes.reduce((a, b) => Number(b.style.zIndex || 0) > Number(a.style.zIndex || 0) ? b : a);
      if (haut.id === 'player-modal') closePlayer(); else if (haut.id === 'club-modal') closeClub(); else if (haut.id === 'tour-modal') closeTourMenu(); else closeMatchModal();
    }
    let toastTimer = null;
    function toast(msg) {
      let t = document.getElementById('toast');
      if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
      t.textContent = msg; t.hidden = false;
      clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
    }

    // « Soirée du 2026-11-04 » -> « Soirée du mercredi 4 novembre » (les libellés enregistrés portent une date ISO)
    function dateEnToutesLettres(txt) {
      return String(txt).replace(/\b(\d{4})-(\d{2})-(\d{2})\b/g, (m, a, b, c) => {
        const d = new Date(`${a}-${b}-${c}T12:00:00Z`);
        return isNaN(d) ? m : d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
      });
    }

    // ---------- Fiches de club : clubs/index.json (108 clubs) + clubs/<id UEFA>.json ----------
    const CLUB_VIEWS = ['apercu', 'matchs', 'stats', 'effectif'];
        let clubIndex = null;            // Map id -> entrée de l'index ; null = pas d'index (aucun lien vers une fiche)
    const clubCache = new Map();
    let activeClub = null, currentClubView = 'apercu', clubToken = 0;

    async function loadClubIndex() {
      const d = await fetchJson('clubs/index.json');
      clubIndex = d && Array.isArray(d.clubs) ? new Map(d.clubs.map(c => [String(c.id), c])) : null;
    }
    const hasClub = (id) => !!(clubIndex && id != null && clubIndex.has(String(id)));
    // Lien vers la fiche d'un club (texte simple si le club n'a pas de fiche) ; `html` est déjà échappé par l'appelant
    function clubLink(id, html) {
      return hasClub(id) ? `<button type="button" class="club-link" onclick="event.stopPropagation(); openClub('${esc(id)}')">${html}</button>` : html;
    }

    const jourCourt = (iso) => iso ? new Date(iso + 'T12:00:00Z').toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }) : '';
    const jourLong = (iso) => iso ? new Date(iso + 'T12:00:00Z').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }) : '';
    const heureParis = (isoUtc) => isoUtc ? new Date(isoUtc).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris' }) : '';
    const nf = (v) => (typeof v === 'number') ? v.toLocaleString('fr-FR', { maximumFractionDigits: 1 }) : v;
    const lienSur = (u) => /^https?:\/\//i.test(u || '') ? u : '';

    async function loadClub(id) {
      if (clubCache.has(id)) return clubCache.get(id);
      const f = await fetchJson('clubs/' + encodeURIComponent(id) + '.json');
      if (f) clubCache.set(id, f);
